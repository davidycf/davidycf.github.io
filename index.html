<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan 2027">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Japan 2027 Family Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a railway line map. Each city is a line colour; days are stations on it;
   every day opens under a 駅名標-style station sign. Bottom tab bar switches 行程 / 吃 / 买 / 玩 / 附录. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#15191C; --muted:#586168; --rule:#D3D9D6;
  --tokyo:#2256A3; --hakone:#2A7A50; --osaka:#CC5420; --travel:#66717C; --night:#4D4A93; --misc:#7A6A3A;
  --check:#A8302E; --check-bg:#F6E6E3; --on-line:#FFFFFF;
  --f-ja:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans SC",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-ro:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --r:10px; --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101416; --surface:#1A1F22; --sunk:#151A1C; --ink:#E6EAE8; --muted:#98A2A7; --rule:#2B3337;
  --tokyo:#78A2E6; --hakone:#5EBB89; --osaka:#F08A55; --travel:#A0AAB4; --night:#A4A1EA; --misc:#CDB77A;
  --check:#F08A84; --check-bg:#2E1E1D; --on-line:#0E1214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101416; --surface:#1A1F22; --sunk:#151A1C; --ink:#E6EAE8; --muted:#98A2A7; --rule:#2B3337;
  --tokyo:#78A2E6; --hakone:#5EBB89; --osaka:#F08A55; --travel:#A0AAB4; --night:#A4A1EA; --misc:#CDB77A;
  --check:#F08A84; --check-bg:#2E1E1D; --on-line:#0E1214; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:15.5px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--tokyo);outline-offset:2px;border-radius:4px}
[lang="ja"]{font-family:var(--f-ja)}
.ro{font-family:var(--f-ro);letter-spacing:.04em}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.c-tokyo{--line:var(--tokyo)} .c-hakone{--line:var(--hakone)} .c-osaka{--line:var(--osaka)}
.c-dep,.c-ret{--line:var(--travel)} .c-night{--line:var(--night)} .c-misc{--line:var(--misc)}

/* ---------- masthead ---------- */
.mast{padding-block:22px 6px}
.eyebrow{font-family:var(--f-ro);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast h1{font-family:var(--f-ja);font-weight:700;font-size:28px;letter-spacing:.02em;margin-top:4px}
.mast h1 small{display:block;font-family:var(--f-zh);font-weight:500;font-size:15px;color:var(--muted);letter-spacing:0;margin-top:2px}
.status{margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.status b{font-family:var(--f-ro);font-size:30px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.status a{font-weight:500;color:var(--ink)}

/* route strip: the whole trip as one line */
.route{margin-top:18px;display:grid;grid-template-columns:52px 5fr 2.6fr 5fr 44px;align-items:start;gap:0}
.route .seg{position:relative;padding-top:20px;min-width:0}
.route .seg::before{content:"";position:absolute;left:0;right:0;top:7px;height:5px;background:var(--line)}
.route .seg::after{content:"";position:absolute;left:0;top:3px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.route .seg.end::before{right:auto;width:0}
.route .nm{display:block;font-family:var(--f-ja);font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap}
.route .nt{display:block;font-family:var(--f-ro);font-size:12px;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.route .c-dep .nm,.route .c-ret .nm{font-family:var(--f-ro);font-weight:600}

/* ---------- views ---------- */
.view[hidden]{display:none}
.vhead{padding-block:22px 10px}
.vhead h2{font-size:24px;font-weight:700}
.vhead h2 .k{font-family:var(--f-ja);display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);text-align:center;line-height:38px;font-size:19px;margin-right:10px;vertical-align:-4px}
.vhead p{color:var(--muted);margin-top:8px;font-size:14.5px;max-width:34em}

/* ---------- itinerary line map ---------- */
.line{list-style:none;margin:10px 0 0;padding:0}
.city-h{display:flex;align-items:baseline;gap:10px;padding:18px 0 6px 0}
.city-h .nm{font-family:var(--f-ja);font-weight:700;font-size:18px;color:var(--line)}
.city-h .ro{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.city-h .cstay{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.stop{position:relative;padding-left:34px}
.stop::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:5px;background:var(--line)}
.stop.first::before{top:26px}.stop.last::before{bottom:calc(100% - 26px)}
.stop::after{content:"";position:absolute;left:5px;top:18px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.stop.today::after{background:var(--line)}
.stop a{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:1px;text-decoration:none;padding:10px 12px 12px;margin-bottom:6px;border-radius:var(--r);min-width:0}
.stop a:hover{background:var(--surface)}
.stop.today a{background:var(--surface);box-shadow:0 0 0 2px var(--line) inset}
.stop .dn{grid-row:1/3;font-family:var(--f-ro);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em;line-height:1.15;text-align:center;padding-top:4px;font-variant-numeric:tabular-nums}
.stop .dn b{display:block;font-size:24px;color:var(--ink);letter-spacing:0}
.stop .t1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.stop .t1 .sn{font-family:var(--f-ja);font-weight:700;font-size:17px}
.stop .t1 .dt{font-size:12.5px;color:var(--muted);font-family:var(--f-ro);letter-spacing:.03em}
.stop .t1 .dt .zh{font-family:var(--f-zh)}
.stop .t2{font-size:14px;color:var(--muted);min-width:0;line-height:1.5}
.tag-today{font-family:var(--f-ro);font-weight:700;font-size:11px;letter-spacing:.12em;background:var(--line);color:var(--surface);padding:1px 7px;border-radius:3px}

/* ---------- day detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:14px;color:var(--muted);text-decoration:none;padding:6px 0}
.sign{margin-top:10px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 var(--rule)}
.sign .top{padding:18px 16px 10px;text-align:center}
.sign .big{font-family:var(--f-ja);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:.06em}
.sign .rom{font-family:var(--f-ro);font-weight:600;font-size:16px;letter-spacing:.12em;margin-top:4px;color:var(--muted)}
.sign .band{background:var(--line);color:var(--on-line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.sign .band a,.sign .band span.nil{display:flex;align-items:center;gap:6px;padding:8px 12px;text-decoration:none;color:var(--on-line);font-size:13px;min-width:0}
.sign .band a:last-child{justify-content:flex-end;text-align:right}
.sign .band .mid{font-family:var(--f-ro);font-weight:700;letter-spacing:.1em;font-size:14px;background:rgba(0,0,0,.18);padding:4px 10px;border-radius:3px;white-space:nowrap}
.sign .band a b{font-family:var(--f-ja);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign .band a small{font-family:var(--f-ro);opacity:.85}
.sign .under{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:12.5px;color:var(--muted);font-family:var(--f-ro);letter-spacing:.04em}
.sign .under .zh{font-family:var(--f-zh)}
.dtitle{margin-top:22px}
.dtitle h2{font-size:22px;font-weight:700}
.dtitle p{margin-top:6px;color:var(--muted)}
.judge{display:inline-flex;margin-top:12px;font-size:13.5px;font-weight:500;border:1.5px solid var(--line);color:var(--line);padding:3px 10px;border-radius:20px}
.blk{margin-top:26px}
.lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.lbl .en{font-family:var(--f-ro);font-weight:600;letter-spacing:.14em}
.lbl::after{content:"";flex:1;height:1px;background:var(--rule)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 12px 30px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:21px;height:21px;border-radius:50%;background:var(--line);color:var(--surface);font:700 12.5px/21px var(--f-ro);text-align:center}
.steps li::after{content:"";position:absolute;left:9.5px;top:26px;bottom:2px;width:2px;background:var(--rule)}
.steps li:last-child::after{display:none}
.stay{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.stay p+p{margin-top:6px}
.stay .l0{font-weight:700}
.trio{display:grid;gap:10px}
.trio section{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.mk{font-family:var(--f-ja);font-weight:700;font-size:16px;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;border:2px solid var(--ink)}
.trio ul{list-style:none;margin:0;padding:0}
.trio li{padding-left:14px;position:relative}
.trio li+li{margin-top:4px}
.trio li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:2px;background:var(--muted)}
.note{margin-top:26px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--check-bg);border-radius:var(--r);padding:12px 14px;font-size:14px}
.stamp{font-family:var(--f-ja);font-weight:700;font-size:12px;color:var(--check);border:1.5px solid var(--check);border-radius:4px;padding:1px 5px;white-space:nowrap;margin-top:2px}
.ax{color:var(--tokyo);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.rel{display:grid;gap:8px}
.rel a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-decoration:none;min-width:0}
.rel .bk{font-family:var(--f-ja);font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--surface);display:grid;place-items:center;font-size:14px}
.rel .tx{min-width:0;line-height:1.4}
.rel .tx b{display:block;font-weight:700;font-size:14.5px}
.rel .tx span{font-size:13px;color:var(--muted)}
.rel .n{font-family:var(--f-ro);font-size:13px;color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.pager a{flex:1;text-decoration:none;background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);min-width:0}
.pager a b{display:block;color:var(--ink);font-size:14.5px}
.pager a.nx{text-align:right}

/* ---------- companion books ---------- */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--rule)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:9px 0;outline:none}
.search button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--f-ja);font-weight:700;font-size:13.5px;padding:5px 11px 5px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--rule);white-space:nowrap}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{padding-top:26px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 108px)}
.sec-h{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.msign{min-width:66px;background:var(--surface);border-radius:6px;overflow:hidden;text-align:center;box-shadow:0 1px 0 var(--rule)}
.msign b{display:block;font-family:var(--f-ja);font-size:15px;padding:5px 8px 3px;line-height:1.2;white-space:nowrap}
.msign span{display:block;background:var(--line);color:var(--on-line);font-family:var(--f-ro);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;white-space:nowrap}
.sec-h .ttl{min-width:0}
.sec-h .ttl .ar{font-family:var(--f-ja);font-weight:700;font-size:14px;color:var(--line)}
.sec-h h3{font-size:19px;font-weight:700}
.sec .lead{margin-top:10px;color:var(--muted);font-size:14.5px}
.sec .hint{margin-top:4px;font-size:13px;color:var(--muted);font-family:var(--f-ja)}
.ents{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ent{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
.ent .hd{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.ent .no{font-family:var(--f-ro);font-weight:700;font-size:14px;color:var(--line);font-variant-numeric:tabular-nums}
.ent h4{margin:0;font-family:var(--f-ja);font-weight:700;font-size:17px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.ent .tg{margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.5}
.ent .bd{margin-top:8px}
.ent .fm{margin-top:8px;font-size:14px;color:var(--muted);padding-left:10px;border-left:2px solid var(--rule)}
.ent .fm b{color:var(--ink);font-weight:500}
.lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lk a{display:inline-flex;align-items:center;gap:4px;font-size:13px;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:4px 9px;max-width:100%;line-height:1.35}
.lk a.map{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.lk a .ar{font-family:var(--f-ro);opacity:.7}
.tip{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:var(--r);border:1.5px dashed var(--line)}
.tip .tl{font-weight:700;color:var(--line);white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
mark{background:color-mix(in srgb,var(--osaka) 28%,transparent);color:inherit;border-radius:2px}

/* ---------- appendix ---------- */
.apx{margin-top:18px;background:var(--surface);border-radius:var(--r);padding:16px;scroll-margin-top:16px}
.apx .id{font-family:var(--f-ro);font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--muted)}
.apx h3{font-size:19px;margin-top:2px}
.apx .ld{color:var(--muted);font-size:14px;margin-top:4px}
.apx h4{font-size:15px;margin:16px 0 4px}
.apx h4+p{margin-top:0}
.apx p+p{margin-top:6px}
.todo{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.todo input{width:19px;height:19px;margin-top:3px;accent-color:var(--hakone);flex:none}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.small{font-size:12.5px;color:var(--muted);margin-top:8px}
.refs{display:grid;gap:12px;margin-top:10px;font-size:14px}
.refs b{display:block}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;color:var(--muted);font-size:11.5px}
.tabs a .g{font-family:var(--f-ja);font-weight:700;font-size:19px;line-height:1.1}
.tabs a.on{color:var(--ink)}
.tabs a.on .g{color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
@media (min-width:560px){.trio{grid-template-columns:1fr}.sign .big{font-size:48px}}
</style>


<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23132c3a'/%3E%3Cpath d='M16 14h32v38H16z' fill='white'/%3E%3Cpath d='M16 14h6v38h-6z' fill='%23247f7d'/%3E%3Ccircle cx='36' cy='29' r='8' fill='%23f57b52'/%3E%3C/svg%3E">
<script >
'use strict';
(() => {
 const media=window.matchMedia('(prefers-color-scheme: dark)');
 const modes=['system','light','dark'];
 let preference='system';
 try{const saved=localStorage.getItem('japan-reading-theme');if(modes.includes(saved))preference=saved;}catch{}
 function resolve(){
  const dark=preference==='dark'||(preference==='system'&&media.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.colorScheme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#101416':'#eef1ef');
  window.dispatchEvent(new CustomEvent('guide-theme-change'));
 }
 window.GUIDE_THEME={get preference(){return preference;},set(mode){
  if(!modes.includes(mode))return;
  preference=mode;try{localStorage.setItem('japan-reading-theme',mode);}catch{}
  resolve();
 }};
 media.addEventListener('change',()=>{if(preference==='system')resolve();});
 resolve();
})();

</script>
</head>
<body>
<div class="wrap">
  <header class="mast" id="mast">
    <div class="eyebrow">Japan 2027 · Family Field Guide</div>
    <h1 lang="ja">東京 → 箱根 → 大阪<small>两大两小 · 2027/3/13–3/27 · 15 天</small></h1>
    <div class="status" id="status"></div>
    <div class="route" aria-label="全程路线">
      <div class="seg c-dep"><span class="nm">ORD</span><span class="nt">3/13</span></div>
      <div class="seg c-tokyo"><span class="nm" lang="ja">東京</span><span class="nt">5 泊 · 3/14</span></div>
      <div class="seg c-hakone"><span class="nm" lang="ja">箱根</span><span class="nt">2 泊</span></div>
      <div class="seg c-osaka"><span class="nm" lang="ja">大阪</span><span class="nt">5 泊 · 3/21</span></div>
      <div class="seg c-ret end"><span class="nm" lang="ja">羽田</span><span class="nt">1 泊</span></div>
    </div>
  </header>

  <main>
    <section class="view" id="v-trip" aria-label="行程"></section>
    <section class="view" id="v-day" hidden></section>
    <section class="view" id="v-eat" hidden></section>
    <section class="view" id="v-shop" hidden></section>
    <section class="view" id="v-see" hidden></section>
    <section class="view" id="v-info" hidden></section>
  </main>

: "DiverCity与DECKS分属不同楼。未来馆2027/4/23才重开，这次仍不列为备选。", "links": [{"label": "DECKS台场错视馆", "url": "https://www.odaiba-decks.com/shop/detail/14260001"}, {"label": "东京Trick Art迷宫馆", "url": "https://trickart.info/lp/"}, {"label": "未来馆2027重开公告", "url": "https://www.miraikan.jst.go.jp/news/general/202608264719.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%BA%AC%E3%83%88%E3%83%AA%E3%83%83%E3%82%AF%E3%82%A2%E3%83%BC%E3%83%88%E8%BF%B7%E5%AE%AE%E9%A4%A8"}]}, {"code": "T7", "city": "tokyo", "sign": "東京駅", "ro": "Tōkyō Sta.", "area": "東京駅／日本橋", "head": "经过时，街景也有看头", "lead": "这是可选支线，不恢复成浅草之后的固定任务。", "hint": "八重洲角色街与丸の内红砖站舍在车站两侧。", "tip": "你们已有涩谷、晴空塔和大阪角色店；东京站只在顺路时用，不负责补齐所有品牌。", "entries": [{"name": "東京駅丸の内駅舎＋KITTE 6F 屋上庭園", "tag": "丸の内侧／30–45分钟／看车站建筑", "body": "外面看红砖站舍，再到KITTE楼上看站前空间，是摄影很容易有收获的一小段。", "fam": "屋顶开放受天气与设施管理影响。带行李转车那天不要为了机位横穿两边。", "links": [{"label": "KITTE丸の内6F目录", "url": "https://marunouchi.jp-kitte.jp/shop/floor/floor-6f.jsp"}], "map": "https://www.google.com/maps/search/?api=1&query=KITTE+%E4%B8%B8%E3%81%AE%E5%86%85+%E3%82%AC%E3%83%BC%E3%83%87%E3%83%B3"}, {"name": "東京キャラクターストリート", "tag": "八重洲改札外／30–60分钟／室内", "body": "孩子喜欢角色商品时，逛店本身能成为一个短项目。它适合雨天与有时间的转车日。", "fam": "不是所有店都在改札内，也不是买新干线票就能直接找到；看一番街地图。", "links": [{"label": "东京站一番街", "url": "https://www.tokyoeki-1bangai.co.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%BA%AC%E3%82%AD%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BC%E3%82%B9%E3%83%88%E3%83%AA%E3%83%BC%E3%83%88"}, {"name": "日本橋：ポケモンセンタートウキョーDX", "tag": "需要额外步行／60–90分钟起", "body": "如果真想去日本桥那家宝可梦店，可以另留时间接百货食品或书店；没有特别目标就不为重复角色店跑过去。", "fam": "Pokémon Café必须按其预约渠道确认；商店入场与咖啡馆订位是两回事。", "links": [{"label": "Pokémon Center门店目录", "url": "https://shop.pokemon.co.jp/en/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%9D%E3%82%B1%E3%83%A2%E3%83%B3%E3%82%BB%E3%83%B3%E3%82%BF%E3%83%BC%E3%83%88%E3%82%A6%E3%82%AD%E3%83%A7%E3%83%BCDX"}]}, {"code": "H1", "city": "hakone", "sign": "箱根", "ro": "Hakone", "area": "箱根", "head": "半天外出，或只在宫之下走一圈", "lead": "两晚吟游给你的是选择余地，不是跑完整环线的任务。", "hint": "宫之下近场、雕刻之森、索道三个尺度，各自选一个。", "tip": "最轻选宫之下；带孩子默认雕刻之森；索道只在全家愿意且运行良好时替换。", "entries": [{"name": "宮ノ下の旧道＋NARAYA／ピコット", "tag": "近场／30–60分钟／最容易回房", "body": "想透口气、拍一点当地街景，围绕宫之下站和老街走就够。咖啡、面包和旅馆街让箱根不只是一间房。", "fam": "街道有坡，部分路段人行空间窄；推车路线先问旅馆。这里不承诺深夜仍有热闹夜市。", "links": [{"label": "箱根宫之下区域", "url": "https://www.hakone.or.jp/?lv=1&p=6413"}, {"label": "NARAYA CAFE", "url": "https://naraya-cafe.com/"}, {"label": "富士屋ホテルPicot", "url": "https://www.fujiyahotel.jp/meal/picot/index.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%AE%AE%E3%83%8E%E4%B8%8B%E9%A7%85"}, {"name": "彫刻の森美術館｜ネットの森と野外彫刻", "tag": "默认半日／约2–3小时／室外为主", "body": "孩子能进部分体验型作品，家长也能看艺术与山景。挑ネットの森、几件好玩的雕塑和休息点，就足够形成一个上午。", "fam": "ネットの森目前供小学生及以下儿童玩，恶劣天气不能使用；大人不按儿童玩法攀爬。", "links": [{"label": "雕刻之森亲子设施", "url": "https://www.hakone-oam.or.jp/kidsandfamily/"}, {"label": "雕刻之森常见问题", "url": "https://www.hakone-oam.or.jp/contact/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%AE%B1%E6%A0%B9+%E5%BD%AB%E5%88%BB%E3%81%AE%E6%A3%AE%E7%BE%8E%E8%A1%93%E9%A4%A8"}, {"name": "大涌谷／箱根ロープウェイ", "tag": "替换半日／天气决定／额外交通", "body": "全家当天特别想坐缆车、看山地与地热景观时，才把它替换为主项目。它不是雕刻之森结束后再随手加一站。", "fam": "强风、雷电、维护等可能停运；先看运营公告再出门。下午仍留回吟游的余量。", "links": [{"label": "箱根索道运行信息", "url": "https://www.hakonenavi.jp/hakone-ropeway/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E6%B6%8C%E8%B0%B7"}]}, {"code": "O1", "city": "osaka", "sign": "心斎橋", "ro": "Shinsaibashi", "area": "心斎橋／道頓堀", "head": "霓虹之外的老大阪", "lead": "酒店周边反复走也不会只剩同一个Glico机位。", "hint": "心斋桥筋 → 戎桥 → 河边；法善寺在道顿堀南侧。", "tip": "白天逛心斋桥，晚间选河边或法善寺一段；几个晚上可以慢慢拆着走。", "entries": [{"name": "道頓堀川 とんぼりリバーウォーク", "tag": "顺路／20–40分钟／适合夜拍", "body": "除了站在Glico正面，沿河换角度拍招牌、桥和倒影。你一个人出门时可以慢慢等画面，全家则过一次桥就够。", "fam": "河边、桥面和步道是不同高度，推车先找合适出入口。不需要为拍照一直挤在人最多的位置。", "links": [{"label": "道顿堀河边步道", "url": "https://osaka-info.jp/spot/tombori-riverwalk/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%A8%E3%82%93%E3%81%BC%E3%82%8A%E3%83%AA%E3%83%90%E3%83%BC%E3%82%A6%E3%82%A9%E3%83%BC%E3%82%AF"}, {"name": "法善寺横丁・水掛不動", "tag": "短支线／20–30分钟／石板与灯笼", "body": "从巨型招牌街拐进一条短巷，石板、灯笼和青苔神像会给你完全不同的夜景。非常适合相机散步。", "fam": "参拜空间与餐厅门口有不同用途；小巷本身即可看，不预设深夜所有店还营业。", "links": [{"label": "法善寺横丁官方观光资料", "url": "https://osaka-info.jp/en/spot/hozenji-yokocho/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%B3%95%E5%96%84%E5%AF%BA%E6%A8%AA%E4%B8%81"}, {"name": "アメリカ村／三角公園", "tag": "白天外延／30–60分钟／街头服饰街景", "body": "想看看大阪年轻人的街区，可以从心斋桥向西到アメリカ村。服饰店、街头招牌与人流是主要趣味。", "fam": "三角公園更像街区聚集点，不是幼儿放电的大草坪。孩子需要活动空间时选てんしば或别的公园。", "links": [{"label": "アメリカ村官方观光资料", "url": "https://osaka-info.jp/spot/america-mura-american-village/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%A2%E3%83%A1%E3%83%AA%E3%82%AB%E6%9D%91+%E4%B8%89%E8%A7%92%E5%85%AC%E5%9C%92"}, {"name": "東心斎橋の路地", "tag": "近场／15–30分钟／随时回房", "body": "小店招牌、居酒屋门口与街口灯光，可以每晚走一条不同的路。你不用每天都走到道顿堀才算出门拍照。", "fam": "一家四口白天重点看商店街；晚上你自己走这段，更方便慢慢构图。", "links": [{"label": "イオンフードスタイル 东心斋桥", "url": "https://www.daiei.co.jp/stores/d0820/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E5%BF%83%E6%96%8E%E6%A9%8B"}]}, {"code": "O2", "city": "osaka", "sign": "日本橋", "ro": "Nipponbashi", "area": "難波／日本橋", "head": "狮子、厨具和食品模型", "lead": "这几个短点，比把所有游戏店都扫完更适合临时添趣味。", "hint": "电电城 → 道具屋筋；八阪神社在难波站西南侧，要另走一段。", "tip": "道具屋筋适合一家四口一起看；游戏店可轮流逛；狮子殿只在体力够时延伸。", "entries": [{"name": "千日前道具屋筋", "tag": "顺路／30–60分钟／白天店铺为主", "body": "锅碗、刀具、灯笼、招牌和食品模型，把日本餐馆背后的道具展示给你看。即使不买，孩子也容易对仿真食物有反应。", "fam": "街区有制作体验，但不是走进就能参加。具体店铺的时段、年龄与预约再查。", "links": [{"label": "千日前道具屋筋", "url": "https://www.doguyasuji.or.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%8D%83%E6%97%A5%E5%89%8D%E9%81%93%E5%85%B7%E5%B1%8B%E7%AD%8B"}, {"name": "難波八阪神社：巨大的狮子殿", "tag": "额外短支线／20–30分钟／室外", "body": "相比再进一间周边店，这个狮子造型很容易让孩子记住。适合从难波南侧出发单独走一个来回。", "fam": "它不是通天阁，也不在道顿堀桥边。神社开放时间先看当天信息，别留成深夜项目。", "links": [{"label": "难波八阪神社观光资料", "url": "https://osaka-info.jp/experience/ja/osaka/spot/246"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%9B%A3%E6%B3%A2%E5%85%AB%E9%98%AA%E7%A5%9E%E7%A4%BE"}, {"name": "でんでんタウン：两家目标店＋街景", "tag": "半日的一部分／45–90分钟起", "body": "先选老游戏店和漫画／模型店各一家，再看孩子状态。商店招牌与现实大阪街区，已经能满足你“日本游戏城市”的兴趣。", "fam": "任天堂官方店在梅田，不在电电城。孩子不喜欢中古店时，在难波商场会合更方便。", "links": [{"label": "スーパーポテト Ota Road", "url": "https://www.superpotato.com/shop/otaroad/"}, {"label": "アニメイト大阪日本桥", "url": "https://www.animate.co.jp/shop/nipponbashi/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%97%A5%E6%9C%AC%E6%A9%8B+%E3%82%AA%E3%82%BF%E3%83%AD%E3%83%BC%E3%83%89"}]}, {"code": "O3", "city": "osaka", "sign": "新世界", "ro": "Shinsekai", "area": "新世界／天王寺", "head": "你熟悉的大脚丫就在这里", "lead": "通天阁与Glico属于不同街区，这半天给大阪另一张脸。", "hint": "新世界 → 动物园／てんしば → 天王寺；四天王寺再向东北走。", "tip": "最轻是新世界＋てんしば；想看动物或大寺，就替换其中一段。", "entries": [{"name": "通天閣とビリケンさん", "tag": "新世界主点／街景30分钟，上塔另留时间", "body": "先在街上看塔、串炸招牌与街区，再决定是否上展望台。想看通天阁内的ビリケン，需要按馆方路线购票进入。", "fam": "周边还有不少ビリケン造型；若只想合照，看街区即可。TOWER SLIDER目前最低7岁，这次两孩不列入。", "links": [{"label": "通天阁", "url": "https://www.tsutenkaku.co.jp/"}, {"label": "通天阁滑梯年龄说明", "url": "https://tsutenkaku.co.jp/tour/tower-slider.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%80%9A%E5%A4%A9%E9%96%A3"}, {"name": "てんしば 芝生広場とカフェ", "tag": "轻项目／30–60分钟／适合暂停逛店", "body": "孩子想跑动时，在天王寺公園入口一侧停下来。草坪、咖啡和商场近，能把“大人看街景”转成全家的休息段。", "fam": "有付费活动区，不能把它们统称免费。按草坪当天使用规则选位置。", "links": [{"label": "てんしば设施与餐馆", "url": "https://www.tennoji-park.jp/facility"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%A6%E3%82%93%E3%81%97%E3%81%B0"}, {"name": "天王寺動物園", "tag": "替换主项目／约2–3小时／室外", "body": "如果孩子特别想看动物，把这半天改成动物园＋てんしば就成立，不用再接完整电电城。", "fam": "常见周一休园、节假日调整，查参观日。它与上野动物园不用都安排。", "links": [{"label": "天王寺動物園开放说明", "url": "https://www.tennojizoo.jp/info/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A9%E7%8E%8B%E5%AF%BA%E5%8B%95%E7%89%A9%E5%9C%92"}, {"name": "四天王寺", "tag": "传统文化支线／45–75分钟／需再移动", "body": "你若想看一处更完整的寺院，这里可以单独留时间。中心伽蓝和庭园等区域，购票与开放按当日。", "fam": "从通天阁不是下楼即到；别把寺院、动物园和上塔都塞在同一个半天。", "links": [{"label": "四天王寺官方观光资料", "url": "https://osaka-info.jp/experience/ja/osaka/spot/286"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%9B%9B%E5%A4%A9%E7%8E%8B%E5%AF%BA"}]}, {"code": "O4", "city": "osaka", "sign": "梅田", "ro": "Umeda", "area": "梅田之外", "head": "大阪还有一张亲子雨天牌", "lead": "角色店可以逛半天，另外半天不必继续追商场。", "hint": "大阪站／梅田、扇町、天神桥筋六丁目是不同落点。", "tip": "孩子想玩选キッズプラザ大阪；你想看城市历史选今昔馆；天气好可把商场换成中之岛。", "entries": [{"name": "キッズプラザ大阪", "tag": "独立半日／约2–3小时起／室内", "body": "有科学、文化体验与能钻来钻去的“儿童之街”，比纯展板博物馆更适合两孩主动玩。可以替换梅田购物半天。", "fam": "在扇町，需要另一次交通；不是LUCUA楼里。0–2岁专区有年龄定位，Freya出行时不能默认仍适用。", "links": [{"label": "キッズプラザ大阪楼层说明", "url": "https://www.kidsplaza.or.jp/floor/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%AD%E3%83%83%E3%82%BA%E3%83%97%E3%83%A9%E3%82%B6%E5%A4%A7%E9%98%AA"}, {"name": "大阪くらしの今昔館", "tag": "独立支线／约60–90分钟／室内街景", "body": "重现老大阪街区，适合你想看看过去的城市生活，而孩子又不愿长时间读说明牌时考虑。", "fam": "目前计划休馆至2027/1/5，三月仍要核对重开状态。旧XR项目已经结束，不恢复进推荐。", "links": [{"label": "大阪くらしの今昔馆与休馆公告", "url": "https://www.osaka-angenet.jp/konjyakukan/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E3%81%8F%E3%82%89%E3%81%97%E3%81%AE%E4%BB%8A%E6%98%94%E9%A4%A8"}, {"name": "中之島公園・中央公会堂", "tag": "替换商场散步／45–60分钟／室外", "body": "河流、桥梁与红砖建筑，让你看到大阪除了道顿堀之外更舒展的一面。很适合相机散步。", "fam": "三月不期待盛开的玫瑰园；以建筑和河边为主。公会堂室内不默认自由进入。", "links": [{"label": "中之岛公園官方观光资料", "url": "https://discover.osaka-info.jp/jp/spots/nakanoshima-park"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E4%B9%8B%E5%B3%B6%E5%85%AC%E5%9C%92"}]}, {"code": "O5", "city": "osaka", "sign": "天保山", "ro": "Tempozan", "area": "海遊館／大阪城", "head": "主线之外只添一个", "lead": "这两处各有一片开放空间，不用把下午重新塞满。", "hint": "大阪港与大阪城分开看，选当前所在片区即可。", "tip": "港边：水族馆＋散步；城边：城外＋补给。多出来的票都让当天兴趣决定。", "entries": [{"name": "海遊館周辺 港の散歩", "tag": "顺路／20–30分钟／无额外门票", "body": "出馆后看看船、港湾和建筑，把室内看鱼切到室外透气。拍几张海港照片，今天就已经很完整。", "fam": "有风或孩子累时直接回城。海游馆参观可以慢慢看，不必为了追下午项目提前离馆。", "links": [{"label": "天保山周边设施", "url": "https://www.kaiyukan.com/thv/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A9%E4%BF%9D%E5%B1%B1%E3%83%8F%E3%83%BC%E3%83%90%E3%83%BC%E3%83%93%E3%83%AC%E3%83%83%E3%82%B8"}, {"name": "天保山大観覧車／帆船型観光船サンタマリア", "tag": "周边付费项目／二选一", "body": "晴天又有精神，可以从高处看港湾，或坐船体验大阪港。它们是可选，不是海游馆门票自带项目。", "fam": "班次、天气停运与儿童规则再查。海游馆后只加其中一项，孩子困了就全取消。", "links": [{"label": "天保山周边设施", "url": "https://www.kaiyukan.com/thv/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A9%E4%BF%9D%E5%B1%B1%E5%A4%A7%E8%A6%B3%E8%A6%A7%E8%BB%8A"}, {"name": "大阪城公園", "tag": "独立半日／60–90分钟／室外", "body": "护城河、石墙、城楼外观与公园，是不进天守阁也能完成的历史空间体验。按回程出口决定走多长。", "fam": "从车站到城楼还要步行。花况顺路看；不为未开花调整所有日程。", "links": [{"label": "大阪城公园官方观光资料", "url": "https://osaka-info.jp/spot/osaka-castle-park/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E5%9F%8E%E5%85%AC%E5%9C%92"}, {"name": "大阪城天守閣", "tag": "城内历史展示／再留60–90分钟", "body": "你确实想看大阪历史展示时再入馆。外景摄影与里面读展，可以作为两种不同玩法。", "fam": "孩子只想跑动时就留公园；实际入馆与电梯队伍可能占时间，不把票当必须买。", "links": [{"label": "大阪城公园官方观光资料", "url": "https://osaka-info.jp/spot/osaka-castle-park/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E5%9F%8E%E5%A4%A9%E5%AE%88%E9%96%A3"}]}, {"code": "X1", "city": "misc", "sign": "外延", "ro": "Side trips", "area": "池袋／新宿／宇治／奈良", "head": "需要另安排的外延", "lead": "收进来方便你临时改主意，但不伪装成当前路线的顺路点。", "hint": "每一项都要替换一个半天以上；奈良从大阪往返按一天留，不叠在 Museum 当天。", "tip": "奈良优先放在无 Museum 票的 3/24；若已有票，可替换 3/25 的大阪城／梅田机动日。看天气和孩子体力决定，下午留够回程与打包时间。交通可从大阪難波搭近铁到近鉄奈良；站口步行约 5 分钟到公园边缘，东大寺还要继续走，不是下车即到。", "entries": [{"name": "池袋 サンシャインシティ＋アニメイト", "tag": "另留半天／角色与室内项目", "body": "如果东京某天大雨、又想把Pokémon和漫画购物放一起，池袋可以当替换方向。", "fam": "与你们近场酒店不在同一街区。东京已有多家角色店，只有目标明确才去。", "links": [{"label": "Pokémon Center门店目录", "url": "https://shop.pokemon.co.jp/en/"}, {"label": "アニメイト门店目录", "url": "https://www.animate.co.jp/shop/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%B5%E3%83%B3%E3%82%B7%E3%83%A3%E3%82%A4%E3%83%B3%E3%82%B7%E3%83%86%E3%82%A3"}, {"name": "新宿：书店、百货与城市景观", "tag": "另留半天／大人偏好", "body": "紀伊國屋新宿本店与百货适合认真逛书或购物的人；不一定比当前的涩谷、上野更符合这次家庭节奏。", "fam": "西侧与东侧不是同一个出口。新宿不作为孩子睡后从上野临时出发的夜宵区。", "links": [{"label": "紀伊國屋门店目录", "url": "https://store.kinokuniya.co.jp/store/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%B4%80%E4%BC%8A%E5%9C%8B%E5%B1%8B%E6%9B%B8%E5%BA%97+%E6%96%B0%E5%AE%BF%E6%9C%AC%E5%BA%97"}, {"name": "ニンテンドーミュージアム（小倉）", "tag": "整日主项目／大阪往返／按票面入场", "body": "想看任天堂产品历史、互动展示与博物馆商店，中签才把这一天独立留出来。咖啡馆也在馆内。", "fam": "不为没票单独跑去商店。小倉和宇治河边不是同一个景区，交通与互动规则见官网。", "links": [{"label": "Nintendo Museum参观流程", "url": "https://museum.nintendo.com/en/guide/visit-flow/index.html"}, {"label": "Nintendo Museum商店", "url": "https://museum.nintendo.com/en/shop/index.html"}, {"label": "Nintendo Museum咖啡馆", "url": "https://museum.nintendo.com/en/cafe/index.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%8B%E3%83%B3%E3%83%86%E3%83%B3%E3%83%89%E3%83%BC%E3%83%9F%E3%83%A5%E3%83%BC%E3%82%B8%E3%82%A2%E3%83%A0"}, {"name": "平等院・宇治川", "tag": "宇治市中心外延／至少另留半天", "body": "若你后来特别想看平等院，可当单独替换；茶街、河边与寺院会形成另一种日本体验。", "fam": "不默认附加在Museum结束后。已经买好入馆时段、孩子也累时，直接回大阪更容易。", "links": [{"label": "宇治平等院官方旅游资料", "url": "https://www.city.uji.kyoto.jp/soshiki/88/2906.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%B9%B3%E7%AD%89%E9%99%A2"}, {"name": "奈良公園＋東大寺", "tag": "可选一日游／大阪往返／看鹿与散步", "body": "想换一天户外慢逛，就从大阪去奈良。上午看鹿、在公园散步，中午找地方吃饭；下午还有兴致再进东大寺看大佛，累了就早点回大阪。只围绕这两站，不把春日大社、若草山和奈良町都塞进一天。", "fam": "鹿是野生动物，只喂当地售卖的鹿仙贝，由大人拿着喂，孩子在身边一起看；不追逐、逗弄或用自己的零食喂鹿。孩子不想靠近也可以远远看，不需要一定喂。", "links": [{"label": "奈良县官方：奈良公园与交通", "url": "https://www.visitnara.jp/venues/A00489/"}, {"label": "奈良县官方：看鹿与喂食提醒", "url": "https://www.visitnara.jp/venues/S01487/"}, {"label": "东大寺：开放时间与门票", "url": "https://www.todaiji.or.jp/en/information/haikan/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A5%88%E8%89%AF%E5%85%AC%E5%9C%92"}]}, {"code": "N1", "city": "night", "sign": "夜", "ro": "Night", "area": "夜间相机散步", "head": "两家酒店的三种长度", "lead": "白天一家四口，晚上给你一点慢慢拍城市的时间。", "hint": "以下为单程步行粗估；灯光、店铺和人流随当晚变化。", "tip": "第一次走短圈熟悉街道，之后再延伸。想拍的画面，可以分几个晚上慢慢等。", "entries": [{"name": "東京短圈：酒店 → 佐竹商店街附近 → 回房", "tag": "15–30分钟总时长／安静生活街景", "body": "街角、自动售货机、自行车和关门后的商店街，适合拍城市日常。不要预期下楼就是涩谷那样的大屏幕。", "fam": "佐竹商店街距酒店约5分钟级别；九点后很多普通店收了，购物放白天。", "links": [{"label": "佐竹商店街", "url": "https://satakeshotengai.com/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%BD%90%E7%AB%B9%E5%95%86%E5%BA%97%E8%A1%97"}, {"name": "東京中圈：酒店 → 御徒町／アメ横 → 回房", "tag": "45–60分钟总时长／高架与餐饮招牌", "body": "向西走约10–15分钟就能换到高架、灯笼和夜里仍营业的餐饮街景。饿了吃一点，回程买早餐。", "fam": "秋叶原更远，单程约20–25分钟；想去就另留时间，夜里主要拍外景。", "links": [{"label": "アメ横章鱼烧店", "url": "https://ameyoko-center.jp/shop/contents.html?id=38&l=1"}, {"label": "アメ横山贼海贼", "url": "https://ameyoko-center.jp/shop/contents.html?id=49&l=1"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%BE%A1%E5%BE%92%E7%94%BA%E9%A7%85"}, {"name": "大阪短圈：東心斎橋巷子 → イオン → 回房", "tag": "20–30分钟总时长／小店灯光与补给", "body": "每天选一条不同小街，用招牌、门面与街口灯光练构图。买一袋牛奶和水果回来，这次小圈就很圆满。", "fam": "夜间零售选择有限；食品超市目前24小时，是明确的回程点。", "links": [{"label": "イオンフードスタイル 东心斋桥", "url": "https://www.daiei.co.jp/stores/d0820/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%A4%E3%82%AA%E3%83%B3%E3%83%95%E3%83%BC%E3%83%89%E3%82%B9%E3%82%BF%E3%82%A4%E3%83%AB%E6%9D%B1%E5%BF%83%E6%96%8E%E6%A9%8B%E5%BA%97"}, {"name": "大阪中圈：心斎橋 → 戎橋 → 法善寺 → 回房", "tag": "约60–90分钟总时长／霓虹与老巷", "body": "到河边拍水面反光，再拐法善寺拍石板和灯笼。两段气氛很不同，而且都在步行生活圈。", "fam": "只想转半小时就走到河边折返；别为了完成线路一路赶。", "links": [{"label": "法善寺横丁官方观光资料", "url": "https://osaka-info.jp/en/spot/hozenji-yokocho/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%B3%95%E5%96%84%E5%AF%BA%E6%A8%AA%E4%B8%81"}]}]}}, "apx": [{"id": "A", "title": "交通与行李｜把移动日做轻", "lead": "路线为操作建议；精确车次、寄送时效和酒店代收须在预订时确认。", "parts": [{"h": "城际三段：先选方便的车次，再倒排出门", "p": ["3/19 东京 → 吟游：从酒店前往东京站，乘停小田原的新干线，再经箱根汤本到宫之下。带孩子换乘、电梯和午饭留余量；目标是接近 14:00 入住。", "3/21 吟游 → 大阪：宫之下 → 箱根汤本 → 小田原 → 新大阪 → 心斋桥。筛选停小田原的班次，比较直达与换乘；不要默认每班 Hikari 都停。", "3/26 大阪 → 羽田：心斋桥 → 新大阪 → 品川 → 羽田区域酒店。先核实酒店地址和进航站楼方式，再决定最后一段交通。"]}, {"h": "东京寄大阪：交箱前确认这四项", "p": ["大阪酒店是否代收、订单姓名与入住日如何填写、承运商预计到达日、东京酒店收件截止时间。交箱日期听酒店建议，不预设 3/19 早上寄必定赶上 3/21。", "保留运单照片和追踪号；大阪到达后核对箱数。箱根小包放两晚用品，再多留一天余量；常用药、证件、充电器与孩子换洗随身带。"]}, {"h": "新干线座位与大件行李", "p": ["量每个箱子的长＋宽＋高。JR 东海规则：超过 160 cm、至 250 cm 的大件须预订对应行李席；超过 250 cm 不可带上车。推车有特殊规则，另查官方说明。", "特别大件行李席目前在乘车前一个月开售时办理；家庭同车厢座位提前选择。按孩子出行时年龄、是否单独占座确认票种，不默认儿童都免费。"]}], "links": [{"label": "JR 东海：大件行李规则", "url": "https://global.jr-central.co.jp/en/info/oversized-baggage/"}, {"label": "SmartEX：大件行李席预订", "url": "https://smart-ex.jp/en/entraining/oversized-baggage/"}]}, {"id": "B", "title": "预约与换日｜固定少量硬项目", "lead": "东京看睡眠和天气，大阪跟 Museum 票走；海游馆始终独立保留。", "parts": [{"h": "Nintendo Museum：从 2026 年 12 月开始关注", "p": ["按现行提前三个月抽签规则，2027 年 3 月参观在 2026 年 12 月关注申请。优先 3/24、3/25；愿意接受假日人流时可选 3/22。3/23 为周二，不安排 Museum。", "中签按指定期限付款；未中签继续关注官方余票或取消票。当前规则：通常次月 1 日公布结果、7 日前付款；候补中选另有期限，一律以通知为准。"]}, {"h": "大阪换日：两种执行方式", "p": ["无 Museum 票：3/22 南区慢逛；3/23 海游馆；3/24 梅田；3/25 大阪城／休息机动。", "有 Museum 票：当天只去宇治，3/24 与 3/25 可交换；梅田压成半日。若拿到 3/22 票，南区慢逛移到空出的 3/24 或 3/25。海游馆仍保留。", "奈良仅作可选：无票时可替换 3/24 梅田；已有 Museum 票时，可替换另一天的机动安排。只选一天，不与 Museum 或海游馆叠加。"]}, {"h": "当天入馆与交通", "p": ["外国游客包括孩子须携带护照原件，姓名与票面一致。按目前规则，参观前一天日本时间 14:00 起生成 QR 票；有工作坊兴趣，入馆后先询问当天预约。", "近鉄京都線小倉（Ogura）站是最近车站，步行入馆；大阪出发的换乘按票面时段查询。官方要求不要乘汽车、摩托车、自行车或出租车到馆。"]}, {"h": "东京与海游馆：预约前再检查", "p": ["东京默认顺序：3/15 上野／秋叶原近场适应 → 3/16 丰洲 teamLab → 3/17 涩谷 → 3/18 浅草近场收尾。先减少通勤与硬时段，最后一天留出整理箱根行李的余量；当天仍按睡眠和天气缩短活动。", "3/15 周一按不入馆安排：国立科学博物馆与上野动物园通常周一休馆，特别开放须查官方日历。teamLab 先按 3/16 选择时段，未订票前可调整；订好后以票面日期为准。", "丰洲坐船只作下午备选。水上巴士现有缩班，且部分月份会把定休日移到第三个周三；2027 年 3 月船班尚待复核，因此暂保留丰洲在 3/16 周二。", "海游馆订适合孩子的时段，下午不再叠加大项目。大阪港駅下车后步行到馆；临近再核对营业日、入场方式和推车安排。"]}], "links": [{"label": "任天堂：抽签、付款、证件与 QR 票", "url": "https://museum.nintendo.com/en/guide/visit-flow/index.html"}, {"label": "任天堂：交通与入馆路线", "url": "https://museum.nintendo.com/en/access/index.html"}, {"label": "海游馆：交通", "url": "https://www.kaiyukan.com/info/access/"}, {"label": "国立科学博物馆：开放与休馆", "url": "https://www.kahaku.go.jp/riyou/nyukan-annai/"}, {"label": "上野动物园：开放与休园", "url": "https://www.tokyo-zoo.net/ueno/visitor-info/tickets/index.html"}, {"label": "丰洲水上巴士：运营与班次", "url": "https://www.urbanlaunch.net/boarding/"}]}, {"id": "C", "title": "孩子与吟游｜留出真正的休息", "lead": "每天一个主项目；可选项目的决定权留给当天的体力。", "parts": [{"h": "teamLab Planets：进馆前的准备", "p": ["不能推婴儿车入馆，馆外有推车停放处；可使用前背式背带。暗处牵好孩子，小朋友必要时抱着走，推车不能替代馆内的体力安排。", "带儿童完整换洗一套与装湿衣物的袋子；穿容易活动、卷裤腿的衣服。官方不允许穿湿衣服继续进入后续作品。午饭后看状态，台场可以直接取消。"]}, {"h": "吟游两晚：出发前向旅馆核对", "p": ["请旅馆确认两晚是否更换菜单、儿童餐具体内容、两位孩子的寝具配置、可选用餐时间；以订单确认单为准，不自行假设。", "连住日是否需要离开房间清洁？能否避开孩子午睡？提前说明想在 3/20 下午回房休息，请旅馆建议清洁与铺床时间。", "3/19 尽早入住；3/20 雕刻之森半日为默认，索道／大涌谷只作替换。早餐后若全家想休息，整天留旅馆也成立。"]}, {"h": "城市日：大人购物与孩子活动交替", "p": ["商店集中逛，遇到公园或开放空间就给孩子自由活动时间。东京 Nintendo 与 Pokémon 已是主购物日，大阪只补喜欢的限定或漏买物品。", "海游馆作为正式亲子日；Museum 当天不叠加京都。午饭后若孩子疲劳，取消下午可选活动，不把没做的项目全部追回最后一天。"]}, {"h": "每天出门只检查一个小包", "p": ["水、熟悉零食、湿巾、常用药、换洗、充电与当天票务截图。需要核验身份的场馆带护照原件；移动日额外清点行李数量。", "3/21‑22 是日本连休；箱根外出与大阪商圈按假日预期安排。樱花继续只作顺路加分，不改变住宿与主项目。"]}], "links": [{"label": "Planets 官方：幼儿、推车与换洗", "url": "https://support.dmm.com/teamlabplanets/article/47944"}, {"label": "未来馆官方：2027/4/23 重新开放", "url": "https://www.miraikan.jst.go.jp/news/press/202608264718.html"}, {"label": "内阁府：2027 年日本假日", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}]}, {"id": "D", "title": "购物退税与返程｜最后两天有章法", "lead": "2027 年适用新退税制度；具体柜台、操作与退款方式在离境前复核。", "parts": [{"h": "新退税：先付含税价，再确认带出日本", "p": ["自 2026/11/1 起，符合资格的免税购物改为先支付含税价；购买后 90 天内离境，经海关确认商品带出日本，再由商家办理税款退款。", "购物时问清记录、退款方式与手续，保留凭证；不要假设全部都在机场即时现金退回。退款可由商家或受托机构办理，具体方式以店方说明为准。"]}, {"h": "3/25‑26：购买收尾与打包", "p": ["主要购物在大阪完成；按航司额度量尺寸、称重。把需退税确认的商品整理到方便查找的位置，留好商品与购物记录的对应关系。", "3/26 先回羽田区域，确认第二天的航站楼、酒店交通、早餐和退房时间；酒店须按两成人、两孩子的实际年龄确认合法入住。"]}, {"h": "3/27：先查验顺序，再交出箱子", "p": ["前一天查询羽田当天适用的海关确认流程；到机场先确认查验与托运行李的先后，商品保持可出示。为退税、值机、托运及孩子临时状况另留时间。", "核对四人证件、登机牌和行李件数；机场购物只补小件。HND → ORD 后留休息时间，返美当天不追加任务。"]}, {"h": "预算与尚待确认的项目", "p": ["本手册不填未经核实的报价。后续汇总实际机票自付额、酒店儿童加价、城际交通、门票与餐饮，再检查家庭自付 $3,500‑4,000 的目标。"]}], "links": [{"label": "日本国税厅：新退税制度说明（英文 PDF）", "url": "https://www.nta.go.jp/publication/pamph/shohi/menzei/202506/pdf/0025006-106.pdf"}, {"label": "日本国税厅：制度更新与后续说明", "url": "https://www.nta.go.jp/publication/pamph/shohi/menzei/201805/format/002.htm"}]}, {"id": "E", "title": "日本 eVISA｜材料与办理清单", "lead": "本次夫妻办理单次旅游 eVISA，孩子免签。3/13 从 ORD 出发，3/14 入境日本；建议 2027 年 1 月上旬提交。核对于 2026/9/30。", "parts": [{"h": "材料：两人的证件与旅行文件", "p": ["准备清晰电子文件，全部住宿都要有预订单。银行账单用最近一期；常规旅游清单未列在职证明、W-2 或多次申请理由，领馆仍可要求补件。"], "checklist": [{"id": "evisa-passport-self", "text": "本人的护照资料页：彩色，完整显示底部两行机器识别码。"}, {"id": "evisa-passport-spouse", "text": "配偶的护照资料页：同样准备清晰彩色扫描件。"}, {"id": "evisa-photo-self", "text": "本人的电子证件照：近六个月、浅色纯背景、正面、不戴眼镜。"}, {"id": "evisa-photo-spouse", "text": "配偶的电子证件照：同样按近六个月要求准备。"}, {"id": "evisa-green-cards", "text": "两人的在美居留身份证明正反面扫描件（如适用）；原件留在自己手中。"}, {"id": "evisa-addresses", "text": "两人的现住址证明：所在州驾照、州 ID 或近期水电账单。"}, {"id": "evisa-bank", "text": "最近一期完整美国银行账单：显示申请人姓名和住宅地址。"}, {"id": "evisa-flights", "text": "进出日本的航班预订单：航司或旅行社出具，显示两人姓名。"}, {"id": "evisa-hotels", "text": "全部酒店预订单：覆盖每晚。若订单只写主申请人的名字，配偶的申请同时附主申请人的航班行程单。"}, {"id": "evisa-itinerary", "text": "英文每日行程：写日期、活动、住宿和联系方式，列出同行四人姓名。"}, {"id": "evisa-application", "text": "两人的申请信息核对一致；芝加哥清单仍列亲签申请表，备好签名扫描件，按系统上传提示提交。"}]}, {"h": "家庭申请：关系证明按方式准备", "p": ["一个账号可申请夫妻两人；家庭申请会复制部分旅行信息、统一接收通知并合并缴费。孩子免签，不加入签证申请。", "替配偶申请或使用主申请人的资金证明时，需准备婚姻关系证明；代成年人申请还需授权书。非英文证明的翻译与认证形式先向芝加哥领馆确认，不把婚姻证明当作一定能省掉的材料。"], "checklist": [{"id": "evisa-marriage", "text": "婚姻关系证明及所需翻译形式已确认；如分别申请、各自提供资金证明，按各自清单办理。"}, {"id": "evisa-authorization", "text": "如代配偶申请，准备其签名的授权书。"}]}, {"h": "办理：在线提交、缴费、收签", "p": ["在下方官方入口选择 国籍 → 居住国 → 居住州 → Tourism，核对系统材料清单及芝加哥要求。"], "checklist": [{"id": "evisa-account", "text": "注册 JAPAN eVISA 邮箱账号，准备两人的文件后开始填写。"}, {"id": "evisa-entries", "text": "填写并上传：家庭申请用 Save and add family members 添加配偶，最后用 Save and finish your entries 完成登记。"}, {"id": "evisa-submit", "text": "在 Visa application list 核对后点击 Submit；保存登记不等于已提交。"}, {"id": "evisa-review", "text": "关注邮箱和账号状态；如有补件要求，按通知上传。"}, {"id": "evisa-payment", "text": "收到缴费通知后在线刷信用卡付款。当前费用夫妻共 $202（每人 $101，适用至 2027/3/31）；以缴费通知为准。"}, {"id": "evisa-issued", "text": "确认状态为 Issued，核对姓名、护照号、有效期及获准停留期限。"}, {"id": "evisa-airport", "text": "出发前测试手机联网打开动态 Visa issuance notice；机场不能只出示截图或打印件。"}]}, {"h": "申请时间：给审核留余量", "p": ["2026 年 12 月中旬：进入提前三个月申请的窗口。2027 年 1 月上旬：本次建议提交时间。", "材料齐全后通常需约 5–7 个工作日；补件、旺季或进一步审核可能延长，无加急。以后每次行程确定后，建议提前 4–8 周办理。", "申请期间须留在美国。签发后入境有效期为三个月，限一次入境；停留天数以获批结果为准。", "下次主要更新银行账单、航班、酒店、每日行程及照片；有效且信息未变的证件扫描件可复用。"]}], "links": [{"label": "JAPAN eVISA 官方申请", "url": "https://www.evisa.mofa.go.jp/index"}, {"label": "官方 FAQ：家庭申请、时间与上传", "url": "https://www.evisa.mofa.go.jp/faq"}, {"label": "芝加哥：旅游材料清单 PDF", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/v10_s.pdf"}, {"label": "签证申请表", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/app_type.pdf"}, {"label": "英文每日行程表", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/stayEN.pdf"}, {"label": "代办授权书", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/authorization.pdf"}, {"label": "芝加哥领馆：费用与咨询", "url": "https://www.chicago.us.emb-japan.go.jp/itpr_en/visa.html"}]}], "todo": ["羽田酒店", "吟游儿童餐、寝具及连住细节", "大阪行李代收", "Nintendo Museum 抽签（2026 年 12 月）", "teamLab Planets 时段", "海游馆时段", "新干线车次与座位（含大件行李席）", "离境退税流程", "丰洲→浅草水上巴士班次与票价", "夫妻 eVISA（2027 年 1 月上旬，见附录 E）"], "ref": [{"h": "判断与事实分开", "p": "餐厅、景点、门店与公告以条目内链接为依据；“适合孩子”“停留多久”“今天怎样选”是针对你们家庭的编辑建议，不是场馆保证。未核实的儿童椅、包间和儿童菜单不写成已有。"}, {"h": "当前开放不等于 2027 保证", "p": "查阅日为 2026/9/29。出发前重开关键场馆、门店、票务与日历。海游馆贪吃横丁 2027 年 3 月拟重开；未来馆 4/23 才重开；今昔馆计划休馆至 1/5；科学馆部分展区改装需再查。"}, {"h": "容易混淆的店与楼", "p": "大阪 Nintendo 在 LUCUA SOUTH 13F，@cosme 在 LUCUA IRE 3F；梅田 ロフト 在阪神 6F。まんだらけ グランドカオス 现址日本桥，駿河屋秋叶原游戏馆 2026/9/25 迁址。一兰道顿堀选别馆。"}, {"h": "地图与引用", "p": "每条的官方入口可打开出处；“地图”按店名搜索，并非已替你验证实时步行导航。"}]}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CITY = {dep:['出发','Departure'], tokyo:['東京','Tokyo'], hakone:['箱根','Hakone'], osaka:['大阪','Osaka'], ret:['返程','Return']};
const STAY = {dep:'机上', tokyo:'MONday 上野新御徒町 · 5 晚', hakone:'箱根吟游 · 月・和室 · 2 晚', osaka:'MONday apart 心斋桥 · 5 晚', ret:'羽田附近 1 晚 · 待定'};
const BOOK = {eat:['吃','食'], shop:['买','买'], see:['玩','观']};
const JA_RX = /[぀-ヿ]/;
// wrap text: escape, link 附录 X, mark search hits
function fmt(t, q){
  let h = esc(t).replace(/附录\s?([A-E])(?:[、，‑-]\s?([A-E]))?/g, (m,a,b) =>
    '<a class="ax" href="#info-'+a+'">附录 '+a+'</a>' + (b ? '、<a class="ax" href="#info-'+b+'">'+b+'</a>' : ''));
  if (q) h = hl(h, q);
  return h;
}
function hl(html, q){
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return html.replace(/(^|>)([^<]*)/g, (m, a, txt) => a + txt.replace(rx, x => '<mark>'+x+'</mark>'));
}
const langAttr = t => JA_RX.test(t) ? ' lang="ja"' : '';

/* ----- dates ----- */
function jstToday(){ const d = new Date(Date.now() + 9*3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
const START = Date.UTC(2027,2,13), END = Date.UTC(2027,2,27);
const T = jstToday();
const todayN = (T >= START && T <= END) ? Math.round((T-START)/864e5)+1 : null;
(function status(){
  const el = $('#status');
  if (todayN) el.innerHTML = '日本今天是 <b>DAY '+String(todayN).padStart(2,'0')+'</b><a href="#d'+todayN+'">打开今天 →</a>';
  else if (T < START) el.innerHTML = '距出发还有 <b>'+Math.round((START-T)/864e5)+'</b> 天 · 内容核对于 2026/9/29';
  else el.innerHTML = '旅程已结束 · 欢迎回家';
})();

/* ----- itinerary ----- */
function renderTrip(){
  const groups = [];
  D.days.forEach(d => { const g = groups[groups.length-1]; if (g && g.city === d.city) g.days.push(d); else groups.push({city:d.city, days:[d]}); });
  let h = '<div class="vhead"><h2>行程 · 15 站</h2><p>每天一个主项目。点开某一天，看路线、住处、吃买看，以及这一带还能去哪。</p></div>';
  groups.forEach(g => {
    h += '<div class="c-'+g.city+'"><div class="city-h"><span class="nm" lang="ja">'+CITY[g.city][0]+'</span><span class="ro">'+CITY[g.city][1]+'</span><span class="cstay">'+esc(STAY[g.city])+'</span></div><ol class="line">';
    g.days.forEach((d,i) => {
      const cls = ['stop', i===0?'first':'', i===g.days.length-1?'last':'', d.n===todayN?'today':''].join(' ');
      h += '<li class="'+cls+'"><a href="#d'+d.n+'"><span class="dn">DAY<b>'+String(d.n).padStart(2,'0')+'</b></span>'
        + '<span class="t1"><span class="sn" lang="ja">'+esc(d.ja)+'</span><span class="dt">'+d.date+' <span class="zh">'+esc(d.dow)+'</span></span>'
        + (d.n===todayN?'<span class="tag-today">TODAY</span>':'')+'</span>'
        + '<span class="t2">'+esc(d.title)+'</span></a></li>';
    });
    h += '</ol></div>';
  });
  $('#v-trip').innerHTML = h;
}

/* ----- day ----- */
function secByRel(r){ const [b,c] = r.split(':'); const s = D.books[b].sections.find(x => x.code === c); return {b, s}; }
function renderDay(n){
  const d = D.days[n-1], prev = D.days[n-2], next = D.days[n];
  const li = a => a.map(x => '<li>'+fmt(x)+'</li>').join('');
  let h = '<div class="c-'+d.city+'"><a class="back" href="#trip">← 全部行程</a>'
    + '<div class="sign"><div class="top"><div class="big" lang="ja">'+esc(d.ja)+'</div><div class="rom">'+esc(d.ro)+'</div></div>'
    + '<div class="band">'
    + (prev ? '<a href="#d'+prev.n+'" aria-label="前一天"><small>◀ '+String(prev.n).padStart(2,'0')+'</small><b lang="ja">'+esc(prev.ja)+'</b></a>' : '<span class="nil"></span>')
    + '<span class="mid">DAY '+String(d.n).padStart(2,'0')+'</span>'
    + (next ? '<a href="#d'+next.n+'" aria-label="后一天"><b lang="ja">'+esc(next.ja)+'</b><small>'+String(next.n).padStart(2,'0')+' ▶</small></a>' : '<span class="nil"></span>')
    + '</div><div class="under"><span>2027 · '+d.date+' <span class="zh">'+esc(d.dow)+'</span></span><span class="zh"'+langAttr(d.area)+'>'+esc(d.area)+'</span></div></div>'
    + '<div class="dtitle"><h2>'+esc(d.title)+'</h2><p>'+fmt(d.sub)+'</p>'+(d.judge?'<span class="judge">'+esc(d.judge)+'</span>':'')+'</div>'
    + '<div class="blk"><div class="lbl">今日路线 <span class="en">ROUTE</span></div><ol class="steps">'+li(d.plan)+'</ol></div>'
    + '<div class="blk"><div class="lbl">住 · 今晚落点 <span class="en">STAY</span></div><div class="stay">'+d.stay.map((x,i)=>'<p class="'+(i===0?'l0':'')+'">'+fmt(x)+'</p>').join('')+'</div></div>'
    + '<div class="blk"><div class="lbl">吃 · 买 · 看 <span class="en">EAT · SHOP · SEE</span></div><div class="trio">'
    + [['食','eat'],['买','shop'],['观','see']].map(([k,f]) => '<section><span class="mk" lang="ja">'+k+'</span><ul>'+li(d[f])+'</ul></section>').join('')
    + '</div></div>'
    + '<div class="note"><span class="stamp">待确认</span><p>'+fmt(d.note)+'</p></div>';
  if (d.rel.length){
    h += '<div class="blk"><div class="lbl">这一带还能… <span class="en">NEARBY</span></div><div class="rel">'
      + d.rel.map(r => { const {b,s} = secByRel(r);
          return '<a class="c-'+s.city+'" href="#'+b+'-'+s.code+'"><span class="bk" lang="ja">'+BOOK[b][1]+'</span><span class="tx"><b'+langAttr(s.area)+'>'+BOOK[b][0]+' · '+esc(s.area)+'</b><span>'+esc(s.head)+'</span></span><span class="n">'+s.entries.length+' 项 →</span></a>'; }).join('')
      + '</div></div>';
  }
  h += '<div class="pager">'
    + (prev ? '<a href="#d'+prev.n+'">← DAY '+String(prev.n).padStart(2,'0')+'<b>'+esc(prev.title.split('｜')[0])+'</b></a>' : '<span></span>')
    + (next ? '<a class="nx" href="#d'+next.n+'">DAY '+String(next.n).padStart(2,'0')+' →<b>'+esc(next.title.split('｜')[0])+'</b></a>' : '<span></span>')
    + '</div></div>';
  $('#v-day').innerHTML = h;
}

/* ----- companion books ----- */
const query = {eat:'', shop:'', see:''};
function renderBookShell(b){
  const B = D.books[b], el = $('#v-'+b);
  el.innerHTML = '<div class="vhead"><h2><span class="k" lang="ja">'+BOOK[b][1]+'</span>'+esc(B.sub)+'</h2><p>'+esc(B.lead)+'</p></div>'
    + '<div class="tools"><div class="search"><input id="q-'+b+'" type="search" placeholder="搜店名、料理、区域…" aria-label="搜索'+B.name+'" autocomplete="off"><button type="button" hidden>清除</button></div>'
    + '<div class="chips">'+B.sections.map(s => '<a class="chip c-'+s.city+'" href="#'+b+'-'+s.code+'"'+langAttr(s.sign)+'>'+esc(s.sign==='夜'||s.sign==='索引'||s.sign==='心得'||s.sign==='外延' ? s.area : s.sign)+'</a>').join('')+'</div></div>'
    + '<div class="body"></div>';
  const inp = el.querySelector('input'), clr = el.querySelector('button');
  inp.addEventListener('input', () => { query[b] = inp.value.trim(); clr.hidden = !query[b]; renderBookBody(b); });
  clr.addEventListener('click', () => { inp.value=''; query[b]=''; clr.hidden = true; renderBookBody(b); inp.focus(); });
  renderBookBody(b);
}
function renderBookBody(b){
  const B = D.books[b], q = query[b].toLowerCase();
  const match = e => !q || [e.name,e.tag,e.body,e.fam,...e.links.map(l=>l.label)].join(' ').toLowerCase().includes(q);
  let h = '', total = 0;
  B.sections.forEach(s => {
    const secHit = q && (s.area+s.head+s.lead).toLowerCase().includes(q);
    const ents = s.entries.filter(e => secHit || match(e));
    if (q && !ents.length) return;
    total += ents.length;
    h += '<section class="sec c-'+s.city+'" id="'+b+'-'+s.code+'">'
      + '<div class="sec-h"><div class="msign"><b lang="ja">'+esc(s.sign)+'</b><span>'+esc(s.ro)+'</span></div>'
      + '<div class="ttl"><div class="ar"'+langAttr(s.area)+'>'+fmt(s.area,q)+'</div><h3>'+fmt(s.head,q)+'</h3></div></div>'
      + (q ? '' : (s.lead ? '<p class="lead">'+fmt(s.lead)+'</p>' : '')+'<p class="hint">'+esc(s.hint)+'</p>')
      + '<ol class="ents">'+ents.map(e => {
          const i = s.entries.indexOf(e)+1;
          return '<li class="ent"><div class="hd"><span class="no">'+String(i).padStart(2,'0')+'</span><div style="min-width:0"><h4'+langAttr(e.name)+'>'+fmt(e.name,q)+'</h4>'
            + '<div class="tg">'+fmt(e.tag,q)+'</div></div></div>'
            + '<p class="bd">'+fmt(e.body,q)+'</p>'
            + (e.fam ? '<p class="fm"><b>一家四口</b>　'+fmt(e.fam,q)+'</p>' : '')
            + '<div class="lk">'+(e.map ? '<a class="map" href="'+esc(e.map)+'" target="_blank" rel="noopener">地图 <span class="ar">↗</span></a>' : '')
            + e.links.map(l => '<a href="'+esc(l.url)+'" target="_blank" rel="noopener"'+langAttr(l.label)+'>'+esc(l.label)+' <span class="ar">↗</span></a>').join('')+'</div></li>';
        }).join('')+'</ol>'
      + (!q && s.tip ? '<div class="tip"><span class="tl">今天这样挑</span><span>'+fmt(s.tip)+'</span></div>' : '')
      + '</section>';
  });
  if (q && !total) h = '<p class="empty">没有找到“'+esc(query[b])+'”。换个词，比如日文店名或料理。</p>';
  $('#v-'+b+' .body').innerHTML = h;
}

/* ----- appendix ----- */
let done = {};
try { done = JSON.parse(localStorage.getItem('jp27-todo') || '{}') || {}; } catch(e) {}
function renderInfo(){
  let h = '<div class="vhead"><h2><span class="k" lang="ja">要</span>附录 · 执行细节</h2><p>交通行李、预约换日、孩子与吟游、退税返程，以及日本 eVISA。各节标注核对时间，出发前再开官方入口复核。</p></div>';
  h += '<div class="apx c-osaka" id="info-todo"><div class="id">TO DO</div><h3>尚待确认</h3><div class="lk"><a href="#info-E">日本 eVISA 材料与办理</a></div><ul class="todo">'
    + D.todo.map((t,i) => '<li><label><input type="checkbox" id="todo-'+i+'"'+(done[i]?' checked':'')+'><span>'+fmt(t)+'</span></label></li>').join('')
    + '</ul><p class="small">勾选只保存在这台设备的浏览器里。</p></div>';
  D.apx.forEach(a => {
    h += '<div class="apx" id="info-'+a.id+'"><div class="id">APPENDIX '+a.id+'</div><h3>'+esc(a.title)+'</h3><p class="ld">'+esc(a.lead)+'</p>'
      + a.parts.map(p => '<h4>'+esc(p.h)+'</h4>'+(p.p || []).map(x=>'<p>'+fmt(x)+'</p>').join('') + (p.checklist ? '<ul class="todo">'+p.checklist.map(t => '<li><label><input type="checkbox" id="'+esc(t.id)+'" data-check-key="'+esc(t.id)+'"'+(done[t.id]?' checked':'')+'><span>'+fmt(t.text)+'</span></label></li>').join('')+'</ul>' : '')).join('')
      + '<div class="lk">'+a.links.map(l => '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' <span class="ar">↗</span></a>').join('')+'</div></div>';
  });
  h += '<div class="apx" id="info-ref"><div class="id">REFERENCE</div><h3>这套攻略怎么用</h3><div class="refs">'
    + D.ref.map(r => '<p><b>'+esc(r.h)+'</b>'+fmt(r.p)+'</p>').join('') + '</div></div>';
  $('#v-info').innerHTML = h;
  $('#v-info').addEventListener('change', e => {
    if (e.target.type !== 'checkbox') return;
    const m = e.target.id && e.target.id.match(/^todo-(\d+)$/);
    const key = e.target.dataset.checkKey || (m && m[1]);
    if (key === null || key === undefined || key === false) return;
    done[key] = e.target.checked;
    try { localStorage.setItem('jp27-todo', JSON.stringify(done)); } catch(err) {}
  });
}

/* ----- router ----- */
renderTrip(); renderInfo(); ['eat','shop','see'].forEach(renderBookShell);
function show(v){ document.querySelectorAll('.view').forEach(x => x.hidden = x.id !== 'v-'+v); }
function route(){
  const h = (location.hash || '#trip').slice(1);
  let tab = 'trip', target = null, top = true;
  let m;
  if ((m = h.match(/^d(\d{1,2})$/)) && +m[1] >= 1 && +m[1] <= D.days.length){ renderDay(+m[1]); show('day'); tab='trip'; }
  else if ((m = h.match(/^(eat|shop|see)(?:-([A-Z0-9]+))?$/))){ show(m[1]); tab=m[1]; if (m[2]) { target = document.getElementById(m[1]+'-'+m[2]); if (!target && query[m[1]]) { query[m[1]]=''; const i=$('#q-'+m[1]); i.value=''; i.nextElementSibling.hidden=true; renderBookBody(m[1]); target = document.getElementById(m[1]+'-'+m[2]); } } }
  else if ((m = h.match(/^info(?:-([A-Za-z]+))?$/))){ show('info'); tab='info'; if (m[1]) target = document.getElementById('info-'+m[1]); }
  else show('trip');
  document.getElementById('mast').hidden = !(tab==='trip' && !h.startsWith('d'));
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.getAttribute('href') === '#'+h));
  const c = document.querySelector('.chip.on');
  if (c) { const bar = c.parentElement; bar.scrollLeft = c.offsetLeft - bar.clientWidth/2 + c.offsetWidth/2; }
  if (target) requestAnimationFrame(() => target.scrollIntoView({block:'start', behavior:'instant'}));
  else window.scrollTo({top:0, behavior:'instant'});
}
window.addEventListener('hashchange', route);
// in-page links: set the hash directly so navigation never depends on a <base> URL
document.addEventListener('click', e => {
  const l = e.target.closest('a[href^="#"]'); if (!l || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const h = l.getAttribute('href');
  if (location.hash === h) route(); else location.hash = h;
});
route();
})();
</script>
