<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan 2027">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Japan 2027 Family Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a railway line map. Each city is a line colour; days are stations on it;
   every day opens under a 駅名標-style station sign. Bottom tab bar switches 行程 / 宿 / 吃 / 买 / 玩 / 附录. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#15191C; --muted:#586168; --rule:#D3D9D6;
  --tokyo:#2256A3; --hakone:#2A7A50; --osaka:#CC5420; --travel:#66717C; --night:#4D4A93; --misc:#7A6A3A;
  --check:#A8302E; --check-bg:#F6E6E3; --on-line:#FFFFFF;
  --f-ja:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans SC",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-ro:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --r:10px; --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101416; --surface:#1A1F22; --sunk:#151A1C; --ink:#E6EAE8; --muted:#98A2A7; --rule:#2B3337;
  --tokyo:#78A2E6; --hakone:#5EBB89; --osaka:#F08A55; --travel:#A0AAB4; --night:#A4A1EA; --misc:#CDB77A;
  --check:#F08A84; --check-bg:#2E1E1D; --on-line:#0E1214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101416; --surface:#1A1F22; --sunk:#151A1C; --ink:#E6EAE8; --muted:#98A2A7; --rule:#2B3337;
  --tokyo:#78A2E6; --hakone:#5EBB89; --osaka:#F08A55; --travel:#A0AAB4; --night:#A4A1EA; --misc:#CDB77A;
  --check:#F08A84; --check-bg:#2E1E1D; --on-line:#0E1214; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:15.5px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--tokyo);outline-offset:2px;border-radius:4px}
[lang="ja"]{font-family:var(--f-ja)}
.ro{font-family:var(--f-ro);letter-spacing:.04em}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.c-tokyo{--line:var(--tokyo)} .c-hakone{--line:var(--hakone)} .c-osaka{--line:var(--osaka)}
.c-dep,.c-ret{--line:var(--travel)} .c-night{--line:var(--night)} .c-misc{--line:var(--misc)}

/* ---------- masthead ---------- */
.mast{padding-block:22px 6px}
.eyebrow{font-family:var(--f-ro);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast h1{font-family:var(--f-ja);font-weight:700;font-size:28px;letter-spacing:.02em;margin-top:4px}
.mast h1 small{display:block;font-family:var(--f-zh);font-weight:500;font-size:15px;color:var(--muted);letter-spacing:0;margin-top:2px}
.status{margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.status b{font-family:var(--f-ro);font-size:30px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.status a{font-weight:500;color:var(--ink)}

/* route strip: the whole trip as one line */
.route{margin-top:18px;display:grid;grid-template-columns:52px 5fr 2.6fr 5fr 44px;align-items:start;gap:0}
.route .seg{position:relative;padding-top:20px;min-width:0}
.route .seg::before{content:"";position:absolute;left:0;right:0;top:7px;height:5px;background:var(--line)}
.route .seg::after{content:"";position:absolute;left:0;top:3px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.route .seg.end::before{right:auto;width:0}
.route .nm{display:block;font-family:var(--f-ja);font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap}
.route .nt{display:block;font-family:var(--f-ro);font-size:12px;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.route .c-dep .nm,.route .c-ret .nm{font-family:var(--f-ro);font-weight:600}

/* ---------- views ---------- */
.view[hidden]{display:none}
.vhead{padding-block:22px 10px}
.vhead h2{font-size:24px;font-weight:700}
.vhead h2 .k{font-family:var(--f-ja);display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);text-align:center;line-height:38px;font-size:19px;margin-right:10px;vertical-align:-4px}
.vhead p{color:var(--muted);margin-top:8px;font-size:14.5px;max-width:34em}

/* ---------- itinerary line map ---------- */
.line{list-style:none;margin:10px 0 0;padding:0}
.city-h{display:flex;align-items:baseline;gap:10px;padding:18px 0 6px 0}
.city-h .nm{font-family:var(--f-ja);font-weight:700;font-size:18px;color:var(--line)}
.city-h .ro{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.city-h .cstay{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.stop{position:relative;padding-left:34px}
.stop::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:5px;background:var(--line)}
.stop.first::before{top:26px}.stop.last::before{bottom:calc(100% - 26px)}
.stop::after{content:"";position:absolute;left:5px;top:18px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.stop.today::after{background:var(--line)}
.stop a{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:1px;text-decoration:none;padding:10px 12px 12px;margin-bottom:6px;border-radius:var(--r);min-width:0}
.stop a:hover{background:var(--surface)}
.stop.today a{background:var(--surface);box-shadow:0 0 0 2px var(--line) inset}
.stop .dn{grid-row:1/3;font-family:var(--f-ro);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em;line-height:1.15;text-align:center;padding-top:4px;font-variant-numeric:tabular-nums}
.stop .dn b{display:block;font-size:24px;color:var(--ink);letter-spacing:0}
.stop .t1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.stop .t1 .sn{font-family:var(--f-ja);font-weight:700;font-size:17px}
.stop .t1 .dt{font-size:12.5px;color:var(--muted);font-family:var(--f-ro);letter-spacing:.03em}
.stop .t1 .dt .zh{font-family:var(--f-zh)}
.stop .t2{font-size:14px;color:var(--muted);min-width:0;line-height:1.5}
.tag-today{font-family:var(--f-ro);font-weight:700;font-size:11px;letter-spacing:.12em;background:var(--line);color:var(--surface);padding:1px 7px;border-radius:3px}

/* ---------- day detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:14px;color:var(--muted);text-decoration:none;padding:6px 0}
.sign{margin-top:10px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 var(--rule)}
.sign .top{padding:18px 16px 10px;text-align:center}
.sign .big{font-family:var(--f-ja);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:.06em}
.sign .rom{font-family:var(--f-ro);font-weight:600;font-size:16px;letter-spacing:.12em;margin-top:4px;color:var(--muted)}
.sign .band{background:var(--line);color:var(--on-line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.sign .band a,.sign .band span.nil{display:flex;align-items:center;gap:6px;padding:8px 12px;text-decoration:none;color:var(--on-line);font-size:13px;min-width:0}
.sign .band a:last-child{justify-content:flex-end;text-align:right}
.sign .band .mid{font-family:var(--f-ro);font-weight:700;letter-spacing:.1em;font-size:14px;background:rgba(0,0,0,.18);padding:4px 10px;border-radius:3px;white-space:nowrap}
.sign .band a b{font-family:var(--f-ja);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign .band a small{font-family:var(--f-ro);opacity:.85}
.sign .under{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:12.5px;color:var(--muted);font-family:var(--f-ro);letter-spacing:.04em}
.sign .under .zh{font-family:var(--f-zh)}
.dtitle{margin-top:22px}
.dtitle h2{font-size:22px;font-weight:700}
.dtitle p{margin-top:6px;color:var(--muted)}
.judge{display:inline-flex;margin-top:12px;font-size:13.5px;font-weight:500;border:1.5px solid var(--line);color:var(--line);padding:3px 10px;border-radius:20px}
.blk{margin-top:26px}
.lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.lbl .en{font-family:var(--f-ro);font-weight:600;letter-spacing:.14em}
.lbl::after{content:"";flex:1;height:1px;background:var(--rule)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 12px 30px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:21px;height:21px;border-radius:50%;background:var(--line);color:var(--surface);font:700 12.5px/21px var(--f-ro);text-align:center}
.steps li::after{content:"";position:absolute;left:9.5px;top:26px;bottom:2px;width:2px;background:var(--rule)}
.steps li:last-child::after{display:none}
.stay{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.stay p+p{margin-top:6px}
.stay .l0{font-weight:700}
.trio{display:grid;gap:10px}
.trio section{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.mk{font-family:var(--f-ja);font-weight:700;font-size:16px;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;border:2px solid var(--ink)}
.trio ul{list-style:none;margin:0;padding:0}
.trio li{padding-left:14px;position:relative}
.trio li+li{margin-top:4px}
.trio li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:2px;background:var(--muted)}
.note{margin-top:26px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--check-bg);border-radius:var(--r);padding:12px 14px;font-size:14px}
.stamp{font-family:var(--f-ja);font-weight:700;font-size:12px;color:var(--check);border:1.5px solid var(--check);border-radius:4px;padding:1px 5px;white-space:nowrap;margin-top:2px}
.ax{color:var(--tokyo);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.rel{display:grid;gap:8px}
.rel a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-decoration:none;min-width:0}
.rel .bk{font-family:var(--f-ja);font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--surface);display:grid;place-items:center;font-size:14px}
.rel .tx{min-width:0;line-height:1.4}
.rel .tx b{display:block;font-weight:700;font-size:14.5px}
.rel .tx span{font-size:13px;color:var(--muted)}
.rel .n{font-family:var(--f-ro);font-size:13px;color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.pager a{flex:1;text-decoration:none;background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);min-width:0}
.pager a b{display:block;color:var(--ink);font-size:14.5px}
.pager a.nx{text-align:right}

/* ---------- companion books ---------- */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--rule)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:9px 0;outline:none}
.search button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--f-ja);font-weight:700;font-size:13.5px;padding:5px 11px 5px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--rule);white-space:nowrap}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{padding-top:26px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 108px)}
.sec-h{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.msign{min-width:66px;background:var(--surface);border-radius:6px;overflow:hidden;text-align:center;box-shadow:0 1px 0 var(--rule)}
.msign b{display:block;font-family:var(--f-ja);font-size:15px;padding:5px 8px 3px;line-height:1.2;white-space:nowrap}
.msign span{display:block;background:var(--line);color:var(--on-line);font-family:var(--f-ro);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;white-space:nowrap}
.sec-h .ttl{min-width:0}
.sec-h .ttl .ar{font-family:var(--f-ja);font-weight:700;font-size:14px;color:var(--line)}
.sec-h h3{font-size:19px;font-weight:700}
.sec .lead{margin-top:10px;color:var(--muted);font-size:14.5px}
.sec .hint{margin-top:4px;font-size:13px;color:var(--muted);font-family:var(--f-ja)}
.ents{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ent{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
.ent .hd{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.ent .no{font-family:var(--f-ro);font-weight:700;font-size:14px;color:var(--line);font-variant-numeric:tabular-nums}
.ent h4{margin:0;font-family:var(--f-ja);font-weight:700;font-size:17px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.ent .tg{margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.5}
.ent .bd{margin-top:8px}
.ent .fm{margin-top:8px;font-size:14px;color:var(--muted);padding-left:10px;border-left:2px solid var(--rule)}
.ent .fm b{color:var(--ink);font-weight:500}
.lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lk a{display:inline-flex;align-items:center;gap:4px;font-size:13px;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:4px 9px;max-width:100%;line-height:1.35}
.lk a.map{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.lk a .ar{font-family:var(--f-ro);opacity:.7}
.tip{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:var(--r);border:1.5px dashed var(--line)}
.tip .tl{font-weight:700;color:var(--line);white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
mark{background:color-mix(in srgb,var(--osaka) 28%,transparent);color:inherit;border-radius:2px}


/* ---------- station index & station pages ---------- */
.stns{display:grid;gap:8px}
.stn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-decoration:none;min-width:0}
.stn:hover{box-shadow:0 0 0 2px var(--line) inset}
.stn .tx{min-width:0;line-height:1.4}
.stn .tx b{display:block;font-family:var(--f-ja);font-weight:700;font-size:14.5px;color:var(--line)}
.stn .tx span{display:block;font-size:14px}
.stn .n{font-family:var(--f-ro);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.stn .n small{display:block;font-size:11.5px;letter-spacing:.04em}
a.sec-h{text-decoration:none}
.dtitle .hint{font-size:13px;margin-top:6px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchips a{display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:baseline;text-decoration:none;background:var(--surface);border-radius:8px;padding:6px 10px 6px 9px;border-left:4px solid var(--line)}
.dchips b{font-family:var(--f-ro);font-size:13px;letter-spacing:.04em}
.dchips span{font-family:var(--f-ja);font-weight:700;font-size:14px}
.dchips small{grid-column:1/-1;font-size:12px;color:var(--muted);font-family:var(--f-ro)}

/* ---------- home bases ---------- */
.bases{display:grid;gap:14px}
.bcard{display:block;text-decoration:none;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 var(--rule)}
.bcard:hover,.bcard.today{box-shadow:0 0 0 2px var(--line)}
.bcard .top,.sign .top{position:relative}
.bcard .top{padding:16px 16px 10px;text-align:center}
.kana{font-family:var(--f-ja);font-size:13px;color:var(--muted);letter-spacing:.24em}
.bcard .big{font-family:var(--f-ja);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:.06em}
.bcard .rom{font-family:var(--f-ro);font-weight:600;font-size:16px;letter-spacing:.12em;margin-top:4px;color:var(--muted)}
.bcard .band{background:var(--line);color:var(--on-line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:42px;padding:6px 12px;font-size:13px}
.bcard .band span:first-child{font-family:var(--f-ja);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bcard .band span:last-child{text-align:right;font-family:var(--f-ro);font-weight:600;letter-spacing:.04em}
.bcard .band .mid{font-family:var(--f-ro);font-weight:700;letter-spacing:.1em;font-size:14px;background:rgba(0,0,0,.18);padding:4px 10px;border-radius:3px;white-space:nowrap}
.bcard .under{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;font-family:var(--f-ro);font-size:13.5px;color:var(--muted)}
.bcard .under .go,.bcard .under .tag-today{margin-left:auto}
.bcard .under .go{color:var(--ink);font-weight:600}
.kd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;border:1.5px solid var(--muted);font-family:var(--f-ja);font-style:normal;font-weight:700;font-size:11.5px;line-height:1;margin-right:4px;color:var(--ink);vertical-align:-4px;flex:none}
.kd.k-kids{border-color:var(--hakone);color:var(--hakone)}
.kd.k-night{background:var(--night);border-color:var(--night);color:var(--on-line)}
.small .kd{margin-left:2px}
.btools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:18px -16px 0;padding:8px 16px;border-bottom:1px solid var(--rule)}
.bchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bchips::-webkit-scrollbar{display:none}
.bchips .chip{cursor:pointer;font:inherit;font-family:var(--f-zh);font-weight:500;font-size:13.5px;color:var(--ink);padding:4px 11px}
.bchips .chip::before{display:none}
.bchips .chip .ct{font-family:var(--f-ro);color:var(--muted);font-size:12.5px}
.bchips .chip.on{color:var(--bg)}
.bchips .chip.on .ct{color:inherit;opacity:.7}
.small .lg{white-space:nowrap;margin-right:10px}
.bchips .chip.on .kd:not(.k-night){border-color:var(--bg);color:var(--bg)}
.ring{padding-top:22px}
.rh{display:flex;align-items:center;gap:10px}

.refs{display:grid;gap:12px;margin-top:10px;font-size:14px}

<script >
'use strict';
(() => {
 const media=window.matchMedia('(prefers-color-scheme: dark)');
 const modes=['system','light','dark'];
 let preference='system';
 try{const saved=localStorage.getItem('japan-reading-theme');if(modes.includes(saved))preference=saved;}catch{}
 function resolve(){
  const dark=preference==='dark'||(preference==='system'&&media.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.colorScheme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#101416':'#eef1ef');
  window.dispatchEvent(new CustomEvent('guide-theme-change'));
 }
 window.GUIDE_THEME={get preference(){return preference;},set(mode){
  if(!modes.includes(mode))return;
  preference=mode;try{localStorage.setItem('japan-reading-theme',mode);}catch{}
  resolve();
 }};
 media.addEventListener('change',()=>{if(preference==='system')resolve();});
 resolve();
})();

</script>

E", "url": "https://naraya-cafe.com/"}, {"label": "富士屋ホテルPicot", "url": "https://www.fujiyahotel.jp/meal/picot/index.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%AE%AE%E3%83%8E%E4%B8%8B%E9%A7%85"}, {"name": "彫刻の森美術館｜ネットの森と野外彫刻", "tag": "默认半日／约2–3小时／室外为主", "body": "孩子能进部分体验型作品，家长也能看艺术与山景。挑ネットの森、几件好玩的雕塑和休息点，就足够形成一个上午。", "fam": "ネットの森目前供小学生及以下儿童玩，恶劣天气不能使用；大人不按儿童玩法攀爬。", "links": [{"label": "雕刻之森亲子设施", "url": "https://www.hakone-oam.or.jp/kidsandfamily/"}, {"label": "雕刻之森常见问题", "url": "https://www.hakone-oam.or.jp/contact/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%AE%B1%E6%A0%B9+%E5%BD%AB%E5%88%BB%E3%81%AE%E6%A3%AE%E7%BE%8E%E8%A1%93%E9%A4%A8"}, {"name": "大涌谷／箱根ロープウェイ", "tag": "本次默认不安排／仅作改计划时的替换资料", "body": "本次 DAY 08 默认不排：山上冷、可能临时停运，三连休排队时间说不准。只有全家当天特别想坐缆车、看地热景观，主动改计划时，才拿它替换雕刻之森，而且只坐早云山—大涌谷短段往返，不追加整圈。它不是雕刻之森结束后再随手加一站。", "fam": "强风、雷电、火山活动、维护等可能停运；出门前看运营公告，到站再看去程和回程的等待。任一段预计超过 20–30 分钟就放弃，这是我们家可接受的标准，不是官方预测。下午仍留回吟游的余量。", "links": [{"label": "箱根索道运行信息", "url": "https://www.hakonenavi.jp/hakone-ropeway/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E6%B6%8C%E8%B0%B7"}]}, {"code": "O2", "city": "osaka", "sign": "日本橋", "ro": "Nipponbashi", "area": "難波／日本橋", "head": "狮子、厨具和食品模型", "lead": "这几个短点，比把所有游戏店都扫完更适合临时添趣味。", "hint": "电电城 → 道具屋筋；八阪神社在难波站西南侧，要另走一段。", "tip": "道具屋筋适合一家四口一起看；游戏店可轮流逛；狮子殿只在体力够时延伸。", "entries": [{"name": "千日前道具屋筋", "tag": "顺路／30–60分钟／白天店铺为主", "body": "锅碗、刀具、灯笼、招牌和食品模型，把日本餐馆背后的道具展示给你看。即使不买，孩子也容易对仿真食物有反应。", "fam": "街区有制作体验，但不是走进就能参加。具体店铺的时段、年龄与预约再查。", "links": [{"label": "千日前道具屋筋", "url": "https://www.doguyasuji.or.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%8D%83%E6%97%A5%E5%89%8D%E9%81%93%E5%85%B7%E5%B1%8B%E7%AD%8B"}, {"name": "難波八阪神社：巨大的狮子殿", "tag": "额外短支线／20–30分钟／室外", "body": "相比再进一间周边店，这个狮子造型很容易让孩子记住。适合从难波南侧出发单独走一个来回。", "fam": "它不是通天阁，也不在道顿堀桥边。神社开放时间先看当天信息，别留成深夜项目。", "links": [{"label": "难波八阪神社观光资料", "url": "https://osaka-info.jp/experience/ja/osaka/spot/246"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%9B%A3%E6%B3%A2%E5%85%AB%E9%98%AA%E7%A5%9E%E7%A4%BE"}, {"name": "でんでんタウン：两家目标店＋街景", "tag": "半日的一部分／45–90分钟起", "body": "先选老游戏店和漫画／模型店各一家，再看孩子状态。商店招牌与现实大阪街区，已经能满足你“日本游戏城市”的兴趣。", "fam": "任天堂官方店在梅田，不在电电城。孩子不喜欢中古店时，在难波商场会合更方便。", "links": [{"label": "スーパーポテト Ota Road", "url": "https://www.superpotato.com/shop/otaroad/"}, {"label": "アニメイト大阪日本桥", "url": "https://www.animate.co.jp/shop/nipponbashi/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%97%A5%E6%9C%AC%E6%A9%8B+%E3%82%AA%E3%82%BF%E3%83%AD%E3%83%BC%E3%83%89"}]}, {"code": "O3", "city": "osaka", "sign": "新世界", "ro": "Shinsekai", "area": "新世界／天王寺", "head": "你熟悉的大脚丫就在这里", "lead": "通天阁与Glico属于不同街区，这半天给大阪另一张脸。", "hint": "新世界 → 动物园／てんしば → 天王寺；四天王寺再向东北走。", "tip": "最轻是新世界＋てんしば；想看动物或大寺，就替换其中一段。", "entries": [{"name": "通天閣とビリケンさん", "tag": "新世界主点／街景30分钟，上塔另留时间", "body": "先在街上看塔、串炸招牌与街区，再决定是否上展望台。想看通天阁内的ビリケン，需要按馆方路线购票进入。", "fam": "周边还有不少ビリケン造型；若只想合照，看街区即可。TOWER SLIDER目前最低7岁，这次两孩不列入。", "links": [{"label": "通天阁", "url": "https://www.tsutenkaku.co.jp/"}, {"label": "通天阁滑梯年龄说明", "url": "https://tsutenkaku.co.jp/tour/tower-slider.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%80%9A%E5%A4%A9%E9%96%A3"}, {"name": "てんしば 芝生広場とカフェ", "tag": "轻项目／30–60分钟／适合暂停逛店", "body": "孩子想跑动时，在天王寺公園入口一侧停下来。草坪、咖啡和商场近，能把“大人看街景”转成全家的休息段。", "fam": "有付费活动区，不能把它们统称免费。按草坪当天使用规则选位置。", "links": [{"label": "てんしば设施与餐馆", "url": "https://www.tennoji-park.jp/facility"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%A6%E3%82%93%E3%81%97%E3%81%B0"}, {"name": "天王寺動物園", "tag": "替换主项目／约2–3小时／室外", "body": "如果孩子特别想看动物，把这半天改成动物园＋てんしば就成立，不用再接完整电电城。", "fam": "常见周一休园、节假日调整，查参观日。它与上野动物园不用都安排。", "links": [{"label": "天王寺動物園开放说明", "url": "https://www.tennojizoo.jp/info/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A9%E7%8E%8B%E5%AF%BA%E5%8B%95%E7%89%A9%E5%9C%92"}, {"name": "四天王寺", "tag": "传统文化支线／45–75分钟／需再移动", "body": "你若想看一处更完整的寺院，这里可以单独留时间。中心伽蓝和庭园等区域，购票与开放按当日。", "fam": "从通天阁不是下楼即到；别把寺院、动物园和上塔都塞在同一个半天。", "links": [{"label": "四天王寺官方观光资料", "url": "https://osaka-info.jp/experience/ja/osaka/spot/286"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%9B%9B%E5%A4%A9%E7%8E%8B%E5%AF%BA"}]}, {"code": "O4", "city": "osaka", "sign": "梅田", "ro": "Umeda", "area": "梅田之外", "head": "大阪还有一张亲子雨天牌", "lead": "角色店可以逛半天，另外半天不必继续追商场。", "hint": "大阪站／梅田、扇町、天神桥筋六丁目是不同落点。", "tip": "孩子想玩选キッズプラザ大阪；你想看城市历史选今昔馆；天气好可把商场换成中之岛。", "entries": [{"name": "キッズプラザ大阪", "tag": "独立半日／约2–3小时起／室内", "body": "有科学、文化体验与能钻来钻去的“儿童之街”，比纯展板博物馆更适合两孩主动玩。可以替换梅田购物半天。", "fam": "在扇町，需要另一次交通；不是LUCUA楼里。0–2 岁专区不适用：妹妹出行时已 3 岁，跟哥哥玩其他区域。", "links": [{"label": "キッズプラザ大阪楼层说明", "url": "https://www.kidsplaza.or.jp/floor/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%AD%E3%83%83%E3%82%BA%E3%83%97%E3%83%A9%E3%82%B6%E5%A4%A7%E9%98%AA"}, {"name": "大阪くらしの今昔館", "tag": "独立支线／约60–90分钟／室内街景", "body": "重现老大阪街区，适合你想看看过去的城市生活，而孩子又不愿长时间读说明牌时考虑。", "fam": "目前计划休馆至2027/1/5，三月仍要核对重开状态。旧XR项目已经结束，不恢复进推荐。", "links": [{"label": "大阪くらしの今昔馆与休馆公告", "url": "https://www.osaka-angenet.jp/konjyakukan/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E3%81%8F%E3%82%89%E3%81%97%E3%81%AE%E4%BB%8A%E6%98%94%E9%A4%A8"}, {"name": "中之島公園・中央公会堂", "tag": "替换商场散步／45–60分钟／室外", "body": "河流、桥梁与红砖建筑，让你看到大阪除了道顿堀之外更舒展的一面。很适合相机散步。", "fam": "三月不期待盛开的玫瑰园；以建筑和河边为主。公会堂室内不默认自由进入。", "links": [{"label": "中之岛公園官方观光资料", "url": "https://discover.osaka-info.jp/jp/spots/nakanoshima-park"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E4%B9%8B%E5%B3%B6%E5%85%AC%E5%9C%92"}]}, {"code": "O5", "city": "osaka", "sign": "天保山", "ro": "Tempozan", "area": "海遊館／大阪城", "head": "主线之外只添一个", "lead": "这两处各有一片开放空间，不用把下午重新塞满。", "hint": "大阪港与大阪城分开看，选当前所在片区即可。", "tip": "港边：水族馆＋散步；城边：城外＋补给。多出来的票都让当天兴趣决定。", "entries": [{"name": "海遊館周辺 港の散歩", "tag": "顺路／20–30分钟／无额外门票", "body": "出馆后看看船、港湾和建筑，把室内看鱼切到室外透气。拍几张海港照片，今天就已经很完整。", "fam": "有风或孩子累时直接回城。海游馆参观可以慢慢看，不必为了追下午项目提前离馆。", "links": [{"label": "天保山周边设施", "url": "https://www.kaiyukan.com/thv/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A9%E4%BF%9D%E5%B1%B1%E3%83%8F%E3%83%BC%E3%83%90%E3%83%BC%E3%83%93%E3%83%AC%E3%83%83%E3%82%B8"}, {"name": "天保山大観覧車／帆船型観光船サンタマリア", "tag": "周边付费项目／二选一", "body": "晴天又有精神，可以从高处看港湾，或坐船体验大阪港。它们是可选，不是海游馆门票自带项目。", "fam": "班次、天气停运与儿童规则再查。海游馆后只加其中一项，孩子困了就全取消。", "links": [{"label": "天保山周边设施", "url": "https://www.kaiyukan.com/thv/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A9%E4%BF%9D%E5%B1%B1%E5%A4%A7%E8%A6%B3%E8%A6%A7%E8%BB%8A"}, {"name": "大阪城公園", "tag": "独立半日／60–90分钟／室外", "body": "护城河、石墙、城楼外观与公园，是不进天守阁也能完成的历史空间体验。按回程出口决定走多长。", "fam": "从车站到城楼还要步行。花况顺路看；不为未开花调整所有日程。", "links": [{"label": "大阪城公园官方观光资料", "url": "https://osaka-info.jp/spot/osaka-castle-park/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E5%9F%8E%E5%85%AC%E5%9C%92"}, {"name": "大阪城天守閣", "tag": "城内历史展示／再留60–90分钟", "body": "你确实想看大阪历史展示时再入馆。外景摄影与里面读展，可以作为两种不同玩法。", "fam": "孩子只想跑动时就留公园；实际入馆与电梯队伍可能占时间，不把票当必须买。", "links": [{"label": "大阪城公园官方观光资料", "url": "https://osaka-info.jp/spot/osaka-castle-park/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E5%9F%8E%E5%A4%A9%E5%AE%88%E9%96%A3"}]}, {"code": "O6", "city": "osaka", "sign": "奈良", "ro": "Nara", "area": "奈良公園／東大寺", "head": "大阪段固定的一天：看鹿和大佛", "lead": "从難波坐近铁约 40 分钟，不换车。上午看鹿、看大佛，中午在公园和车站之间吃饭，下午不用赶，三四点回心斋桥就行。", "hint": "近鉄奈良站出站，步行约 5 分钟到公园边缘，约 20 分钟到东大寺（成人步速）。", "tip": "默认 3/24；抽中 3/24 Museum 时移到 3/25（附录 B）。鹿是主角，东大寺看孩子状态决定进不进殿。下午三四点回到大阪就行，不用赶。春日大社、若草山、奈良町这次不排。", "entries": [{"name": "奈良公園：看鹿", "tag": "DAY 12 主线／出站步行约 5 分钟／室外", "body": "出站往东走就进公园，一路都有鹿。慢慢走向东大寺，路上的鹿和草地本身就是上午的节目。", "fam": "鹿是野生动物，只喂当地售卖的鹿仙贝，由大人拿着喂。妹妹和鹿脸差不多高，坐推车或让大人抱着；喂完摊开空手给鹿看。孩子不想靠近也可以远远看，不需要一定喂。 官方也提醒：鹿急着要仙贝时会围上来，小孩容易被吓到。", "links": [{"label": "奈良县官方：奈良公园与交通", "url": "https://www.visitnara.jp/venues/A00489/"}, {"label": "奈良县官方：看鹿与喂食提醒", "url": "https://www.visitnara.jp/venues/S01487/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A5%88%E8%89%AF%E5%85%AC%E5%9C%92"}, {"name": "東大寺 大仏殿", "tag": "DAY 12 看状态决定／公园内步行可达／三月 8:00–17:00", "body": "鹿群就在去东大寺的路上。南大门两尊金刚力士像很高，孩子多半记得住；进殿看大佛，再钻柱子洞（据说能保平安），哥哥正好钻得过，可能要排一会儿队。孩子累了，看完南大门就回。柱子洞当天是否开放以现场为准。", "fam": "官网票价：成人 ¥800、6–12 岁 ¥400；票价表没有列 6 岁以下，按现场说明。三月开放时间 8:00–17:00。核对于 2026/10/3。", "links": [{"label": "东大寺：开放时间与门票", "url": "https://www.todaiji.or.jp/en/information/haikan/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E5%A4%A7%E5%AF%BA+%E5%A4%A7%E4%BB%8F%E6%AE%BF"}]}, {"code": "X1", "city": "misc", "sign": "外延", "ro": "Side trips", "area": "小倉／宇治", "head": "需要另安排的外延", "lead": "收进来方便你临时改主意，但不伪装成当前路线的顺路点。", "hint": "每一项都要替换一个半天以上。奈良已改成大阪段固定的一天，单独成站：玩 · 奈良（DAY 12）。", "tip": "这里都不是当前默认路线。Museum 中签按附录 B 换日；平等院不默认附加在 Museum 之后。奈良请看大阪段的「奈良」一站。", "entries": [{"name": "ニンテンドーミュージアム（小倉）", "tag": "整日主项目／大阪往返／按票面入场", "body": "想看任天堂产品历史、互动展示与博物馆商店，中签才把这一天独立留出来。咖啡馆也在馆内。", "fam": "不为没票单独跑去商店。小倉和宇治河边不是同一个景区，交通与互动规则见官网。 商店有博物馆限定的「鳳凰」花札（金色装饰、特别包装，¥9,900含税），也卖普通版；想买的几副花札里留一副给它。", "links": [{"label": "Nintendo Museum参观流程", "url": "https://museum.nintendo.com/en/guide/visit-flow/index.html"}, {"label": "Nintendo Museum商店", "url": "https://museum.nintendo.com/en/shop/index.html"}, {"label": "Nintendo Museum咖啡馆", "url": "https://museum.nintendo.com/en/cafe/index.html"}, {"label": "博物馆限定「鳳凰」花札", "url": "https://www.ndw.jp/nintendomuseum-240925-shop-houou/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%8B%E3%83%B3%E3%83%86%E3%83%B3%E3%83%89%E3%83%BC%E3%83%9F%E3%83%A5%E3%83%BC%E3%82%B8%E3%82%A2%E3%83%A0"}, {"name": "平等院・宇治川", "tag": "宇治市中心外延／至少另留半天", "body": "若你后来特别想看平等院，可当单独替换；茶街、河边与寺院会形成另一种日本体验。", "fam": "不默认附加在Museum结束后。已经买好入馆时段、孩子也累时，直接回大阪更容易。", "links": [{"label": "宇治平等院官方旅游资料", "url": "https://www.city.uji.kyoto.jp/soshiki/88/2906.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%B9%B3%E7%AD%89%E9%99%A2"}]}]}}, "apx": [{"id": "A", "title": "交通与行李｜把移动日做轻", "lead": "路线为操作建议；精确车次、寄送时效和酒店代收须在预订时确认。", "parts": [{"h": "城际三段：先选方便的车次，再倒排出门", "p": ["3/19 东京 → 吟游：酒店 → 东京站 → 停小田原的新干线 → 小田原站打车到宫之下（约 30 分钟）。不坐登山电车，免去换乘、折返和上下楼梯；目标是接近 14:00 入住。", "3/21 吟游 → 大阪：请旅馆叫出租车到小田原 → 新干线到新大阪 → 心斋桥。筛选停小田原的班次，不要默认每班 Hikari 都停；连休加春假，日本时间 2/21（周日）10:00 开售，也就是芝加哥 2/20（周六）晚上 7:00，开售就订。smartEX 可以提前一年预约部分产品（「1 年前予約」）：预约完成即扣款，座位号确定前取消也要付退款手续费，不是免费保留名额。乘车前一个月日本时间 08:00 起陆续确定车次、时刻和座位并发邮件通知；10:00 起（本次是芝加哥 2/20 晚上 7:00）才能自己修改，有空位时可以尝试改到 D、E 座，不收修改手续费，但不保证拿到目标座位；改车次、日期或商品可能要补差额。", "3/26 大阪 → 羽田：心斋桥 → 新大阪 → 品川 → 羽田。大箱子已提前寄出，只带随身包。"]}, {"h": "东京寄大阪：交箱前确认这四项", "p": ["大阪酒店官网 FAQ 确认可提前代收：运单写订房人姓名，不寄冷藏冷冻品。东京最早 3/18 晚或 3/19 早寄出，可能比 3/21 入住早一到两天到。两家都能在前台代寄行李，提前一天告诉前台；联系用官网表单，日语文字沟通即可。", "大阪酒店是否代收、订单姓名与入住日如何填写、承运商预计到达日、东京酒店收件截止时间。交箱日期听酒店建议，不预设 3/19 早上寄必定赶上 3/21。", "保留运单照片和追踪号；大阪到达后核对箱数。箱根小包放两晚用品，再多留一天余量；常用药、证件、充电器与孩子换洗随身带。"]}, {"h": "大阪寄羽田：最后两天不拖箱子", "p": ["3/24 或 3/25 上午把大箱子交给大阪酒店前台（前一天先告诉前台），寄到羽田酒店，或寄到羽田 T3 的空港宅急便柜台在出发当天取。空港柜台要求出发前 2 天（部分地区 3 天）寄出，按柜台截止时间倒排。", "需要办退税查验的商品不要寄，放随身包里，离境时海关要看实物；最后两晚的衣物、药品和充电器也留在身边。"]}, {"h": "新干线座位与行李：大箱子两段都寄送", "p": ["两段大箱子都改为宅急便寄送，新干线上只剩随身包和推车，一般不用订大件行李席。随身包和推车仍按实际尺寸核对：JR 东海规则是长＋宽＋高超过 160 cm、至 250 cm 的须预订对应行李席，超过 250 cm 不可带上车；推车有特殊规则另查官方说明。", "家庭同车厢座位提前选择。出行时哥哥 5 岁、妹妹 3 岁，都还没上小学：按 JR 规则，学龄前儿童不单独占座时免费，要占指定席就买儿童票。以 JR 官方为准，不默认儿童都免费。"]}], "links": [{"label": "smartEX：1年前予約规则", "url": "https://smart-ex.jp/reservation/useful/pre_time/"}, {"label": "smartEX：预约修改与确定时刻", "url": "https://smart-ex.jp/reservation/change/"}, {"label": "JR 东海：大件行李规则", "url": "https://global.jr-central.co.jp/en/info/oversized-baggage/"}, {"label": "SmartEX：大件行李席预订", "url": "https://smart-ex.jp/en/entraining/oversized-baggage/"}, {"label": "ヤマト：空港宅急便", "url": "https://www.kuronekoyamato.co.jp/ytc/customer/send/services/airport/"}, {"label": "Villa Fontaine 羽田（T3 直连）", "url": "https://www.hvf.jp/eng/hanedaairport-grand/"}]}, {"id": "B", "title": "预约与换日｜固定少量硬项目", "lead": "东京看睡眠和天气，大阪跟 Museum 票走；海游馆始终独立保留。", "parts": [{"h": "Nintendo Museum：从 2026 年 12 月开始关注", "p": ["按现行提前三个月抽签规则，2027 年 3 月参观在 2026 年 12 月关注申请。优先 3/24、3/25；愿意接受假日人流时可选 3/22。3/23 为周二，不安排 Museum。", "中签按指定期限付款；未中签继续关注官方余票或取消票。当前规则：通常次月 1 日公布结果、7 日前付款；候补中选另有期限，一律以通知为准。", "这是整趟旅行里最独特的任天堂一站：从京都的花札作坊讲到 Switch，还有大量可动手的展项，奥兰多没有对应体验。抽签当天优先处理。", "票种：0–5 岁免费，但必须和购票大人一起登记；出行时哥哥 5 岁、妹妹 3 岁，两人都免费，实际只付两张成人票。抽签申请时四个人都要填。核对于 2026/10/3，以官网为准。"]}, {"h": "大阪四天：海游馆固定，奈良和梅田跟着 Museum 走", "p": ["没抽中：3/22 南区慢逛 → 3/23 海游馆 → 3/24 奈良 → 3/25 梅田。", "抽中 3/24：3/22 梅田（10:00 开门就去）→ 3/23 海游馆 → 3/24 Museum → 3/25 奈良。", "抽中 3/25：3/22 梅田 → 3/23 海游馆 → 3/24 奈良 → 3/25 Museum。", "抽中 3/22：3/22 Museum → 3/23 海游馆 → 3/24 奈良 → 3/25 梅田。", "Museum 周二休馆，所以海游馆每种情况都在 3/23。南区就在酒店楼下，没有单独占一天时就放在晚饭后。大阪城只作某个下午的备选。3/25 不管去哪，都先把大箱子寄去羽田。"]}, {"h": "当天入馆与交通", "p": ["外国游客包括孩子须携带护照原件，姓名与票面一致。按目前规则，参观前一天日本时间 14:00 起生成 QR 票；有工作坊兴趣，入馆后先询问当天预约。", "近鉄京都線小倉（Ogura）站是最近车站，步行入馆；大阪出发的换乘按票面时段查询。官方要求不要乘汽车、摩托车、自行车或出租车到馆。"]}, {"h": "东京与海游馆：预约前再检查", "p": ["东京默认顺序：3/15 上野／秋叶原近场适应 → 3/16 丰洲 teamLab → 3/17 涩谷 → 3/18 浅草近场收尾。先减少通勤与硬时段，最后一天留出整理箱根行李的余量；当天仍按睡眠和天气缩短活动。", "3/15 周一按不入馆安排：国立科学博物馆与上野动物园通常周一休馆，特别开放须查官方日历。teamLab 先按 3/16 选择时段，未订票前可调整；订好后以票面日期为准。 不去 teamLab 时的替换方案见附录 F。", "丰洲坐船只作下午备选。水上巴士现有缩班，且部分月份会把定休日移到第三个周三；2027 年 3 月船班尚待复核，因此暂保留丰洲在 3/16 周二。", "海游馆订适合孩子的时段；3 岁起收幼児票，两个孩子都要买，票价按日期浮动。下午不再叠加大项目。大阪港駅下车后步行到馆；临近再核对营业日、入场方式和推车安排。"]}, {"h": "USJ：这次不排", "p": ["大阪的 Super Nintendo World 与奥兰多 Epic Universe 的核心项目基本相同，全家已经玩过。按身高估计，明年三月哥哥（5 岁）三个项目大概率都能在大人陪同下坐，妹妹（3 岁、约 1 m）基本只剩耀西；各项身高与年龄限制以 USJ 官方为准。", "春假人潮、快速通关和一整天的代价，换来的大多是重复体验。任天堂熏陶改由 Nintendo Museum、旅馆花札和 Super Potato 复古游戏承担。"]}], "links": [{"label": "任天堂：抽签、付款、证件与 QR 票", "url": "https://museum.nintendo.com/en/guide/visit-flow/index.html"}, {"label": "任天堂：交通与入馆路线", "url": "https://museum.nintendo.com/en/access/index.html"}, {"label": "海游馆：交通", "url": "https://www.kaiyukan.com/info/access/"}, {"label": "国立科学博物馆：开放与休馆", "url": "https://www.kahaku.go.jp/riyou/nyukan-annai/"}, {"label": "上野动物园：开放与休园", "url": "https://www.tokyo-zoo.net/ueno/visitor-info/tickets/index.html"}, {"label": "丰洲水上巴士：运营与班次", "url": "https://www.urbanlaunch.net/boarding/"}, {"label": "海游馆：票种与浮动票价", "url": "https://www.kaiyukan.com/info/ticket/"}, {"label": "任天堂：票价与开放日", "url": "https://museum.nintendo.com/en/guide/index.html"}]}, {"id": "C", "title": "孩子与吟游｜留出真正的休息", "lead": "每天一个主项目；可选项目的决定权留给当天的体力。", "parts": [{"h": "时差与作息：头几天下午会垮，之后不按午睡排", "p": ["两个孩子平时晚上 8:30–9:00 睡、早上 7:20 起，白天不睡午觉。日本比芝加哥快 14 小时（美国 3/14 进夏令时）：日本下午 1 点到 5 点，正是他们身体里的夜里 11 点到凌晨 3 点。", "所以东京头几天（大约 3/15–3/18）下午多半会撑不住，晚上反而早早睡下、半夜醒来。东京几天按“上午主项目、午后可以回酒店”排，就是为了这段时间：撑不住就回去补觉，精神好就照常走下午的选项。", "补觉别睡太长，一个半到两个小时就叫醒，最晚四点前起来，再出门晒太阳、去竹町公园跑一跑；晚饭早吃，睡觉往 8:30–9:00 靠。早上多晒太阳最帮忙。几天能倒过来因人而异，以往长途飞行的经验最准。", "倒过来以后（大约从箱根起）就不再按午睡排：下午是第二段轻松时间，泡汤、公园放电，或回房歇一会儿再出门。晚上 8:30–9:00 睡，爸爸九点以后的时间不变。"]}, {"h": "teamLab Planets：进馆前的准备", "p": ["不能推婴儿车入馆，馆外有推车停放处；可使用前背式背带。暗处牵好孩子，小朋友必要时抱着走，推车不能替代馆内的体力安排。", "带儿童完整换洗一套与装湿衣物的袋子；穿容易活动、卷裤腿的衣服。官方不允许穿湿衣服继续进入后续作品。午饭后看状态，台场可以直接取消。", "水区的水温由馆方按季节调节到让人觉得舒适，官方没有公布具体度数；三月室外冷不代表水冷，但出馆后湿裤腿会冷，换洗照带。", "票种：官方规定未满 3 岁免票；妹妹出行时已满 3 岁，和哥哥一样按官网票种买票。每位大人最多带 3 名儿童（含免票儿童）。核对于 2026/10/3，购票时以官网为准。"]}, {"h": "吟游两晚：出发前向旅馆核对", "p": ["**晚餐时间待提出：希望改到 17:30–18:00**（订房申请目前写的是 19:00，尚未更改）：怀石约两小时，19 点开吃要到 21 点，正好压到孩子平时 8:30–9:00 的睡觉时间。吟游确认后请 Ryokan Collection 一并转达。先核对申请里填的孩子年龄（出行时哥哥 5 岁、妹妹 3 岁），再说明哥哥要儿童餐、妹妹要幼儿餐还是只要寝具；具体餐种和收费以旅馆答复为准。", "请旅馆确认两晚是否更换菜单、儿童餐具体内容、两位孩子的寝具配置、可选用餐时间；以订单确认单为准，不自行假设。", "连住日是否需要离开房间清洁？提前说明 3/20 中午前后就回房、下午在房里泡汤休息，请旅馆建议清洁与铺床时间。", "3/19 中午前后到，先寄存背包再去 NARAYA CAFE；3/20 雕刻之森开门时段半日，大涌谷／缆车这次不排。早餐后若全家想休息，整天留旅馆也成立。"]}, {"h": "城市日：大人购物与孩子活动交替", "p": ["商店集中逛，遇到公园或开放空间就给孩子自由活动时间。东京 Nintendo 与 Pokémon 已是主购物日，大阪只补喜欢的限定或漏买物品。", "海游馆作为正式亲子日；Museum 当天不叠加京都。午饭后若孩子疲劳，取消下午可选活动，不把没做的项目全部追回最后一天。"]}, {"h": "每天出门只检查一个小包", "p": ["水、熟悉零食、湿巾、常用药、换洗、充电与当天票务截图。需要核验身份的场馆带护照原件；移动日额外清点行李数量。", "3/21‑22 是日本连休；箱根外出与大阪商圈按假日预期安排。樱花继续只作顺路加分，不改变住宿与主项目。"]}, {"h": "三月天气与穿衣：分层，随时加减", "p": ["东京（3/14–19）：气象厅三月平年最高 14.2℃、最低 5.0℃，中下旬略暖；大约每三天一场雨。", "箱根宫之下（海拔约 400 m，3/19–21）：介于箱根汤本（三月均温约 12.5℃）与仙石原（约 8.7℃）之间，估计白天 10–14℃，早晚 0–5℃。三月雨量约为东京的 2.5 倍，起雾下雨很常见。", "大阪（3/21–26）：三月平年最高 14.2℃、最低 6.0℃，月底白天常到 16–18℃。", "穿法：每人一件可压缩的轻羽绒或抓绒，外面一件防风防雨外套；电车、商场和室内暖气足，里面穿薄长袖方便脱。孩子比大人多备一层，箱根早晚加帽子和手套。", "旅馆提供浴衣和外褂。暖宝宝（カイロ）到日本便利店买。出发前一周再看实际预报调整。"], "checklist": [{"id": "pack-down", "text": "每人一件轻羽绒或抓绒（可压缩）"}, {"id": "pack-shell", "text": "每人一件防风防雨外套"}, {"id": "pack-kids-layer", "text": "孩子多一层保暖衣，箱根用帽子和手套"}, {"id": "pack-rain", "text": "折叠伞或儿童雨衣（箱根尤其需要）"}, {"id": "pack-shoes", "text": "好穿脱的鞋：旅馆、部分餐厅和榻榻米要脱鞋"}, {"id": "pack-skin", "text": "润唇膏、面霜：空气干"}, {"id": "pack-teamlab", "text": "teamLab 用：能卷起裤腿的裤子、孩子整套换洗和装湿衣服的袋子"}]}], "links": [{"label": "Planets 官方：幼儿、推车与换洗", "url": "https://support.dmm.com/teamlabplanets/article/47944"}, {"label": "Planets 官方：水温按季节调节", "url": "https://support.dmm.com/teamlabplanets/article/47835"}, {"label": "未来馆官方：2027/4/23 重新开放", "url": "https://www.miraikan.jst.go.jp/news/press/202608264718.html"}, {"label": "内阁府：2027 年日本假日", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, {"label": "气象厅：东京平年值", "url": "https://www.data.jma.go.jp/stats/etrn/view/nml_sfc_ym.php?prec_no=44&block_no=47662"}, {"label": "气象厅：大阪平年值", "url": "https://www.data.jma.go.jp/stats/etrn/view/nml_sfc_ym.php?prec_no=62&block_no=47772"}, {"label": "Planets 官方 Help：儿童票与陪同规则", "url": "https://teamlabplanets.dmm.com/en/help"}]}, {"id": "D", "title": "购物退税与返程｜最后两天有章法", "lead": "2027 年适用新退税制度；具体柜台、操作与退款方式在离境前复核。", "parts": [{"h": "新退税：先付含税价，再确认带出日本", "p": ["自 2026/11/1 起，符合资格的免税购物改为先支付含税价；购买后 90 天内离境，经海关确认商品带出日本，再由商家办理税款退款。", "购物时问清记录、退款方式与手续，保留凭证；不要假设全部都在机场即时现金退回。退款可由商家或受托机构办理，具体方式以店方说明为准。"]}, {"h": "3/25‑26：购买收尾与打包", "p": ["主要购物在大阪完成；按航司额度量尺寸、称重。把需退税确认的商品整理到方便查找的位置，留好商品与购物记录的对应关系。", "3/26 先回羽田区域，确认第二天的航站楼、酒店交通、早餐和退房时间；酒店须按两成人、两孩子的实际年龄确认合法入住。"]}, {"h": "3/27：先查验顺序，再交出箱子", "p": ["前一天查询羽田当天适用的海关确认流程；到机场先确认查验与托运行李的先后，商品保持可出示。为退税、值机、托运及孩子临时状况另留时间。", "核对四人证件、登机牌和行李件数；机场购物只补小件。HND → ORD 后留休息时间，返美当天不追加任务。"]}, {"h": "预算与尚待确认的项目", "p": ["本手册不填未经核实的报价。后续汇总实际机票自付额、酒店儿童加价、城际交通、门票与餐饮，再检查家庭自付 $3,500‑4,000 的目标。"]}], "links": [{"label": "日本国税厅：新退税制度说明（英文 PDF）", "url": "https://www.nta.go.jp/publication/pamph/shohi/menzei/202506/pdf/0025006-106.pdf"}, {"label": "日本国税厅：制度更新与后续说明", "url": "https://www.nta.go.jp/publication/pamph/shohi/menzei/201805/format/002.htm"}]}, {"id": "E", "title": "日本 eVISA｜材料与办理清单", "lead": "本次夫妻办理单次旅游 eVISA，孩子免签。3/13 从 ORD 出发，3/14 入境日本；建议 2027 年 1 月上旬提交。核对于 2026/9/30。", "parts": [{"h": "材料：两人的证件与旅行文件", "p": ["准备清晰电子文件，全部住宿都要有预订单。银行账单用最近一期；常规旅游清单未列在职证明、W-2 或多次申请理由，领馆仍可要求补件。"], "checklist": [{"id": "evisa-passport-self", "text": "本人的护照资料页：彩色，完整显示底部两行机器识别码。"}, {"id": "evisa-passport-spouse", "text": "配偶的护照资料页：同样准备清晰彩色扫描件。"}, {"id": "evisa-photo-self", "text": "本人的电子证件照：近六个月、浅色纯背景、正面、不戴眼镜。"}, {"id": "evisa-photo-spouse", "text": "配偶的电子证件照：同样按近六个月要求准备。"}, {"id": "evisa-green-cards", "text": "两人的在美居留身份证明正反面扫描件（如适用）；原件留在自己手中。"}, {"id": "evisa-addresses", "text": "两人的现住址证明：所在州驾照、州 ID 或近期水电账单。"}, {"id": "evisa-bank", "text": "最近一期完整美国银行账单：显示申请人姓名和住宅地址。"}, {"id": "evisa-flights", "text": "进出日本的航班预订单：航司或旅行社出具，显示两人姓名。"}, {"id": "evisa-hotels", "text": "全部酒店预订单：覆盖每晚。若订单只写主申请人的名字，配偶的申请同时附主申请人的航班行程单。"}, {"id": "evisa-itinerary", "text": "英文每日行程：写日期、活动、住宿和联系方式，列出同行四人姓名。"}, {"id": "evisa-application", "text": "两人的申请信息核对一致；芝加哥清单仍列亲签申请表，备好签名扫描件，按系统上传提示提交。"}]}, {"h": "家庭申请：关系证明按方式准备", "p": ["一个账号可申请夫妻两人；家庭申请会复制部分旅行信息、统一接收通知并合并缴费。孩子免签，不加入签证申请。", "替配偶申请或使用主申请人的资金证明时，需准备婚姻关系证明；代成年人申请还需授权书。非英文证明的翻译与认证形式先向芝加哥领馆确认，不把婚姻证明当作一定能省掉的材料。"], "checklist": [{"id": "evisa-marriage", "text": "婚姻关系证明及所需翻译形式已确认；如分别申请、各自提供资金证明，按各自清单办理。"}, {"id": "evisa-authorization", "text": "如代配偶申请，准备其签名的授权书。"}]}, {"h": "办理：在线提交、缴费、收签", "p": ["在下方官方入口选择 国籍 → 居住国 → 居住州 → Tourism，核对系统材料清单及芝加哥要求。"], "checklist": [{"id": "evisa-account", "text": "注册 JAPAN eVISA 邮箱账号，准备两人的文件后开始填写。"}, {"id": "evisa-entries", "text": "填写并上传：家庭申请用 Save and add family members 添加配偶，最后用 Save and finish your entries 完成登记。"}, {"id": "evisa-submit", "text": "在 Visa application list 核对后点击 Submit；保存登记不等于已提交。"}, {"id": "evisa-review", "text": "关注邮箱和账号状态；如有补件要求，按通知上传。"}, {"id": "evisa-payment", "text": "收到缴费通知后在线刷信用卡付款。当前费用夫妻共 $202（每人 $101，适用至 2027/3/31）；以缴费通知为准。"}, {"id": "evisa-issued", "text": "确认状态为 Issued，核对姓名、护照号、有效期及获准停留期限。"}, {"id": "evisa-airport", "text": "出发前测试手机联网打开动态 Visa issuance notice；机场不能只出示截图或打印件。"}]}, {"h": "申请时间：给审核留余量", "p": ["2026 年 12 月中旬：进入提前三个月申请的窗口。2027 年 1 月上旬：本次建议提交时间。", "材料齐全后通常需约 5–7 个工作日；补件、旺季或进一步审核可能延长，无加急。以后每次行程确定后，建议提前 4–8 周办理。", "申请期间须留在美国。签发后入境有效期为三个月，限一次入境；停留天数以获批结果为准。", "下次主要更新银行账单、航班、酒店、每日行程及照片；有效且信息未变的证件扫描件可复用。"]}], "links": [{"label": "JAPAN eVISA 官方申请", "url": "https://www.evisa.mofa.go.jp/index"}, {"label": "官方 FAQ：家庭申请、时间与上传", "url": "https://www.evisa.mofa.go.jp/faq"}, {"label": "芝加哥：旅游材料清单 PDF", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/v10_s.pdf"}, {"label": "签证申请表", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/app_type.pdf"}, {"label": "英文每日行程表", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/stayEN.pdf"}, {"label": "代办授权书", "url": "https://www.chicago.us.emb-japan.go.jp/Consular/visa/downloadable/authorization.pdf"}, {"label": "芝加哥领馆：费用与咨询", "url": "https://www.chicago.us.emb-japan.go.jp/itpr_en/visa.html"}]}, {"id": "F", "title": "插件日｜teamLab 的替换方案", "lead": "默认仍是 3/16 teamLab。孩子没兴趣、下雨或时差太重时，从这里挑一个整天替换。每个都按“上午玩、午后可以回酒店补觉”排：这两天时差还没倒过来，下午多半会犯困。", "parts": [{"h": "怎么选、放哪天", "p": ["问孩子时不用提日本，拿几张照片问：光的房间（teamLab）、很高的塔和企鹅（押上）、火车博物馆、面包超人的家（横滨）、木头玩具（四谷），看他们眼睛往哪边亮。", "鉄道博物館和カップヌードルミュージアム每周二休，只能放 3/15 周一；这时上野日挪到 3/16 周二，科学博物馆、动物园、东京国立博物馆都开门。押上、四谷、花やしき周一周二都行。", "多数备选可以临时决定：押上当天早上看天气再买展望台票；鉄道博物館普通入馆不用预约；四谷玩具馆用信用卡或 d払い 买票，可在来馆当天日本时间 9:59 前取消（7-Eleven 店头付款不能取消）。横滨例外：面包超人二、三楼要买指定入场时间的网票，杯面 DIY 要预购带体验券的入馆票，或当天有余量才能领号；不提前买，只能保证一楼的店和普通展览。选定后再改行程页、待办和“吃买玩”。"]}, {"h": "插件 1｜押上：晴空塔＋すみだ水族館（离酒店最近）", "p": ["9:30 出门：新御徒町坐大江户线一站到蔵前，出站走几分钟换浅草线坐到押上，单程约二十分钟；或者筑波快线一站到浅草，过隅田川走到押上（约二十分钟）。", "10:00 晴空塔展望台：天晴才上，当天早上在官网买票，窗口当场买每张多收 ¥500。5 岁及以下免费，两个孩子都不用票，推车可以上；大人票 2026/4 起按日期浮动，¥1,800 起。生日当月去，凭证件在 4F 柜台领生日贴纸和遮阳帽。", "11:00 すみだ水族館：同一个综合体里，企鹅和水母为主，一个小时上下。平日 10:00–20:00，无固定休馆日；大人 ¥2,700，3 岁以上幼儿 ¥900，3 岁以下免费。和大阪海游馆隔八天，规模小得多。", "12:00 ソラマチ吃午饭（3F 美食区最省事），饭后想看就逛 East Yard 4F 的宝可梦中心，13:30 前后回酒店补觉。下雨就跳过展望台，水族馆＋ソラマチ照样成立。", "主线里晴空塔只看外观、不列すみだ水族館和晴空塔宝可梦，是为了浅草日不叠加；只有选这个插件替换 teamLab 时，它们才作为一整天出现。"]}, {"h": "插件 2｜鉄道博物館（火车迷；只能 3/15 周一）", "p": ["8:45 出门：从御徒町坐京滨东北线直达大宫（约四十分钟，不用换），或到上野换上野东京线快一些；大宫再坐新交通 New Shuttle 一站到“鉄道博物館”站。", "10:00 开馆就进：营业 10:00–17:00，每周二休。3 岁以上学龄前当天票 ¥300、网上预购 ¥200，不用预约。真车大厅之外，先去儿童区“キッズプラザ”，学龄前孩子在这里就能玩很久；户外还有小新干线可以坐（¥200）。", "迷你列车要上小学才能驾驶，学龄前可以坐在大人开的车上。E5、车掌模拟器和驾驶体验教室都要小学生以上，D51 要中学生以上，这次两个孩子都玩不了。部分体验要用「てっぱく抽選アプリ」抽选预约，普通入馆不用。", "午饭：站台便当 11 点前就可能卖完，先买好；在“455 ランチトレイン”老车厢里吃，免费座位，中午前后就满。12:30 前后往回走，14:00 前后到酒店，犯困就补觉。"]}, {"h": "插件 3｜横滨：面包超人＋杯面（最远；只能 3/15 周一）", "p": ["8:45 出门：上野坐上野东京线到横滨，约三十多分钟，再换港未来线。单程约一小时，是这几个里最远的，回程让孩子在车上睡。", "10:00 カップヌードルミュージアム（港未来站步行约 8 分钟）：每周二休。大人 ¥500，高中生以下免费；自己画杯子做一杯泡面每杯 ¥500，约 45 分钟：想保证能做，提前网购带体验券的入馆票（可买到前一天）；不然进馆后有余量才按先到先得领号。", "12:00 前后移到アンパンマンこどもミュージアム（新高島站 3 号出口步行 3 分钟）：一楼的店和餐厅免费进，在这里吃午饭。二、三楼要买指定日期和入场时间的网票（来馆前 28 天开售，有余票当天也能买），1 岁以上 ¥2,200–2,800，两个孩子都要买；当天 8:59 前取消免费，9:00 起收 20%，最后入场 16:00。2027 年春要改装三楼，官方说施工期间照常营业。", "14:00 前后往回走。这一天到酒店会比其他插件晚，3/15 晚上的纪念日晚饭要选这个的话，晚饭时间往后推一点。"]}, {"h": "插件 4｜東京おもちゃ美術館（下雨、纯放电；可当天取消）", "p": ["9:30 出门：坐地铁到丸之内线四谷三丁目站，出站步行约 7 分钟，单程约半小时。", "10:00–12:00：旧小学校舍改成的玩具馆，以木头玩具为主，0 岁就能玩，有电梯和无障碍设施。营业 10:00–16:00，每周四休；大人 ¥1,100，儿童票价看官网。", "按时段在网上买票。用信用卡或 d払い 付款的票，可在来馆当天日本时间 9:59 前取消，而且整单一起取消；选 7-Eleven 店头付款就不能取消。早上孩子状态不好，按时取消即可。", "午饭在四谷三丁目附近吃，13:30 前后回酒店补觉。"]}, {"h": "插件 5｜留白日＋浅草花やしき半天", "p": ["什么都不排也是一个选项：上午在酒店附近走走，下午看状态。到日本后的头几天，这种余地对两个学龄前孩子本身就很有价值。", "想有点节目，就上午去浅草花やしき：筑波快线一站到浅草，出站步行约 5 分钟。号称日本最老的游乐园，0–4 岁免费入园，5 岁起买票；乘坐设施另买券（每张 ¥100）。有适合幼儿的设施，但收费、身高和陪同限制逐项不同，比如忍者乐园从 3 岁起收费。营业 10:00–18:00，不用预约，休园日看官网。", "花やしき也可以不占一天，塞进 3/18 浅草日的下午。"]}], "links": [{"label": "すみだ水族館：票价", "url": "https://www.sumida-aquarium.com/about/price/"}, {"label": "东京晴空塔：生日服务（2025/3 改版）", "url": "https://prtimes.jp/main/html/rd/p/000000354.000041446.html"}, {"label": "東京スカイツリー：票价", "url": "https://www.tokyo-skytree.jp/ticket/"}, {"label": "鉄道博物館：利用案内", "url": "https://www.railway-museum.jp/information/"}, {"label": "カップヌードルミュージアム 横浜", "url": "https://www.cupnoodles-museum.jp/ja/yokohama/"}, {"label": "横浜アンパンマンこどもミュージアム：门票与时间", "url": "https://www.yokohama-anpanman.jp/guide/"}, {"label": "東京おもちゃ美術館：常见问题", "url": "https://art-play.or.jp/ttm/faq/"}, {"label": "鉄道博物館：体验的年龄与预约（FAQ）", "url": "https://www.railway-museum.jp/contact/"}, {"label": "カップヌードルミュージアム：マイカップヌードルファクトリー", "url": "https://www.cupnoodles-museum.jp/ja/yokohama/attractions/mc-factory/"}, {"label": "横浜アンパンマン：票务与取消规则", "url": "https://www.yokohama-anpanman.jp/news/article/l1moa4r0yp0e3dns.html"}, {"label": "浅草花やしき：费用", "url": "https://www.hanayashiki.net/fee/"}]}], "todo": [{"id": "haneda-hotel", "text": "羽田酒店（首选 T3 直连，订可免费取消）"}, {"id": "ginyu-kids-details", "text": "吟游儿童餐、寝具及连住细节（先核对申请里的孩子年龄：出行时哥哥 5 岁、妹妹 3 岁）"}, {"id": "imahan-0315", "text": "3/15 今半上野広小路晚饭订早场：至少提前 3 天订记念日甜点和儿童便当"}, {"id": "osaka-luggage-receive", "text": "大阪行李代收：官网确认可提前收件，运单写订房人姓名"}, {"id": "nintendo-museum-lottery", "text": "Nintendo Museum 抽签（2026 年 12 月）"}, {"id": "teamlab-slot", "text": "teamLab Planets 时段（先问孩子有没有兴趣；不去就从附录 F 挑插件日。妹妹出行时满 3 岁，不再免票）"}, {"id": "kaiyukan-slot", "text": "海游馆时段"}, {"id": "shinkansen-seats", "text": "新干线车次与座位（大箱子都寄送；随身包与推车按规则核对）"}, {"id": "tax-refund", "text": "离境退税流程"}, {"id": "water-bus", "text": "丰洲→浅草水上巴士班次、票价与学龄前儿童票规则"}, {"id": "evisa", "text": "夫妻 eVISA（2027 年 1 月上旬，见附录 E）"}, {"id": "ginyu-reply", "text": "吟游订房答复（预计 10 月中旬；10/14 后无回音再询问）"}, {"id": "odawara-shinkansen", "text": "3/21 小田原→新大阪：芝加哥 2/20（周六）晚上 7:00 开售就订（日本时间 2/21 10:00）"}, {"id": "osaka-haneda-shipping", "text": "大阪→羽田寄箱（3/24 或 3/25 上午）"}, {"id": "tokyo-arrival-note", "text": "东京酒店：用官网联系表单改到达时间为 17:30–18:00（成田进）"}, {"id": "skyliner", "text": "Skyliner 成田→京成上野车票"}], "ref": [{"h": "怎么找", "p": "「程」按天看路线；「宿」是两家酒店步行圈里能吃能玩的地方，按远近分圈，可以只看小吃、放电或九点以后还开的；「吃」「买」「玩」先列出各站站牌，点进一站只看这一站。"}, {"h": "判断与事实分开", "p": "餐厅、景点、门店与公告以条目内链接为依据；“适合孩子”“停留多久”“今天怎样选”是针对你们家庭的编辑建议，不是场馆保证。未核实的儿童椅、包间和儿童菜单不写成已有。"}, {"h": "当前开放不等于 2027 保证", "p": "查阅日为 2026/9/29。出发前重开关键场馆、门店、票务与日历。海游馆贪吃横丁 2027 年 3 月拟重开；未来馆 4/23 才重开；今昔馆计划休馆至 1/5；科学馆部分展区改装需再查。"}, {"h": "容易混淆的店与楼", "p": "大阪 Nintendo 在 LUCUA SOUTH 13F，@cosme 在 LUCUA IRE 3F；梅田 ロフト 在阪神 6F。まんだらけ グランドカオス 现址日本桥，駿河屋秋叶原游戏馆 2026/9/25 迁址。一兰道顿堀选别馆。"}, {"h": "地图与引用", "p": "每条的官方入口可打开出处；“地图”按店名搜索，并非已替你验证实时步行导航。"}], "base": [{"code": "T", "city": "tokyo", "sign": "新御徒町", "kana": "しんおかちまち", "ro": "Shin-Okachimachi", "stay": "MONday Apart 上野新御徒町", "dates": "3/14–3/19", "nights": 5, "days": [2, 3, 4, 5, 6], "lead": "酒店在新御徒町站旁的老街区：往西是御徒町和上野的热闹，往东是鸟越、藏前的下町。门口的筑波快线一站到秋叶原，反方向一站到浅草。", "hint": "步行时间为成年人单程粗估。营业时间核对于 2026/10，出发前再看官网。", "tip": "上午孩子精神好，去上野或アメ横；下午补觉醒来（或者根本没睡）就到竹町公园跑一跑、晒晒太阳，帮着倒时差；晚饭在吉池食堂或买回房吃。爸爸的夜晚最适合 3/16、3/17，3/18 要收行李，寿湯也休息。", "rings": [["出门 5 分钟", "0–5 MIN", "早餐补给、孩子放电，下楼就到。"], ["步行 15 分钟内", "≤15 MIN", "御徒町、上野、鸟越、藏前，散步就能到。"], ["再远一点", "1 STOP", "筑波快线一站到浅草和秋叶原，或沿隅田川走一段。"]], "entries": [{"name": "竹町公園", "k": ["kids"], "ring": 0, "walk": "约 4 分", "hours": "全天开放", "body": "1928 年开园的街区公园，入口站着一只猫头鹰雕塑。有好几段滑梯的组合游具、秋千、沙坑和弹簧摇摇，大小两个孩子都能玩。早饭后或傍晚来跑 20 分钟。", "note": "有厕所和换尿布台。放学后小学生多，妹妹玩小的那几样就好。", "links": [{"label": "公园介绍（いこーよ）", "url": "https://iko-yo.net/facilities/11848"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%AB%B9%E7%94%BA%E5%85%AC%E5%9C%92+%E5%8F%B0%E6%9D%B14-21-3", "id": "T01"}, {"name": "佐竹商店街", "k": ["see", "snack", "night"], "ring": 0, "walk": "约 5 分", "hours": "小店各自营业，多为白天，周日休的不少", "body": "自称日本第二古老的商店街，1936 年就有了顶棚街的样子。人形烧、外带寿司、可乐饼、老食堂和风铃店挤在一条街上。白天全家买点零食，晚上你一个人来拍关门后的老街。", "note": "每家营业时间不同，别专门为某一家跑一趟，路过开着就进。", "links": [{"label": "佐竹商店街", "url": "https://satakeshotengai.com/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%BD%90%E7%AB%B9%E5%95%86%E5%BA%97%E8%A1%97", "id": "T02"}, {"name": "ライフ 新御徒町店", "k": ["shop", "night"], "ring": 0, "walk": "约 3–5 分", "hours": "9:30–24:00", "body": "牛奶、水果、面包、熟食一次买齐。房间有厨房，买点早餐和简单晚饭回去，比每天出门找早餐省事。", "note": "地址小岛 2‑8‑7。晚上熟食可能卖完，饮料零食稳定。", "links": [{"label": "ライフ新御徒町店", "url": "https://store.lifecorp.jp/detail/east617/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%A9%E3%82%A4%E3%83%95+%E6%96%B0%E5%BE%A1%E5%BE%92%E7%94%BA%E5%BA%97", "id": "T03"}, {"name": "便利店：セブン‐イレブン 東上野1丁目店 等", "k": ["eat", "night"], "ring": 0, "walk": "约 3–5 分", "hours": "多为 24 小时", "body": "日本版的随手吃：饭团、7-11 的蛋沙拉三明治、FamilyMart 的炸鸡ファミチキ、Lawson 的からあげクン。早餐、加餐、孩子半夜要喝的牛奶都靠它兜底。新御徒町站旁还有一家 FamilyMart。", "note": "7-11 店里的 ATM 可以用外国卡取日元。街上垃圾桶少，便利店门口的垃圾桶按分类扔。", "links": [], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%BB%E3%83%96%E3%83%B3%E3%82%A4%E3%83%AC%E3%83%96%E3%83%B3+%E6%9D%B1%E4%B8%8A%E9%87%8E1%E4%B8%81%E7%9B%AE%E5%BA%97", "id": "T31"}, {"name": "下谷神社", "k": ["see"], "ring": 1, "walk": "约 8 分", "hours": "境内随时可进", "body": "730 年创建，东京最古老的稻荷神社之一，地铁“稻荷町”站就是因它得名。拜殿天井有横山大观画的龙；江户第一家说书场“寄席”也诞生在这里，立着纪念碑。", "note": "小神社，10 分钟就够。天井画能不能看到看当天。", "links": [{"label": "东京都神社厅：下谷神社", "url": "http://www.tokyo-jinjacho.or.jp/taito/3047"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%8B%E8%B0%B7%E7%A5%9E%E7%A4%BE+%E6%9D%B1%E4%B8%8A%E9%87%8E3-29-8", "id": "T04"}, {"name": "多慶屋", "k": ["shop"], "ring": 1, "walk": "约 8 分", "hours": "10:00–20:00", "body": "紫色大楼的老牌折扣店，食品、日用品、家电、玩具分好几栋。比药妆店和唐吉诃德更像本地家庭采购，零食和日用品价格也看得过来。", "note": "楼栋多，先看门口楼层图再进。", "links": [{"label": "店铺信息（じゃらん）", "url": "https://www.jalan.net/kankou/spt_guide000000151708/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%9A%E6%85%B6%E5%B1%8B+%E5%BE%A1%E5%BE%92%E7%94%BA%E6%9C%AC%E5%BA%97", "id": "T05"}, {"name": "鳥越神社＋おかず横丁", "k": ["see", "snack"], "ring": 1, "walk": "约 10 分", "hours": "神社随时；横丁多为白天，周日休的多", "body": "传说 651 年创建的老神社，6 月的鸟越祭抬的是东京最重的神轿之一。往南的おかず横丁是战后留下的熟食小街，煮物、腌菜、鱼店，看看东京人家的日常餐桌。", "note": "横丁资料较旧，店家去留以现场为准；适合上午散步。", "links": [{"label": "鸟越神社（维基）", "url": "https://ja.wikipedia.org/wiki/%E9%B3%A5%E8%B6%8A%E7%A5%9E%E7%A4%BE"}, {"label": "おかず横丁散步", "url": "https://asakusakanko.com/okazu-satake/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%B3%A5%E8%B6%8A%E7%A5%9E%E7%A4%BE", "id": "T06"}, {"name": "高級喫茶 古城", "k": ["snack", "eat"], "ring": 1, "walk": "约 10 分", "hours": "9:30–20:00 · 周日、节假日休", "body": "1963 年开业的地下纯喫茶，水晶吊灯和彩色玻璃像一座城堡。早上吃份早餐，下午来杯奶油苏打或芭菲，午饭的拿坡里意面也有名。", "note": "**3/14 周日休息。**", "links": [{"label": "古城介绍", "url": "https://jyohoku.follow-up.co.jp/gourmet/cafe/taito-kojyo-w530-20240520/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%8F%A4%E5%9F%8E+%E6%9D%B1%E4%B8%8A%E9%87%8E3-39-10", "id": "T07"}, {"name": "2k540 AKI‑OKA ARTISAN", "k": ["shop", "see"], "ring": 1, "walk": "约 10 分", "hours": "11:00–19:00 · 周三休", "body": "御徒町和秋叶原之间的高架下，约 50 家工艺小店：皮件、木器、饰品、布。有的店可以当场做个小东西。", "note": "**3/17 周三休息。**", "links": [{"label": "台东区观光：2k540", "url": "https://t-navi.city.taito.lg.jp/spot/1038"}], "map": "https://www.google.com/maps/search/?api=1&query=2k540+AKI-OKA+ARTISAN", "id": "T08"}, {"name": "吉池 本店＋9F 吉池食堂", "k": ["eat", "shop"], "ring": 1, "walk": "约 10 分", "hours": "食堂 11:00–22:00", "body": "御徒町站旁的老牌鱼货超市，楼下买刺身和熟食回房吃。9F 的吉池食堂把定食、荞麦面、寿司和居酒屋菜放在一个大食堂里，四个人各点各的，窗外能看到晴空塔。", "note": "", "links": [{"label": "吉池食堂", "url": "https://www.yoshiike-group.co.jp/restaurant.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%90%89%E6%B1%A0+%E5%BE%A1%E5%BE%92%E7%94%BA", "id": "T09"}, {"name": "人形町今半 上野広小路店", "k": ["eat"], "ring": 1, "walk": "约 12 分", "hours": "建议预约", "body": "想认真吃一顿和牛寿喜烧，酒店附近就有。在松坂屋对面的楼里，和逛上野、御徒町接得上。", "note": "订位时报两大两小和孩子年龄。3/15 的纪念日晚饭订在这里：记念日甜点（带巧克力写字牌）¥1,980 或只要写字牌 ¥880，特制儿童便当 ¥4,070，都要提前 3 天订；有儿童椅和儿童餐具。另收 12% 服务费，包间另收费。核对于 2026/10/4。", "links": [{"label": "今半上野广小路店", "url": "https://restaurant.imahan.com/ueno/"}, {"label": "今半上野广小路：记念日与儿童服务", "url": "https://restaurant.imahan.com/post_special/ningyochomahan-ueno-grys2025/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%BA%BA%E5%BD%A2%E7%94%BA%E4%BB%8A%E5%8D%8A+%E4%B8%8A%E9%87%8E%E5%BA%83%E5%B0%8F%E8%B7%AF%E5%BA%97", "id": "T10"}, {"name": "アメ横", "k": ["see", "shop", "snack", "night"], "ring": 1, "walk": "约 10–15 分", "hours": "零售多到 20:00 前后；高架下酒馆更晚", "body": "从御徒町到上野的高架下市场街。白天看鱼干、零食、水果串和一路吆喝，晚上变成灯笼和小酒馆的街。", "note": "人多路窄，推车走两侧。上野广小路西边的仲町通揽客多，不往里拐。", "links": [{"label": "アメ横商店街", "url": "https://www.ameyoko.net/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%A2%E3%83%A1%E6%A8%AA%E5%95%86%E5%BA%97%E8%A1%97", "id": "T11"}, {"name": "らーめん 鴨to葱", "k": ["eat"], "ring": 1, "walk": "约 12 分", "hours": "10:00–22:30", "body": "高架下的鸭汤拉面，鸭油香、两种葱自选。只有 11 个吧台座，最适合你一个人来，或者全家分两批。", "note": "常排队，吧台座带小孩不方便。", "links": [{"label": "店铺介绍（散歩の達人）", "url": "https://san-tatsu.jp/articles/243986/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%89%E3%83%BC%E3%82%81%E3%82%93+%E9%B4%A8to%E8%91%B1+%E4%B8%8A%E9%87%8E%E5%BE%A1%E5%BE%92%E7%94%BA%E6%9C%AC%E5%BA%97", "id": "T12"}, {"name": "名代 宇奈とと 上野店", "k": ["eat"], "ring": 1, "walk": "约 12 分", "hours": "不接受座位预约", "body": "想尝一碗鳗鱼饭又不想吃整套高价鳗鱼，这家最轻松。逛アメ横时顺路看排队。", "note": "甜咸酱汁配饭比较好入口；怕刺的话自己判断。", "links": [{"label": "宇奈とと上野店", "url": "https://www.unatoto.com/shop/ueno/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%90%8D%E4%BB%A3+%E5%AE%87%E5%A5%88%E3%81%A8%E3%81%A8+%E4%B8%8A%E9%87%8E%E5%BA%97", "id": "T13"}, {"name": "もつ焼 大統領", "k": ["eat", "night"], "ring": 1, "walk": "约 12 分", "hours": "10:00–24:00 · 全年无休", "body": "アメ横高架下的老牌大众酒场，1925 年创业，招牌是一直没变过味道的马内脏炖煮和串烧。和你们在旅馆要玩的「大統領」花札同名，拍张招牌回去讲给哥哥听。", "note": "本店门口常排队，附近有支店。座位窄、气氛热闹，一个人坐一会儿正好。", "links": [{"label": "アメ横官网：大統領", "url": "https://www.ameyoko.net/shop/280"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%82%E3%81%A4%E7%84%BC+%E5%A4%A7%E7%B5%B1%E9%A0%98+%E6%9C%AC%E5%BA%97+%E4%B8%8A%E9%87%8E6-10-14", "id": "T14"}, {"name": "御徒町高架下：章鱼烧与串烧", "k": ["snack", "night"], "ring": 1, "walk": "约 10–15 分", "hours": "章鱼烧到 22:00；山贼海贼到午夜", "body": "零售店收摊后，高架下的小吃还开着。散步途中买一份章鱼烧，或者坐下吃两串。", "note": "刚出炉的章鱼烧很烫，稍凉再给孩子。", "links": [{"label": "アメ横章鱼烧店", "url": "https://ameyoko-center.jp/shop/contents.html?id=38&l=1"}, {"label": "アメ横山贼海贼", "url": "https://ameyoko-center.jp/shop/contents.html?id=49&l=1"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%B1%B1%E8%B3%8A%E6%B5%B7%E8%B3%8A+%E3%82%A2%E3%83%A1%E6%A8%AA", "id": "T15"}, {"name": "二木の菓子", "k": ["snack", "shop"], "ring": 1, "walk": "约 12 分", "hours": "10:00–20:00", "body": "アメ横的零食批发老店，日本各地的糖果饼干堆满一大片。买孩子路上吃的、带回家分的，这里最省事。", "note": "", "links": [{"label": "二木の菓子", "url": "http://www.nikinokashi.co.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%BA%8C%E6%9C%A8%E3%81%AE%E8%8F%93%E5%AD%90+%E3%83%93%E3%83%83%E3%82%AF%E9%A4%A8", "id": "T16"}, {"name": "志村商店：巧克力叫卖", "k": ["snack", "kids"], "ring": 1, "walk": "约 13 分", "hours": "10:00–17:30 · 全年无休", "body": "店员一边吆喝“入れちゃえ入れちゃえ”，一边往袋子里狂塞巧克力和点心，一袋 ¥1,000。买不买都值得站着看一场，孩子会笑。", "note": "2026 年一袋约 11 件，比以前少了，图的是热闹。", "links": [{"label": "アメ横官网：志村商店", "url": "https://www.ameyoko.net/shop/300"}, {"label": "2026 年实测", "url": "https://rocketnews24.com/2026/07/01/2777454/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%BF%97%E6%9D%91%E5%95%86%E5%BA%97+%E3%82%A2%E3%83%A1%E6%A8%AA", "id": "T17"}, {"name": "うさぎや", "k": ["snack"], "ring": 1, "walk": "约 13 分", "hours": "9:00–18:00 · 周三休 · 只收现金", "body": "1913 年创业，东京三大铜锣烧之一。当天做的最好吃，保质期只到第二天，买回房当下午点心。", "note": "**3/17 周三休息。**傍晚常卖完，上午去稳。", "links": [{"label": "店铺信息", "url": "https://salaryman-lunch.com/archives/39667978.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%86%E3%81%95%E3%81%8E%E3%82%84+%E4%B8%8A%E9%87%8E1-10-10", "id": "T18"}, {"name": "あんみつ みはし 上野本店", "k": ["snack"], "ring": 1, "walk": "约 13 分", "hours": "10:30–21:00（最后点单 20:30）", "body": "上野的老牌甜品店，蜜豆、红豆汤、冰淇淋都有。两层 70 个座位，也能外带回房。", "note": "不定休。", "links": [{"label": "みはし", "url": "https://www.mihashi.co.jp/about/shop.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%82%E3%82%93%E3%81%BF%E3%81%A4+%E3%81%BF%E3%81%AF%E3%81%97+%E4%B8%8A%E9%87%8E%E6%9C%AC%E5%BA%97", "id": "T19"}, {"name": "ヤマシロヤ", "k": ["shop", "kids"], "ring": 1, "walk": "约 15 分", "hours": "10:00–21:30", "body": "上野站广小路口对面，一整栋楼都是玩具：角色周边、卡牌、拼图、儿童玩具和熊猫。下雨天也能逛很久，可以免税。", "note": "", "links": [{"label": "ヤマシロヤ", "url": "https://e-yamashiroya.com/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%A4%E3%83%9E%E3%82%B7%E3%83%AD%E3%83%A4+%E4%B8%8A%E9%87%8E6-14-6", "id": "T20"}, {"name": "東上野 寿湯（銭湯）", "k": ["see", "night"], "ring": 1, "walk": "约 15 分", "hours": "营业到深夜 · 每月第三个周四休", "body": "走了一天，晚上去泡一次东京的街区钱汤。男汤有都内数一数二大的露天风吕，还有两种桑拿和两个冷水池，洗发水沐浴露免费用。", "note": "**2027/3/18 正好是第三个周四，休息。**最后入场时间各处写法不一（23 点多到凌晨 1 点多），出门前查。毛巾自带或现场买；桑拿另收费；可刷交通卡。", "links": [{"label": "东京钱汤：寿湯", "url": "https://www.1010.or.jp/mag-tokyosento-kotobukiyu/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%9D%B1%E4%B8%8A%E9%87%8E+%E5%AF%BF%E6%B9%AF+%E6%9D%B1%E4%B8%8A%E9%87%8E5-4-17", "id": "T21"}, {"name": "パンのペリカン", "k": ["snack"], "ring": 1, "walk": "约 12–15 分", "hours": "8:00–17:00 · 周日、节假日休", "body": "1942 年创业，只卖吐司和小餐包两样，常常中午前卖完，可以先打电话预订。买一条回去，房间里烤着当早餐。", "note": "**3/14 周日休息。**附近还有用它家面包的ペリカンカフェ。", "links": [{"label": "店铺介绍（メシ通）", "url": "https://www.hotpepper.jp/mesitsu/entry/editorial/17-00315"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%91%E3%83%B3%E3%81%AE%E3%83%9A%E3%83%AA%E3%82%AB%E3%83%B3+%E5%AF%BF4-7-4", "id": "T22"}, {"name": "ダンデライオン・チョコレート 蔵前", "k": ["snack"], "ring": 1, "walk": "约 15 分", "hours": "10:00–19:00", "body": "旧金山来的精品巧克力工坊。一楼隔着玻璃看做巧克力，二楼喝热巧克力、吃布朗尼。也可以坐大江户线一站到蔵前。", "note": "", "links": [{"label": "ファクトリー&カフェ蔵前", "url": "https://dandelionchocolate.jp/pages/factory-cafe-kuramae"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%83%80%E3%83%B3%E3%83%87%E3%83%A9%E3%82%A4%E3%82%AA%E3%83%B3%E3%83%BB%E3%83%81%E3%83%A7%E3%82%B3%E3%83%AC%E3%83%BC%E3%83%88+%E3%83%95%E3%82%A1%E3%82%AF%E3%83%88%E3%83%AA%E3%83%BC%26%E3%82%AB%E3%83%95%E3%82%A7%E8%94%B5%E5%89%8D", "id": "T23"}, {"name": "一蘭 アトレ上野山下口店", "k": ["eat", "night"], "ring": 1, "walk": "约 15–20 分", "hours": "24 小时", "body": "想吃一碗明确的深夜拉面，上野站这家可以做备选，不用为了夜宵跑新宿或涩谷。", "note": "不要误搜成其他上野分店。", "links": [{"label": "一兰上野店", "url": "https://ichiran.com/shop/tokyo/ueno/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%80%E8%98%AD+%E3%82%A2%E3%83%88%E3%83%AC%E4%B8%8A%E9%87%8E%E5%B1%B1%E4%B8%8B%E5%8F%A3%E5%BA%97", "id": "T24"}, {"name": "珈琲 王城", "k": ["snack", "eat"], "ring": 1, "walk": "约 15 分", "hours": "8:00–19:00；休息日以店家公告为准", "body": "1975 年开业的老喫茶，藏在上野丸井后面，离上野站约 2 分钟。至今用炭火烘豆，酸度低、口感厚重，是美国很难喝到的那种日式深烘。吊灯和欧式装潢都还是昭和的样子，复古芭菲也有名。", "note": "店里按东京条例全面禁烟，可以带孩子。8 点开门，头几天倒时差一早醒，3/15 去上野公园前先来这里。核对于 2026/10/3，出发前再看店家公告。", "links": [{"label": "珈琲王城官方 X", "url": "https://x.com/coffeeoujou"}, {"label": "上野咖啡店介绍（Coffee Labo）", "url": "https://coffee-labo.co.jp/recommended-coffee-shops-in-ueno/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%8F%88%E7%90%B2%E7%8E%8B%E5%9F%8E%20%E4%B8%8A%E9%87%8E", "id": "T29"}, {"name": "アールイーカメラ", "k": ["shop"], "ring": 1, "walk": "约 5–10 分", "hours": "11:00–19:00 · 周日、节假日休", "body": "新品和中古相机、镜头都有，可以免税。就在酒店和御徒町之间，3/15–3/18 都开门，散步时顺路进去看看。", "note": "3/14 到达那天是周日，不开。想多看几家，3/18 去「买 · 銀座」。核对于 2026/10/4，出发前再看官网。", "links": [{"label": "アールイーカメラ 店铺信息", "url": "https://re-camera-shop.com/about/index.jsp"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%A2%E3%83%BC%E3%83%AB%E3%82%A4%E3%83%BC%E3%82%AB%E3%83%A1%E3%83%A9+%E5%8F%B0%E6%9D%B14-31-2", "id": "T32"}, {"name": "隅田川テラス（蔵前橋一带）", "k": ["see", "kids"], "ring": 2, "walk": "约 20 分", "hours": "全天", "body": "沿河步道上能看到晴空塔和一座座桥，孩子可以放开跑。从ペリカン或ダンデライオン顺路走过去，往北一直走就是浅草。", "note": "台东区把这一段列为晴空塔观景点之一。", "links": [{"label": "台东区：晴空塔观景点", "url": "https://www.city.taito.lg.jp/bunka_kanko/kankoinfo/midokoro/sumidatanoshimi/skytree/index.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E8%94%B5%E5%89%8D%E6%A9%8B+%E9%9A%85%E7%94%B0%E5%B7%9D%E3%83%86%E3%83%A9%E3%82%B9", "id": "T25"}, {"name": "合羽橋道具街", "k": ["shop", "see"], "ring": 2, "walk": "约 20 分", "hours": "多数店傍晚就关，周日不少店休", "body": "餐具、厨具、灯笼招牌和仿真食物模型的专门街。孩子看到假的拉面、寿司会很兴奋，你们也可以挑一件家里真会用的碗或筷子。", "note": "资料没逐家核对，去之前看想去那家的营业日。", "links": [], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%8B%E3%81%A3%E3%81%B1%E6%A9%8B%E9%81%93%E5%85%B7%E8%A1%97", "id": "T26"}, {"name": "浅草寺の夜（筑波快线一站）", "k": ["see", "night"], "ring": 2, "walk": "约 10–15 分", "hours": "点灯：日落到 23:00", "body": "本堂、五重塔、宝藏门、雷门都亮着灯。本堂 17 点关门，但院内可以走，人比白天少得多，仲见世拉下的卷帘门上还有画。3/18 白天全家来过，夜里是完全不同的画面。", "note": "新御徒町坐筑波快线一站到浅草约 2 分钟，出站步行 5–10 分钟；也可以直接走 20–25 分钟。旁边ホッピー通り的居酒屋多数开到 23 点前后。回程打车约 10 分钟。", "links": [{"label": "浅草寺点灯", "url": "https://www.senso-ji.jp/info/lightup.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%B5%85%E8%8D%89%E5%AF%BA", "id": "T27"}, {"name": "秋葉原（筑波快线一站）", "k": ["shop", "night", "kids"], "ring": 2, "walk": "约 10 分", "hours": "营业：游戏中心多到 23:30，ヨドバシ到 22:00｜孩子：16 岁以下 18:00 后须家长陪同、最晚 22:00", "body": "电器街的招牌夜里最好拍。中央通上的 Hey（Taito）以复古射击和格斗机台出名，开到 23:30。ヨドバシAkiba 开到 22:00，8F 餐厅到 23:00。白天的中古游戏店和吃饭见「买 · 秋葉原」。", "note": "Super Potato 这类中古店晚上 8 点左右就关。GiGO 秋叶原 1 号馆已在 2025 年 8 月闭馆。 关门时间不等于孩子能待到关门：按 Taito 公布的东京规则，16 岁以下 18:00 后须家长陪同、陪同也只到 22:00，18 岁以下 22:00 后不能入场，个别门店更早。带哥哥妹妹去放在傍晚以前；九点以后是爸爸一个人的时间。核对于 2026/10/3，出发前再看门店告示。", "links": [{"label": "Hey 店铺信息", "url": "https://www.taito.co.jp/store/00001703"}, {"label": "ヨドバシAkiba 营业时间", "url": "https://www.yodobashi-akiba.com/information/index.html"}, {"label": "Taito：未成年入场时间规定", "url": "https://www.taito.co.jp/gc/special/new_regulation"}], "map": "https://www.google.com/maps/search/?api=1&query=Hey+%E7%A7%8B%E8%91%89%E5%8E%9F+%E5%A4%96%E7%A5%9E%E7%94%B01-10-5", "id": "T28"}, {"name": "カフェ・バッハ（南千住）", "k": ["snack"], "ring": 2, "walk": "地铁约 20 分", "hours": "10:30–18:30（L.O. 18:15）；周二、每月第 2 和第 4 个周三休", "body": "日本自家烘焙咖啡的源头之一，烘度从中到深都有，算朝圣性质的一家。从仲御徒町坐日比谷线到南千住，几站就到，出站再步行约 10 分钟。", "note": "东京这几天里，3/16 周二休息；3/15、3/17、3/18 都开（3/17 是第 3 个周三）。适合你一个人去，店里也能买豆子带回美国。核对于 2026/10/3，出发前再看店家公告。", "links": [{"label": "カフェ・バッハ官网", "url": "https://www.bach-kaffee.co.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%AB%E3%83%95%E3%82%A7%E3%83%BB%E3%83%90%E3%83%83%E3%83%8F%20%E5%8F%B0%E6%9D%B1%E5%8C%BA%E6%97%A5%E6%9C%AC%E5%A0%A41-23-9", "id": "T30"}]}, {"code": "O", "city": "osaka", "sign": "心斎橋", "kana": "しんさいばし", "ro": "Shinsaibashi", "stay": "MONday apart 心斋桥", "dates": "3/21–3/26", "nights": 5, "days": [9, 10, 11, 12, 13], "lead": "酒店在东心斋桥，离心斋桥站三四分钟。北边是长堀通和地下街，西边是大丸和商店街，往南走十分钟就到道顿堀。吃和逛几乎都在步行圈里。", "hint": "步行时间为成年人单程粗估。营业时间核对于 2026/10，出发前再看官网。", "tip": "附近缺的是公园：孩子要跑就去难波千日前公园或难波公园屋顶。房间有厨房和洗烘衣机，大丸 B2、AEON 买回来吃很省力。爸爸的夜晚 3/22–3/24 都行，3/25 要收拾去羽田。", "rings": [["出门 5 分钟", "0–5 MIN", "大丸、PARCO、商店街、地下街和 24 小时超市。"], ["步行 15 分钟内", "≤15 MIN", "道顿堀、法善寺、美国村、难波戎桥筋和黑门。"], ["再远一点", "1–3 STOPS", "难波公园、裏なんば，或坐御堂筋线去梅田看夜景。"]], "entries": [{"name": "大丸心斎橋店 本館", "k": ["shop", "kids", "eat"], "ring": 0, "walk": "约 5–7 分", "hours": "10:00–20:00；B2 美食区、10F 餐厅到 22:00", "body": "9F 是宝可梦中心 OSAKA DX 和宝可梦咖啡，离酒店最近的“孩子目的地”。B2 地下美食街有熟食和便当，买回房用厨房热一热，就是一顿晚饭。", "note": "宝可梦咖啡只能网上预约，不接电话订位；商店可以随时进。", "links": [{"label": "宝可梦中心 & 咖啡", "url": "https://www.daimaru.co.jp/shinsaibashi/shop/pokemon.html"}, {"label": "大丸营业时间", "url": "https://www.daimaru.co.jp/shinsaibashi/hours.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E4%B8%B8%E5%BF%83%E6%96%8E%E6%A9%8B%E5%BA%97+%E6%9C%AC%E9%A4%A8", "id": "O01"}, {"name": "心斎橋PARCO", "k": ["shop", "eat"], "ring": 0, "walk": "约 5 分", "hours": "10:00–21:00；餐饮各店不同", "body": "6F 是流行文化楼层，有卡普空、哥斯拉、吉卜力等角色店，还有和无脸男一起坐电车的拍照点。B2 的「心斎橋ネオン食堂街」满墙霓虹，二十几家小吃摊，像一条室内的昭和夜市。", "note": "食堂街偏大人酒馆气氛，带孩子早点去。楼层店铺以官网为准。", "links": [{"label": "心斎橋PARCO", "url": "https://shinsaibashi.parco.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%BF%83%E6%96%8E%E6%A9%8BPARCO", "id": "O02"}, {"name": "心斎橋筋商店街", "k": ["shop", "see"], "ring": 0, "walk": "约 3–5 分", "hours": "店铺多 10:00–21:00 前后", "body": "带顶棚的购物街，从长堀通一路通到道顿堀，药妆、服饰、点心店连成一线。下雨天也能一直走到戎桥。", "note": "人流大，推车靠边走；比 ote": "休息的周四不固定，3/25 周四去之前看官网。", "links": [{"label": "纯喫茶アメリカン", "url": "https://www.junkissa-american.com/access.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%B4%94%E5%96%AB%E8%8C%B6%E3%82%A2%E3%83%A1%E3%83%AA%E3%82%AB%E3%83%B3+%E9%81%93%E9%A0%93%E5%A0%80", "id": "O10"}, {"name": "道頓堀の名物：大阪烧・乌冬・章鱼烧・串炸", "k": ["eat"], "ring": 1, "walk": "约 10–15 分", "hours": "各店不同", "body": "五晚足够每次只吃一样：千房道顿堀大厦店的大阪烧，坐下全家分食；今井本店的きつねうどん是甜口油豆腐配高汤乌冬，想吃温和一点时去；わなか的章鱼烧路过分一份；串炸去だるま法善寺店，两人起可预约，不用专程跑新世界。", "note": "串炸だるま法善寺店开到 22:30。铁板边留意孩子伸手；章鱼烧内馅很烫，稍凉再分给孩子。", "links": [{"label": "千房", "url": "https://shop.chibo.com/detail/28/"}, {"label": "道顿堀今井", "url": "https://www.d-imai.com/"}, {"label": "わなか", "url": "https://www.takoyaki-wanaka.com/"}, {"label": "だるま法善寺店", "url": "https://www.kushikatu-daruma.com/location/houzenji"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%81%93%E9%A0%93%E5%A0%80", "id": "O11"}, {"name": "はり重グリル", "k": ["eat"], "ring": 1, "walk": "约 12 分", "hours": "周二休", "body": "1919 年创业的黑毛和牛老店。グリル这边卖炸牛排、汉堡排这类洋食，大人孩子都好点。", "note": "**3/23 周二休息。**营业时间看官网，可以网上订位。", "links": [{"label": "はり重", "url": "https://www.harijyu.co.jp/contents/tenpo/doutonbori/grill/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%AF%E3%82%8A%E9%87%8D%E3%82%B0%E3%83%AA%E3%83%AB+%E9%81%93%E9%A0%93%E5%A0%80", "id": "O12"}, {"name": "金龍ラーメン 道頓堀店", "k": ["eat", "night"], "ring": 1, "walk": "约 12 分", "hours": "24 小时 · 全年无休", "body": "屋顶趴着一条大龙的拉面摊，猪骨鸡骨熬的清汤，泡菜和蒜自己加。深夜散步完来一碗最方便。", "note": "", "links": [{"label": "店铺信息", "url": "https://co-trip.jp/spot/49330"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%87%91%E9%BE%8D%E3%83%A9%E3%83%BC%E3%83%A1%E3%83%B3+%E9%81%93%E9%A0%93%E5%A0%80%E5%BA%97", "id": "O13"}, {"name": "一蘭 道頓堀店 別館", "k": ["eat", "night"], "ring": 1, "walk": "约 10–15 分", "hours": "柜台 24 小时；桌席到 23:00", "body": "夜景散步后吃面，再沿心斋桥方向回来，是很容易执行的一小圈。官方目前桌席到23点，单人柜台24小时。", "note": "搜“别馆”。道顿堀本馆已有关闭公告，不能拿旧店地址当备选。", "links": [{"label": "一兰道顿堀别馆", "url": "https://ichiran.com/shop/kinki/dotonbori-south/"}, {"label": "一兰道顿堀本馆关闭公告", "url": "https://ichiran.com/shop/kinki/dotonbori-main/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%80%E8%98%AD+%E9%81%93%E9%A0%93%E5%A0%80%E5%BA%97%E5%88%A5%E9%A4%A8", "id": "O14"}, {"name": "アメリカ村／三角公園", "k": ["see", "shop"], "ring": 1, "walk": "约 10–12 分", "hours": "店铺多中午后开", "body": "心斋桥西边的年轻人街区，古着、街头服饰和涂鸦招牌。三角公园是街区中心，买盒章鱼烧坐长椅吃。", "note": "三角公園更像街区聚集点，不是幼儿放电的大草坪。孩子需要活动空间时选てんしば或别的公园。", "links": [{"label": "アメリカ村官方观光资料", "url": "https://osaka-info.jp/spot/america-mura-american-village/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%A2%E3%83%A1%E3%83%AA%E3%82%AB%E6%9D%91+%E4%B8%89%E8%A7%92%E5%85%AC%E5%9C%92", "id": "O15"}, {"name": "甲賀流 アメリカ村本店", "k": ["snack"], "ring": 1, "walk": "约 12 分", "hours": "10:30–20:30（周六、节假日到 21:30）", "body": "号称“章鱼烧淋美乃滋”的元祖店，外皮软嫩。买一盒去旁边三角公园坐着吃，是美国村的标准吃法。", "note": "店内没什么座位。", "links": [{"label": "店铺介绍", "url": "https://www.ittoko-minami.net/gourmet/kougaryu-amemura"}], "map": "https://www.google.com/maps/search/?api=1&query=%E7%94%B2%E8%B3%80%E6%B5%81+%E3%82%A2%E3%83%A1%E3%83%AA%E3%82%AB%E6%9D%91%E6%9C%AC%E5%BA%97", "id": "O16"}, {"name": "北極星 心斎橋本店", "k": ["eat"], "ring": 1, "walk": "约 12–15 分", "hours": "11:30–21:30（最后点单 21:00）· 无休", "body": "1925 年在这里发明了蛋包饭的店。房子是 1950 年的町屋，榻榻米座位，窗外有小庭院。孩子大人都能点，是大阪很稳的一顿家庭晚饭。", "note": "", "links": [{"label": "北极星心斋桥本店", "url": "https://osakamania.jp/shop/omelet-rice_01/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%8C%97%E6%A5%B5%E6%98%9F+%E5%BF%83%E6%96%8E%E6%A9%8B%E6%9C%AC%E5%BA%97", "id": "O17"}, {"name": "551蓬莱 本店", "k": ["snack", "eat"], "ring": 1, "walk": "约 15 分", "hours": "外带 10:00–21:30 · 每月第一、三个周二休", "body": "戎桥筋上的豚包老店。买几个回房当夜宵或第二天早餐；2–3 楼也能坐下吃中餐。", "note": "3/16 第三个周二你们还在东京，大阪期间都开。", "links": [{"label": "551蓬莱本店", "url": "https://www.551horai.co.jp/shop/list/13/"}], "map": "https://www.google.com/maps/search/?api=1&query=551%E8%93%AC%E8%8E%B1+%E6%9C%AC%E5%BA%97", "id": "O18"}, {"name": "りくろーおじさんの店 なんば本店", "k": ["snack"], "ring": 1, "walk": "约 15 分", "hours": "9:00–20:00；2F 咖啡 11:00–17:30", "body": "现烤芝士蛋糕，一整个圆的拎回房，四个人切开分。2–3 楼的咖啡室能吃到店里限定的甜点。", "note": "不接受预约；人多时会限购。", "links": [{"label": "なんば本店", "url": "https://www.rikuro.co.jp/shoplist/134.html"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%8A%E3%81%8F%E3%82%8D%E3%83%BC%E3%81%8A%E3%81%98%E3%81%95%E3%82%93%E3%81%AE%E5%BA%97+%E3%81%AA%E3%82%93%E3%81%B0%E6%9C%AC%E5%BA%97", "id": "O19"}, {"name": "北極 なんば本店", "k": ["snack"], "ring": 1, "walk": "约 15 分", "hours": "10:00–20:30 · 全年无休", "body": "开了五十多年的大阪老派冰棍店，用老做法一根根做。走累了一人一根，2 楼还有个小咖啡座。", "note": "", "links": [{"label": "北极なんば本店", "url": "https://ebisubashisuji.or.jp/shops/hokkyoku/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%8C%97%E6%A5%B5+%E3%81%AA%E3%82%93%E3%81%B0%E6%9C%AC%E5%BA%97", "id": "O20"}, {"name": "黒門市場", "k": ["snack", "see"], "ring": 1, "walk": "约 15 分", "hours": "白天；多数店傍晚收", "body": "把市场当食材与街市体验：看海鲜、买一份当场吃的熟食，或给孩子找水果。它和电电城是相邻但不同的街区。", "note": "先看价目和份量，再决定是否买。需要全家坐着吃饱时，优先寿司店或商场。", "links": [{"label": "黒門市場官方店铺图", "url": "https://kuromon.com/en/official-store-map/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%BB%92%E9%96%80%E5%B8%82%E5%A0%B4", "id": "O21"}, {"name": "千日前道具屋筋", "k": ["shop", "see"], "ring": 1, "walk": "约 15 分", "hours": "白天店铺为主", "body": "对你们家来说，一件小餐具、饭勺或有趣的食品模型，可能比大盒收藏品更容易经常用。", "note": "刀具托运及带回美规则另查；先量尺寸和重量，别买到箱子里根本装不下。", "links": [{"label": "千日前道具屋筋", "url": "https://www.doguyasuji.or.jp/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E5%8D%83%E6%97%A5%E5%89%8D%E9%81%93%E5%85%B7%E5%B1%8B%E7%AD%8B", "id": "O22"}, {"name": "高津宮", "k": ["see"], "ring": 1, "walk": "约 15 分", "hours": "境内随时", "body": "祭祀仁德天皇的古社，在上町台地的坡上。它是落语「高津の富」的舞台，境内还有说书场，五代目桂文枝最后一次高座就在这里。", "note": "坡道和石阶多，推车绕路。", "links": [{"label": "高津宮（维基）", "url": "https://ja.wikipedia.org/wiki/%E9%AB%98%E6%B4%A5%E5%AE%AE"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E6%B4%A5%E5%AE%AE", "id": "O23"}, {"name": "難波千日前公園", "k": ["kids"], "ring": 1, "walk": "约 15–20 分", "hours": "全天开放", "body": "酒店附近没有大公园，这是最近的一个有游具的：组合游具、秋千、沙坑、攀爬架。孩子憋坏了就来跑一跑。", "note": "小公园，没有厕所，先在商场上好。", "links": [{"label": "公园资料", "url": "https://www.koentanbo.com/osaka/nanbasennichimae/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E9%9B%A3%E6%B3%A2%E5%8D%83%E6%97%A5%E5%89%8D%E5%85%AC%E5%9C%92", "id": "O24"}, {"name": "难波的游戏中心", "k": ["kids", "night"], "ring": 1, "walk": "约 10–15 分", "hours": "营业：开到 23:30–24:00｜孩子：16 岁以下 18:00 后须家长陪同、最晚 22:00", "body": "タイトーステーション 難波店（太空侵略者红招牌，开到 24:00）和 GiGO 大阪道頓堀本店（开到 23:30 前后）都在夜景散步的路上。 带孩子去放在白天或傍晚；关门前那几个小时只适合爸爸。", "note": "道顿堀的えびすタワー摩天轮傍晚就停，不是夜里的项目。复古店关得早：美国村的弹珠台店 THE SILVER BALL PLANET 11:00–20:00，新世界的かすが娯楽場 10:00–22:00、周四休，白天带哥哥去。 儿童时限按 Taito 公布的大阪规则：16 岁以下 18:00 后须家长陪同、最晚 22:00，18 岁以下 22:00 后不能入场；GiGO 等其他运营商以门店告示为准。核对于 2026/10/3。", "links": [{"label": "タイトーステーション 難波店", "url": "https://www.taito.co.jp/store/00001910"}, {"label": "THE SILVER BALL PLANET", "url": "https://silverballplanet.jp/"}, {"label": "かすが娯楽場", "url": "https://en.kasugagorakujou.com/access"}, {"label": "Taito：未成年入场时间规定", "url": "https://www.taito.co.jp/gc/special/new_regulation"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%82%BF%E3%82%A4%E3%83%88%E3%83%BC%E3%82%B9%E3%83%86%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3+%E9%9B%A3%E6%B3%A2%E5%BA%97", "id": "O25"}, {"name": "丸福珈琲店 千日前本店", "k": ["snack", "eat"], "ring": 1, "walk": "约 12–15 分", "hours": "8:00–23:00（店家注明可能变动）", "body": "1934 年开业的大阪老牌咖啡店，以浓郁的深烘出名。招牌是铜板一张一张烤的松饼，配黄油、蜂蜜和枫糖浆。一楼二楼加起来一百多个座位，老式家具很有年代感。", "note": "这是全家一起去最合适的一家喫茶店：孩子吃松饼，你喝咖啡。早上 8 点就开，也可以当早餐；官网的モーニング套餐只在平日，3/22 是振替休日，可能没有。核对于 2026/10/3，出发前再看店家公告。", "links": [{"label": "丸福珈琲店 千日前本店（官方）", "url": "https://marufukucoffeeten.com/store/marufukucoffee-sennichimae/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E4%B8%B8%E7%A6%8F%E7%8F%88%E7%90%B2%E5%BA%97%20%E5%8D%83%E6%97%A5%E5%89%8D%E6%9C%AC%E5%BA%97", "id": "O29"}, {"name": "なんばパークス：屋顶花园＋室内游戏区", "k": ["kids"], "ring": 2, "walk": "约 20–25 分", "hours": "花园 10:00–24:00；5F 游戏区平日 11:00–19:00、周末到 20:00", "body": "9F 有人工草坪广场和攀爬墙，8F 有草坡，孩子能好好跑一场，免费。下雨就去 5F 的 DADWAY Play Studio，只收学龄前孩子，哥哥妹妹正好。", "note": "游戏区费用看现场。也可以坐御堂筋线一站到难波。", "links": [{"label": "パークスガーデン", "url": "https://nambaparks.com/garden"}, {"label": "DADWAY Play Studio", "url": "https://nambaparks.com/shopresearch/7"}], "map": "https://www.google.com/maps/search/?api=1&query=%E3%81%AA%E3%82%93%E3%81%B0%E3%83%91%E3%83%BC%E3%82%AF%E3%82%B9", "id": "O26"}, {"name": "裏なんば", "k": ["eat", "night"], "ring": 2, "walk": "约 15–20 分", "hours": "很多店开到午夜", "body": "南海难波站东侧到日本桥站之间、千日前通以南的几条小街，是本地人下班喝一杯的地方。立饮和烤内脏小店密集，站着喝一杯、吃两串就走，很大阪。", "note": "店都很小，先看墙上的价格再坐。代表店如大阪焼きトンセンター，营业时间以当晚为准。", "links": [{"label": "裏なんば介绍", "url": "https://kinarino.jp/cat8/36212"}], "map": "https://www.google.com/maps/search/?api=1&query=%E8%A3%8F%E3%81%AA%E3%82%93%E3%81%B0", "id": "O27"}, {"name": "梅田スカイビル 空中庭園（御堂筋线三站）", "k": ["see", "night"], "ring": 2, "walk": "约 25 分", "hours": "9:30–22:30（最后入场 22:00）· 成人 ¥2,000", "body": "想拍一张大阪全景夜景，这里最省事：心斋桥站坐御堂筋线到梅田约 7 分钟，再走地下通道到大楼。顶层是露天的环形回廊，九点出门也来得及。", "note": "要走大楼外侧的展望台专用入口，东西两栋的电梯上不去。营业时间可能临时调整，当天看官网。", "links": [{"label": "营业时间与票价", "url": "https://www.skybldg.co.jp/observatory/information/"}], "map": "https://www.google.com/maps/search/?api=1&query=%E6%A2%85%E7%94%B0%E3%82%B9%E3%82%AB%E3%82%A4%E3%83%93%E3%83%AB+%E7%A9%BA%E4%B8%AD%E5%BA%AD%E5%9C%92%E5%B1%95%E6%9C%9B%E5%8F%B0", "id": "O28"}]}]}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const CITY = {dep:['出发','Departure'], tokyo:['東京','Tokyo'], hakone:['箱根','Hakone'], osaka:['大阪','Osaka'], ret:['返程','Return'], misc:['索引与心得','Index & tips']};
const STAY = {dep:'机上', tokyo:'MONday 上野新御徒町 · 5 晚', hakone:'箱根吟游 · 月・和室 · 2 晚 · 申请中', osaka:'MONday apart 心斋桥 · 5 晚', ret:'羽田附近 1 晚 · 待定'};
const BOOK = {eat:['吃','食'], shop:['买','买'], see:['玩','观']};
const KIND = {eat:['食','吃饭'], snack:['甜','小吃甜点'], shop:['买','买'], see:['观','看 · 逛'], kids:['遊','孩子放电'], night:['夜','九点以后']};
const JA_RX = /[぀-ヿ]/;
// wrap text: escape, link 附录 X, mark search hits
function fmt(t, q){
  let h = esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/附录\s?([A-F])(?:[、，‑-]\s?([A-F]))?/g, (m,a,b) =>
    '<a class="ax" href="#info-'+a+'">附录 '+a+'</a>' + (b ? '、<a class="ax" href="#info-'+b+'">'+b+'</a>' : ''));
  if (q) h = hl(h, q);
  return h;
}
function hl(html, q){
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return html.replace(/(^|>)([^<]*)/g, (m, a, txt) => a + txt.replace(rx, x => '<mark>'+x+'</mark>'));
}
const langAttr = t => JA_RX.test(t) ? ' lang="ja"' : '';
const linkRow = e => '<div class="lk">'+(e.map ? '<a class="map" href="'+esc(e.map)+'" target="_blank" rel="noopener">地图 <span class="ar">↗</span></a>' : '')
  + e.links.map(l => '<a href="'+esc(l.url)+'" target="_blank" rel="noopener"'+langAttr(l.label)+'>'+esc(l.label)+' <span class="ar">↗</span></a>').join('')+'</div>';
const kd = k => '<i class="kd k-'+k+'" title="'+KIND[k][1]+'">'+KIND[k][0]+'</i>';

/* ----- dates ----- */
function jstToday(){ const d = new Date(Date.now() + 9*3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
const START = Date.UTC(2027,2,13), END = Date.UTC(2027,2,27);
const T = jstToday();
const todayN = (T >= START && T <= END) ? Math.round((T-START)/864e5)+1 : null;
(function status(){
  const el = $('#status');
  if (todayN) el.innerHTML = '日本今天是 <b>DAY '+pad(todayN)+'</b><a href="#d'+todayN+'">打开今天 →</a>';
  else if (T < START) el.innerHTML = '距出发还有 <b>'+Math.round((START-T)/864e5)+'</b> 天 · 内容核对于 2026/10/3';
  else el.innerHTML = '旅程已结束 · 欢迎回家';
})();
function dayChips(ns){
  return '<div class="dchips">'+ns.map(n => { const d = D.days[n-1];
    return '<a class="c-'+d.city+'" href="#d'+n+'"><b>DAY '+pad(n)+'</b><span lang="ja">'+esc(d.ja)+'</span><small>'+d.date+' '+esc(d.dow)+'</small></a>'; }).join('')+'</div>';
}

/* ----- itinerary ----- */
function renderTrip(){
  const groups = [];
  D.days.forEach(d => { const g = groups[groups.length-1]; if (g && g.city === d.city) g.days.push(d); else groups.push({city:d.city, days:[d]}); });
  let h = '<div class="vhead"><h2>行程 · 15 站</h2><p>每天一个主项目。点开某一天，看路线、住处、吃买看，以及这一带还能去哪。</p></div>';
  groups.forEach(g => {
    h += '<div class="c-'+g.city+'"><div class="city-h"><span class="nm" lang="ja">'+CITY[g.city][0]+'</span><span class="ro">'+CITY[g.city][1]+'</span><span class="cstay">'+esc(STAY[g.city])+'</span></div><ol class="line">';
    g.days.forEach((d,i) => {
      const cls = ['stop', i===0?'first':'', i===g.days.length-1?'last':'', d.n===todayN?'today':''].join(' ');
      h += '<li class="'+cls+'"><a href="#d'+d.n+'"><span class="dn">DAY<b>'+pad(d.n)+'</b></span>'
        + '<span class="t1"><span class="sn" lang="ja">'+esc(d.ja)+'</span><span class="dt">'+d.date+' <span class="zh">'+esc(d.dow)+'</span></span>'
        + (d.n===todayN?'<span class="tag-today">TODAY</span>':'')+'</span>'
        + '<span class="t2">'+esc(d.title)+'</span></a></li>';
    });
    h += '</ol></div>';
  });
  $('#v-trip').innerHTML = h;
}

/* ----- day ----- */
function relCard(r){
  const [b,c] = r.split(':');
  if (b === 'base'){
    const s = D.base.find(x => x.code === c);
    return '<a class="c-'+s.city+'" href="#base-'+s.code+'"><span class="bk" lang="ja">宿</span><span class="tx"><b lang="ja">宿 · '+esc(s.sign)+'</b><span>酒店步行圈里的吃买玩</span></span><span class="n">'+s.entries.length+' 处 →</span></a>';
  }
  const s = D.books[b].sections.find(x => x.code === c);
  if (!s) return '';
  return '<a class="c-'+s.city+'" href="#'+b+'-'+s.code+'"><span class="bk" lang="ja">'+BOOK[b][1]+'</span><span class="tx"><b'+langAttr(s.area)+'>'+BOOK[b][0]+' · '+esc(s.area)+'</b><span>'+esc(s.head)+'</span></span><span class="n">'+s.entries.length+' 项 →</span></a>';
}
function renderDay(n){
  const d = D.days[n-1], prev = D.days[n-2], next = D.days[n];
  const li = a => a.map(x => '<li>'+fmt(x)+'</li>').join('');
  let h = '<div class="c-'+d.city+'"><a class="back" href="#trip">← 全部行程</a>'
    + '<div class="sign"><div class="top"><div class="big" lang="ja">'+esc(d.ja)+'</div><div class="rom">'+esc(d.ro)+'</div></div>'
    + '<div class="band">'
    + (prev ? '<a href="#d'+prev.n+'" aria-label="前一天"><small>◀ '+pad(prev.n)+'</small><b lang="ja">'+esc(prev.ja)+'</b></a>' : '<span class="nil"></span>')
    + '<span class="mid">DAY '+pad(d.n)+'</span>'
    + (next ? '<a href="#d'+next.n+'" aria-label="后一天"><b lang="ja">'+esc(next.ja)+'</b><small>'+pad(next.n)+' ▶</small></a>' : '<span class="nil"></span>')
    + '</div><div class="under"><span>2027 · '+d.date+' <span class="zh">'+esc(d.dow)+'</span></span><span class="zh"'+langAttr(d.area)+'>'+esc(d.area)+'</span></div></div>'
    + '<div class="dtitle"><h2>'+esc(d.title)+'</h2><p>'+fmt(d.sub)+'</p>'+(d.judge?'<span class="judge">'+esc(d.judge)+'</span>':'')+'</div>'

function applyFilter(code){
  const v = $('#v-base'), f = bfilter[code] || 'all';

  const bs = D.base.find(x => x.code === code);
  v.querySelectorAll('.be').forEach(li => { const e = bs.entries.find(x => 'be-'+x.id === li.id);

      + '<div class="lk">'+a.links.map(l => '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' <span class="ar">↗</span></a>').join('')+'</div></div>';

function show(v){ document.querySelectorAll('.view').forEach(x => x.hidden = x.id !== 'v-'+v); }
function route(){
  const h = (location.hash || '#trip').slice(1);
  let tab = 'trip', target = null;
  let m;
  // old bookmarks to the retired night sections
  if (/^(eat|see)-N1$/.test(h)) { location.replace('#base'); return; }
  // stations folded into 「宿」 or removed in the 2026/10 review
  const MOVED = {'eat-T1':'base-T','shop-T1':'shop-T2','eat-O1':'base-O','shop-O1':'base-O','see-O1':'base-O','shop-T4':'shop','see-T4':'see','see-T7':'see'};
  if (MOVED[h]) { location.replace('#'+MOVED[h]); return; }
  if ((m = h.match(/^d(\d{1,2})$/)) && +m[1] >= 1 && +m[1] <= D.days.length){ renderDay(+m[1]); show('day'); tab='trip'; }
  else if (h === 'base'){ renderBaseIndex(); show('base'); tab='base'; }
  else if ((m = h.match(/^base-([A-Z])$/)) && renderBase(m[1])){ show('base'); tab='base'; }
  else if ((m = h.match(/^base-(([A-Z])\d{2})$/)) && renderBase(m[2], m[1])){
    show('base'); tab='base'; target = document.getElementById('be-'+m[1]);
    target.classList.add('flash');
  }
  else if ((m = h.match(/^(eat|shop|see)(?:-([A-Z0-9]+))?$/))){
    show(m[1]); tab = m[1];
    const v = $('#v-'+m[1]), st = m[2] && renderStation(m[1], m[2]);
    v.querySelector('.idx').hidden = !!st; v.querySelector('.stp').hidden = !st;
  }
  else if ((m = h.match(/^info(?:-([A-Za-z]+))?$/))){ show('info'); tab='info'; if (m[1]) target = document.getElementById('info-'+m[1]); }
  else show('trip');
  document.getElementById('mast').hidden = !(tab==='trip' && !h.startsWith('d'));
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  if (target) requestAnimationFrame(() => target.scrollIntoView({block: target.classList.contains('be') ? 'center' : 'start', behavior:'instant'}));
  else window.scrollTo({top:0, behavior:'instant'});
}
window.addEventListener('hashchange', route);
// in-page links: set the hash directly so navigation never depends on a <base> URL
document.addEventListener('click', e => {
  const l = e.target.closest('a[href^="#"]'); if (!l || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const h = l.getAttribute('href');
  if (l.dataset.bq != null) bq = l.dataset.bq;
  if (location.hash === h) route(); else location.hash = h;
});
route();
})();
</script>
