<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f0">
<meta name="color-scheme" content="light">
<meta name="description" content="家里一周吃什么：从自家菜谱里抽菜，自动列出买菜清单。">
<title>家里的饭</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='27' rx='2' fill='%23b8262c'/%3E%3Crect x='12' y='8' width='8' height='2' fill='%23fff5df'/%3E%3Crect x='12' y='14' width='8' height='2' fill='%23fff5df'/%3E%3Crect x='12' y='20' width='8' height='2' fill='%23fff5df'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --tile:#f2f4f0; --grout:#e1e6e0;
  --skirt:#9fc6b0; --skirt-edge:#5f8f77;
  --ink:#1d2420; --muted:#5d6a63; --line:#dfe4de; --soft:#eef1ed; --paper:#ffffff;
  --rou:#b8262c; --su:#2c6a4e; --zhu:#e2ae45; --zhu-ink:#2b1f0c; --qi:#47524c; --tag-text:#fff5df;
  --rail:#7d5f3e;
  --f-ui:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --tag-h:170px;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-ui);-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #e2ae45;outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 墙：瓷砖、横杆、菜牌、绿墙裙 ---------- */
.wall{background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px}
.wall-in{max-width:720px;margin:0 auto;padding:14px 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-brush);font-size:26px;line-height:1;letter-spacing:.04em;margin:0;font-weight:400}
.bar-r{display:flex;align-items:center;gap:10px;min-width:0}
.range{font-size:13px;color:var(--muted);white-space:nowrap}
.icon{border:1px solid #c9d2cb;background:#fff;border-radius:10px;min-width:44px;height:40px;padding:0 12px;font-size:14px;flex:none}

.board{margin-top:16px;position:relative;padding-top:12px}
.board::before{content:"";position:absolute;left:0;right:0;top:34px;height:5px;border-radius:3px;background:var(--rail);box-shadow:0 2px 0 #0000001a}
.cols{display:grid;gap:6px;justify-content:center;position:relative}
.col{display:flex;flex-direction:column;align-items:center;min-width:0}
.day-h{height:24px;font-size:13px;line-height:1.1;text-align:center;color:var(--muted);white-space:nowrap}
.day-h b{color:var(--ink);font-size:15px;margin-right:2px}
.day-h.today b{color:var(--rou)}
.hang{width:100%;display:flex;flex-direction:column;gap:8px;padding-top:16px}
.tag{position:relative;width:100%;border:0;border-radius:3px 3px 5px 5px;padding:10px 0 34px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tag-text);
  box-shadow:inset 0 0 0 2px #ffffff26,0 3px 0 #00000014;transform-origin:50% -14px;transition:transform .18s}
.tag::before{content:"";position:absolute;top:-14px;left:50%;width:1px;height:14px;background:#6d5a44}
.tag.rou{background:var(--rou)} .tag.su{background:var(--su)} .tag.qi{background:var(--qi)}
.tag.zhu{background:var(--zhu);color:var(--zhu-ink);box-shadow:inset 0 0 0 2px #ffffff40,0 3px 0 #00000014}
.tag .name{font-family:var(--f-brush);writing-mode:vertical-rl;text-orientation:upright;font-size:clamp(17px,5.4vw,21px);line-height:1.05;letter-spacing:.04em;height:var(--tag-h);overflow:hidden}
.tag .seal{font-size:11px;line-height:1;padding:3px;border:1px solid currentColor;border-radius:2px;opacity:.9}
.tag .hot{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:11px;line-height:1;padding:3px;border-radius:2px;background:#fff5df;color:var(--rou)}
.tag.zhu .hot{background:var(--rou);color:#fff5df}
.tag .pin{position:absolute;top:-19px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#d23a2f;box-shadow:inset -2px -2px 0 #00000030,0 1px 2px #0005;display:none}
.tag.locked::before{display:none}.tag.locked .pin{display:block}
.tag.empty{background:transparent;border:2px dashed #b9c4bd;box-shadow:none;color:var(--muted)}
.tag.empty .name{font-family:var(--f-ui);font-size:13px;letter-spacing:.2em;display:flex;align-items:center;justify-content:center}
.tag[aria-pressed="true"]{transform:translateY(6px);box-shadow:inset 0 0 0 2px #ffffff40,0 0 0 3px var(--ink),0 8px 14px #0000002e}
.tag.empty[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.tag.swing{animation:swing .55s ease-out}
@keyframes swing{0%{transform:rotate(0)}25%{transform:rotate(7deg)}55%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.tag{transition:none}.tag.swing{animation:none}}

.key{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin:16px 0 0;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.skirt{margin-top:16px;background:var(--skirt);border-top:6px solid var(--skirt-edge)}
.skirt-in{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;gap:10px;align-items:stretch}
.btn{min-height:46px;border-radius:12px;border:1px solid transparent;padding:4px 16px;font-weight:700;font-size:15px;line-height:1.3}
.btn.main{flex:1;background:var(--ink);color:#fff}
.btn.plain{background:#fff;border-color:var(--line)}
.skirt .btn.plain{background:#ffffffcc;border-color:#7fa792;flex:none}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.75;line-height:1.2}
body:not([data-tab="menu"]) :is(.board,.key,.skirt){display:none}
body:not([data-tab="menu"]) .wall-in{padding-bottom:12px}

/* ---------- 内容 ---------- */
.page{max-width:720px;margin:0 auto;padding:20px 16px 28px}
.when{font-size:14px;color:var(--muted);margin:0}
.dish{font-family:var(--f-brush);font-weight:400;font-size:44px;line-height:1.15;margin:2px 0 8px;letter-spacing:.02em;overflow-wrap:anywhere}
.dish.none{font-family:var(--f-ui);font-size:22px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:#3f4c45;white-space:nowrap}
.chip.k-rou{background:#f8e3e3;color:var(--rou)} .chip.k-su{background:#e1efe7;color:var(--su)} .chip.k-zhu{background:#faefd5;color:#7a5612} .chip.k-qi{background:#e6e9e7;color:var(--qi)}
.chip.hot{background:var(--rou);color:#fff}
.uses{margin:14px 0 0;font-size:14px;color:#3f4c45}
.uses b{font-weight:500;color:var(--muted);margin-right:6px}
.row{display:flex;gap:8px;margin-top:16px}
.row .btn{flex:1}
.btn[aria-pressed="true"]{background:#fff1f0;border-color:#e7b3ae;color:var(--rou)}
h2{font-size:17px;margin:28px 0 10px;line-height:1.4}
h2 small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-height:40px;font-size:14px;display:flex;align-items:center;gap:6px}
.pick i{width:8px;height:8px;border-radius:2px;flex:none}
.pick em{font-style:normal;color:var(--rou);font-size:12px}
.pick button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.extra{border-top:3px solid var(--zhu);padding:10px 0 0;min-width:0}
.extra span{font-size:12px;color:var(--muted)}
.extra b{display:block;font-family:var(--f-brush);font-weight:400;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.tools .btn{flex:1;min-width:140px}

/* 买菜 */
.shop-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop-top p{margin:0;font-size:14px;color:var(--muted)}
.shop-top b{color:var(--ink);font-size:20px;margin-right:2px}
.group h3{font-size:13px;color:var(--muted);font-weight:500;margin:22px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.item input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--su)}
.item .q{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .src{grid-column:2/4;font-size:12px;color:var(--muted);line-height:1.4}
.item .more{display:block;color:#8a4b0f}
.item.have .n,.item.have .q{color:#a3aca6;text-decoration:line-through}
.pantry{font-size:14px;color:#3f4c45;line-height:2;margin:6px 0 0}
.pantry span{display:inline-block;margin-right:12px}

/* 菜谱 */
.book-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:22px 0 4px}
.rgroup h3 i{width:12px;height:12px;border-radius:2px}
.rgroup h3 small{font-weight:400;color:var(--muted)}
details.recipe{border-bottom:1px solid var(--soft)}
details.recipe summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;cursor:pointer;min-height:44px}
details.recipe summary::-webkit-details-marker{display:none}
details.recipe summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s;flex:none}
details.recipe[open] summary::after{transform:rotate(-135deg)}
details.recipe summary span{flex:1;min-width:0;overflow-wrap:anywhere}
details.recipe summary .chip{margin-left:6px}
details.recipe ul{margin:0;padding:0;list-style:none;font-size:14px;color:#3f4c45;columns:2;column-gap:20px}
details.recipe li{display:flex;justify-content:space-between;gap:8px;break-inside:avoid;padding:2px 0}
details.recipe li em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.recipe-acts{display:flex;gap:8px;margin:10px 0 14px}
.recipe-acts .btn{min-height:38px;font-size:14px;font-weight:500}
.btn.danger{color:var(--rou)}
.book-foot{margin-top:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* 底部三栏 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;height:60px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs b{font-family:var(--f-brush);font-weight:400;font-size:22px;line-height:1}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] b{color:var(--rou)}

/* 底部弹出的面板 */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;background:#fff;color:var(--ink)}
dialog::backdrop{background:#1d242080}
.sheet{padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;min-width:52px;height:38px;padding:0 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.step output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.set input[type=date]{border:1px solid var(--line);border-radius:10px;height:38px;padding:0 10px;background:#fff;min-width:0}
.switch{width:46px;height:28px;border-radius:99px;border:0;background:#cfd6d1;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--su)}.switch[aria-checked="true"]::after{left:21px}
.sheet .btn.main{width:100%;margin-top:16px}
.field{display:block;margin:14px 0 0}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-height:44px}
.field textarea{min-height:150px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.sheet .err{color:var(--rou);font-size:13px;margin:10px 0 0}
.sheet-acts{display:flex;gap:10px;margin-top:16px}
.sheet-acts .btn{flex:1}

.acct{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 18px;font-size:14px}
.acct p{margin:0 0 10px}
.acct p:last-child{margin-bottom:0}
.acct .btn{width:100%;margin:0}
.acct .sheet-acts{margin-top:0}
.acct .uid code{display:block;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.warn{color:#8a4b0f}
.icon{position:relative}
.icon[data-sync]::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--tile);background:#b9c4bd}
.icon[data-sync="on"]::after{background:var(--su)}
.icon[data-sync="pending"]::after,.icon[data-sync="warn"]::after{background:var(--zhu)}
.sync-hint{font-size:13px;color:var(--muted);margin:16px 0 0}
.link{border:0;background:none;padding:0;color:var(--su);text-decoration:underline;text-underline-offset:3px;font-size:inherit;min-height:24px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:#fff;border-radius:10px;padding:8px 8px 8px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:12px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast span{padding:4px 0}
#toast button{border:0;background:#ffffff26;color:#fff;border-radius:8px;min-height:34px;padding:0 12px;font-weight:700;flex:none}

@media (min-width:640px){
  .tag .name{font-size:26px}
  .dish{font-size:52px}
}

/* 打印：一张纸上是这周的菜和买菜清单 */
#printout{display:none}
@media print{
  body{padding:0}
  body > :not(#printout){display:none!important}
  #printout{display:block;font-size:12pt;color:#000}
  #printout h1{font-family:var(--f-brush);font-weight:400;font-size:24pt;margin:0 0 6pt}
  #printout h2{font-size:13pt;margin:14pt 0 4pt}
  #printout table{border-collapse:collapse;width:100%}
  #printout td{border-bottom:1px solid #ccc;padding:4pt 6pt 4pt 0;vertical-align:top}
  #printout .pcols{columns:2;column-gap:24pt}
  #printout .pcols div{break-inside:avoid;margin-bottom:8pt}
  #printout p{margin:2pt 0}
}
</style>
</head>
<body data-tab="menu">
<header class="wall">
  <div class="wall-in">
    <div class="bar">
      <h1 class="brand">家里的饭</h1>
      <div class="bar-r"><span class="range" id="range"></span><button class="icon" id="openSet" data-f="openSet" aria-haspopup="dialog">设置</button></div>
    </div>
    <div class="board" role="group" aria-label="这一周的菜"><div class="cols" id="cols"></div></div>
    <div class="key" id="key" aria-hidden="true"></div>
  </div>
  <div class="skirt"><div class="skirt-in" id="drawBar"></div></div>
</header>

<main class="page">
  <section id="p-menu" role="tabpanel" aria-labelledby="t-menu"></section>
  <section id="p-shop" role="tabpanel" aria-labelledby="t-shop" hidden></section>
  <section id="p-book" role="tabpanel" aria-labelledby="t-book" hidden></section>
</main>

<nav class="tabs" aria-label="页面"><div class="tabs-in" role="tablist">
  <button role="tab" id="t-menu" data-tab="menu" aria-controls="p-menu" aria-selected="true"><b>菜</b>这周吃</button>
  <button role="tab" id="t-shop" data-tab="shop" aria-controls="p-shop" aria-selected="false" tabindex="-1"><b>买</b>买菜</button>
  <button role="tab" id="t-book" data-tab="book" aria-controls="p-book" aria-selected="false" tabindex="-1"><b>谱</b>菜谱</button>
</div></nav>

<dialog id="setSheet" aria-labelledby="setTitle"><div class="sheet">
  <section class="acct" id="acct" aria-label="和家里人共用" aria-live="polite"></section>
  <h2 id="setTitle">这一周怎么排</h2>
  <div class="set"><label for="sStart">从哪天开始</label><input type="date" id="sStart"></div>
  <div class="set"><span id="lDays">排几天</span><div class="seg" role="group" aria-labelledby="lDays" data-key="days"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7">7</button></div></div>
  <div class="set"><span id="lMode">排哪几顿</span><div class="seg" role="group" aria-labelledby="lMode" data-key="mode"><button data-v="dinner">晚饭</button><button data-v="both">午饭和晚饭</button></div></div>
  <div class="set"><span id="lPeople">几个人吃</span><div class="step" role="group" aria-labelledby="lPeople"><button data-d="-1" aria-label="少一人">−</button><output id="sPeople" aria-live="polite"></output><button data-d="1" aria-label="多一人">＋</button></div></div>
  <div class="set"><span id="lSpicy">排辣菜</span><button class="switch" role="switch" data-key="spicy" aria-labelledby="lSpicy"></button></div>
  <div class="set"><span id="lExtra">顺便排早饭和甜点</span><button class="switch" role="switch" data-key="withExtra" aria-labelledby="lExtra"></button></div>
  <button class="btn main" id="closeSet">好了</button>
</div></dialog>

<dialog id="recSheet" aria-labelledby="recTitle"><form class="sheet" id="recForm" novalidate>
  <h2 id="recTitle">加一道菜</h2>
  <label class="field"><span>菜名</span><input id="rName" maxlength="50" autocomplete="off" placeholder="比如：番茄炖牛腩"></label>
  <label class="field"><span>哪一类</span><select id="rType"></select></label>
  <div class="set"><span id="lRSpicy">辣的</span><button type="button" class="switch" role="switch" id="rSpicy" aria-labelledby="lRSpicy" aria-checked="false"></button></div>
  <label class="field"><span>用料（4 人份，一行一样）</span><textarea id="rIng" placeholder="牛腩 600 g&#10;西红柿 4 个&#10;土豆 2 个&#10;生抽"></textarea></label>
  <p class="hint">名字后面写数量和单位，买菜清单会按人数换算。调料只写名字就行。</p>
  <p class="err" id="rErr" role="alert" hidden></p>
  <div class="sheet-acts"><button type="button" class="btn plain" id="rCancel">取消</button><button type="submit" class="btn main" id="rSave">保存</button></div>
</form></dialog>

<div id="toast" role="status" aria-live="polite"><span></span><button type="button" hidden></button></div>
<div id="printout"></div>
<noscript><p style="padding:16px">这个页面需要打开 JavaScript。</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
